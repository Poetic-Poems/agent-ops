    // and the other from data of any age at all.
    var ghAgeBanner = githubAgeMin();
    if (ghAgeBanner != null && ghAgeBanner > GH_STALE_MIN) {
      banners.appendChild(el("div", {class:"banner amber"}, [
        el("span", {text: "⚠ GitHub data is " + fmtAgo(D.github.fetched_at).replace(/ ago$/, "") + " old."}),
        el("span", {class:"sub", text: "PRs, checks, issues, work sources and claims below were fetched at " +
          fmtTime(D.github.fetched_at) + "; the heartbeat refreshes them every 5 minutes. Check that " +
          "publish-dashboard-launcher.sh is running (grep 'github: refreshing' in dashboard.log)."})
      ]));
    }
    app.appendChild(banners);

    // ---------- fleet strip ----------
    if (fleetVisible()) app.appendChild(sectionOf("Fleet", fleetStrip()));

    // ---------- doctor (agent-ops#543) ----------
    app.appendChild(sectionOf("Doctor (unattended, hourly)", doctorPanel()));

    // ---------- stage health (agent-ops#662) ----------
    app.appendChild(sectionOf("Stage health", stageHealthPanel()));

    // ---------- metric cards ----------
    var c = D.counts || {};
    var cards = el("div", {class:"cards"});
    function card(k, v, sub) {
      cards.appendChild(el("div", {class:"card"}, [
        el("div", {class:"k"}, [ typeof k === "string" ? document.createTextNode(k) : k ]),
        el("div", {class:"v"}, [ typeof v === "string" ? document.createTextNode(v) : v,
          sub ? el("small", {text: " " + sub}) : null ])
      ]));
    }
    // The word "today" is itself the control (#186): click it to cycle
    // "today (GMT)" -> "today (local)" -> "last 24h" -> "today (GMT)" ...,
    // recomputing the figure beside it from `c` each time rather than waiting
    // for the next refresh, so the click feels immediate.
    var spendBtn = el("button", {class:"spendmode", type:"button", text: spendModeLabel(spendMode),
      title: "Click to cycle: today (GMT) → today (local) → last 24h",
      onclick: function () {
        spendMode = SPEND_MODES[(SPEND_MODES.indexOf(spendMode) + 1) % SPEND_MODES.length];
        saveSpendMode(spendMode);
        renderBody();
      }});
    card(el("span", {}, [document.createTextNode("Est. token cost "), spendBtn]), usd(spendForMode(spendMode, c)));
    card("Est. token cost (" + (c.by_day ? c.by_day.length : 0) + "d)", usd(c.spend_total_usd));
    card("Failures", String(c.failures_shown || 0), "of " + (c.cycles_shown||0) + " cycles");
    card("Reached ready", String(c.prs_reached_ready || 0));
    // back-pressure card — mirrors agent-cycle.sh's own four-part sum
    // (requirement 2.2) rather than recomputing a different one: the
    // pipeline trips its cap on draft PRs, ready PRs still
    // CHANGES_REQUESTED, and live claims — work already claimed whose PR
    // does not exist yet, so a node cannot see it in `openPrs` at all
    // (agent-ops#427). A ready PR approved or awaiting a human review sits
    // in a queue the pipeline cannot shrink by waiting, so it is shown as
    // its own figure rather than folded into "open" as if the pipeline
    // were idle.
    var rawN = openPrs.length, maxN = D.max_open_agent_prs || 0;
    var draftN = openPrs.filter(function (p) { return p.isDraft; }).length;
    var readyN = rawN - draftN;
    var humanQueueN = openPrs.filter(function (p) {
      return !p.isDraft && p.review_decision !== "CHANGES_REQUESTED";
    }).length;
    var pipelineReadyN = readyN - humanQueueN;
    // Which registry entries are "unraised claims" is lib/claim.sh's `do_count`
    // rule, and this is a transcription of it, not a second opinion: a card
    // that reports a different figure from the gate it depicts is worse than
    // no card. Two exclusions, mirrored from there.
    //
    // First, the registry is wider than the repos. The Enabler and the Refiner
    // claim engagement tombstones under the pseudo-slugs `enabler` and
    // `refiner` (implementation spec 35c) — never released, retired only by
    // `claim.sh gc` at `claim_ttl_hours`. `claim.sh count` is asked for one
    // configured repo at a time and so never sees them, an invariant lib/claim.sh
    // states in its own header; this page walks the whole registry in one tree
    // call and must re-impose it, or the gauge climbs with every item the
    // Enabler examines and pins red against a gate that is open.
    //
    // Second, a claim naming a pull request already counted above is that PR a
    // second time. That is the `pr-<n>` exclusion entry (issue #238), dropped
    // unconditionally because it is only ever written for a PR that exists, and
    // the `pr-<n>-<kind>-<scope>` item ref the four finishing sources use,
    // dropped only when its PR is in the draft or changes-requested sum. A
    // conflicted or dequeued PR sits in the human's queue, is excluded from
    // that sum, and its claim is then the only record of the work in flight —
    // so that one keeps counting.
    var claimRepos = ((D.config && D.config.repos) || []).map(function (r) { return r.slug; });
    var countedPr = {};
    openPrs.forEach(function (p) {
      if (p.isDraft || p.review_decision === "CHANGES_REQUESTED") countedPr[p.repo + "#" + p.number] = true;
    });
    var claimN = fleetClaims().filter(function (c) {
      if (claimRepos.indexOf(c.repo) < 0) return false;
      var key = c.key || "";
      if (/^pr-\d+$/.test(key)) return false;
      var named = /^pr-(\d+)-/.exec(key);
      return !(named && countedPr[c.repo + "#" + named[1]]);
    }).length;
    var adjN = pipelineReadyN + draftN + claimN;
    var rawOpenN = readyN + draftN + claimN;
    var composition = pipelineReadyN + " changes-requested + " + draftN + " draft + " + claimN +
      " unraised claim(s) — plus " + humanQueueN + " waiting on human (" + rawOpenN + " raw)";
    var gauge = el("div", {class:"gauge"}, el("span", {
      style: "width:" + (maxN ? Math.min(100, adjN/maxN*100) : 0) + "%;background:" + (adjN>=maxN && maxN ? "var(--red)" : "var(--accent)")
    }));
    cards.appendChild(el("div", {class:"card", title: composition}, [
      el("div", {class:"k", text:"Open agent PRs"}),
      el("div", {class:"v"}, [document.createTextNode(adjN + " "), el("small", {text:"/ " + maxN + " max"})]),
      gauge,
      el("small", {class:"muted", text: rawN + " open" +
        (humanQueueN ? ", " + humanQueueN + " waiting on human" : "")})
    ]));
    app.appendChild(cards);

    // ---------- open PRs ----------
    app.appendChild(sectionOf("Open pull requests", prsPanel(openPrs)));

    // ---------- autonomous landings ----------
    // Above the fleet's own bookkeeping and directly under the open pull
    // requests, because it is the same question one step later: these are the
    // pull requests that stopped being anybody's to merge.
    app.appendChild(sectionOf("Autonomous landings (last " + (((D.landings || {}).window_hours) || 24) + " h)", landingsPanel()));

    // ---------- revert rate by repository ----------
    // Directly under the landings it audits: D18's Stage 2 exit criterion
    // ("revert rate ≤ baseline") is a fact this panel makes checkable at a
    // glance, on the day it stops holding, rather than only at a promotion
    // review.
    app.appendChild(sectionOf("Revert rate by repository", revertRatePanel()));

    // ---------- live claims ----------
    if (fleetVisible()) app.appendChild(sectionOf("Live claims", claimsPanel()));

    // ---------- cycle history ----------
    app.appendChild(sectionOf(nodeFilter ? "Recent cycles — " + nodeFilter + " only (click its card to clear)" : "Recent cycles",
      cyclesPanel(D.cycles || [])));

    // ---------- failures & blocked ----------
    app.appendChild(sectionOf("Failures, blocked & void items", failuresPanel()));

    // ---------- inputs ----------
    app.appendChild(sectionOf("Work sources (what the Co-Ordinator sees)", inputsPanel()));

    // ---------- verdict quality ----------
    // Directly under the work sources, and deliberately: that panel is what
    // the Co-Ordinator was handed, this one is how often its answer about
    // that input survived the Script checking it.
    app.appendChild(sectionOf("Co-Ordinator verdict quality", verdictQualityPanel()));

    // ---------- cost & cadence + log ----------
    // A multi-column flow rather than a fixed grid: day, model, actor, then
    // the notes, in that order, letting the browser balance the split by
    // height (see .costgrid) instead of pinning day to a column of its own.
    var costgrid = el("div", {class:"costgrid"});
    costgrid.appendChild(el("div", {}, [ el("h2", {text:"Est. token cost by day"}), el("div", {class:"panel", style:"padding:14px"}, spendByDay()) ]));
    costgrid.appendChild(el("div", {}, [ el("h2", {text:"Est. token cost by model"}), el("div", {class:"panel", style:"padding:14px"}, spendByModel()) ]));
    costgrid.appendChild(el("div", {}, [ el("h2", {text:"Est. token cost by actor"}), el("div", {class:"panel", style:"padding:14px"}, spendByActor()) ]));
    costgrid.appendChild(el("p", {class:"costnote", text:
      "Cost figures are Claude Code's own local estimate, priced as if these tokens " +
      "had been billed per-token through the API. On a Claude subscription they are " +
      "not money charged and not a draw against the session or weekly limit — read " +
      "them as a measure of how much work the pipeline did, not what it cost. Plan " +
      "limits are not readable from here; check /usage in an interactive session. " +
      "All three charts cover the same transcripts — every actor of both pipelines, " +
      "across every node, since one Claude account pays for the fleet."}));
    costgrid.appendChild(el("p", {class:"costnote", text:
      "All figures on this page are US dollars (USD), regardless of the " +
      "Claude account's own billing currency or region."}));
    // The two model pies (issue #529), appended after the by-actor chart per
    // the issue's own placement: same two-column flow, same time-frame
    // control, a different measure (stage-end run counts, not spend).
    costgrid.appendChild(el("div", {}, [ el("h2", {text:"Model used — Implementer"}), el("div", {class:"panel", style:"padding:14px"}, stageModelPie("implementer")) ]));
    costgrid.appendChild(el("div", {}, [ el("h2", {text:"Model used — Reviewer"}), el("div", {class:"panel", style:"padding:14px"}, stageModelPie("reviewer")) ]));
    var sm = D.counts && D.counts.stage_models;
    if (sm) {
      costgrid.appendChild(el("p", {class:"costnote", text:
        "Each slice is one Implementer or Reviewer stage-end run of that model, " +
        "including runs that failed and retries — the question is which model was " +
        "dispatched, not whether the run succeeded. These two pies read the retained " +
        "log directly, which can span less history than the cost charts above: " +
        (sm.window_from ? fmtTime(sm.window_from) : "—") + " → " +
        (sm.window_to ? fmtTime(sm.window_to) : "—") + "."}));
    }
    app.appendChild(el("section", {}, [costWindowControl(), costgrid]));

    app.appendChild(sectionOf(nodeFilter ? "Recent log events — " + nodeFilter + " only (click its card to clear)" : "Recent log events",
      logPanel()));
    app.appendChild(sectionOf("cron.log (tail)", cronPanel()));

    window.scrollTo(0, y);
    restoreScrollPositions(savedScroll);
    prCardReanchor(reopenPr, reopenPinned);
  }

  // The header of a single-node page: this node's live state in full, off its
  // own lock. With no fleet strip to carry it, the header is the only place the
  // answer can go — and a one-node page renders exactly as it always did.
  function localHeader(live, st) {
    if (st.running && st.lock) {
      live.appendChild(el("span", {}, [ el("span",{class:"dot live"}), "running" ]));
      // A one-node page has no card to carry this, and it is the page most
      // likely to need it: nothing else here would ever contradict the lock.
      var over = stageOverrun((st.current || {}).stage, (st.current || {}).stage_since, D.generated_at);
      if (over) live.appendChild(el("span", {class:"badge b-amber", style:"margin-left:6px",
                                            title: over, text:"may be dead"}));
      var what = workDetail(st.current);
      if (what) { live.appendChild(el("span", {class:"muted", text:" · "})); live.appendChild(what); }
      live.appendChild(el("span", {class:"muted", text: " · since " + fmtTime(st.lock.started_at) + " (" + fmtAgo(st.lock.started_at) + ")"}));
    } else {
      live.appendChild(el("span", {}, [ el("span",{class:"dot idle"}), "idle" ]));
      if (st.last_cycle) live.appendChild(el("span", {class:"muted", text: " · last cycle " + fmtAgo(st.last_cycle.ended_at) }));
    }
  }

  // The header of a fleet page: how much of the fleet is working, not what any
  // one node is working on. Naming a single item up here would mean picking one
  // node's work to stand for every node's, which is exactly the reading that
  // stopped being true when the second container came up; the per-node answers
  // are on the cards a scroll below.
  function fleetHeader(live) {
    var nodes = fleetNodes();
    var running = nodes.filter(nodeRunning);
    var stale = nodes.filter(function (n) { return n.stale; });
    var doubted = nodes.filter(function (n) { return !!livenessDoubt(n); });
    live.appendChild(el("span", {title:"per-node state is on the fleet cards below"}, [
      el("span", {class:"dot " + (running.length ? "live" : "idle")}),
      running.length ? running.length + " of " + nodes.length + " nodes running"
                     : (nodes.length === 1 ? "idle" : "all " + nodes.length + " nodes idle")
    ]));
    // Who and on what, but only while that still fits in a header — past a few
    // nodes the list stops being a glance and the cards are the place to look.
    if (running.length && running.length <= 3) {
      live.appendChild(el("span", {class:"muted", title: running.map(function (n) { return n.node; }).join(", "),
        text: " · " + running.map(function (n) {
          var w = n.live || {};
          return n.node + (w.repo ? " → " + w.repo.split("/")[1] : (w.stage ? " → " + w.stage : ""));
        }).join(", ")}));
    } else if (!running.length && (D.status || {}).last_cycle) {
      live.appendChild(el("span", {class:"muted", text: " · last cycle " + fmtAgo(D.status.last_cycle.ended_at) +
        " on " + (D.status.last_cycle.node || "?")}));
    }
    if (doubted.length) live.appendChild(el("span", {class:"badge b-amber", style:"margin-left:8px",
      title: doubted.map(function (n) { return n.node + ": " + livenessDoubt(n); }).join("; "),
      text: doubted.length + " may be dead"}));
    if (stale.length) live.appendChild(el("span", {class:"badge b-red", style:"margin-left:8px",
      title: stale.map(function (n) { return n.node; }).join(", ") + " last pushed more than 30 minutes ago",
      text: stale.length + " stale"}));
  }

  // ---------- header live state + freshness ----------
  // Cheap; rebuilt on every tick (even when the body is unchanged) so the "data
  // Ns ago" clock and the running/idle dot stay live. The fleet strip is rebuilt
  // on the same tick for the same reason: its cards carry "since 18m ago"
  // clocks, and the body around them only re-renders when the data changes.
  function renderHeaderStatus() {
    var st = D.status || {};
    // Which node's publisher produced this page — every node renders the same
    // fleet, so this is what tells two otherwise identical tabs apart.
    document.getElementById("nodename").textContent = D.node ? "· " + D.node : "";
    var live = document.getElementById("livestate");
    live.innerHTML = "";
    if (fleetVisible()) fleetHeader(live); else localHeader(live, st);
    var strip = document.getElementById("fleetstrip");
    if (strip && strip.parentNode) strip.parentNode.replaceChild(fleetStrip(), strip);
    var fresh = document.getElementById("freshness");
    var gen = parseTs(D.generated_at);
    var ageMin = gen ? (Date.now() - gen.getTime())/60000 : 999;
    fresh.style.color = "";
    fresh.textContent = "data " + fmtAgo(D.generated_at);
    if (ageMin > 12) { fresh.style.color = "var(--amber)"; fresh.textContent += " ⚠ (heartbeat may be stopped)"; }
    var ghFresh = document.getElementById("ghfreshness");
    var ghAge = githubAgeMin();
    ghFresh.style.color = "";
    if (ghAge == null) {
      // Either the page has never had a GitHub fetch, or this publish was
      // --no-github with nothing cached behind it. Not an alarm.
      ghFresh.textContent = "· GitHub —";
    } else {
      ghFresh.textContent = "· GitHub " + fmtAgo(D.github.fetched_at);
      if (ghAge > GH_STALE_MIN) ghFresh.style.color = "var(--amber)";
    }
  }

  // ---------- SPA refresh ----------
  // Re-fetch data.js in place rather than reloading the page. A fresh <script>
  // element is injected (not fetch()) so this keeps working from a file:// URL
  // with no server and no CORS; a cache-busting query defeats HTTP caching so
  // each tick sees what the Publisher just wrote.
  function loadData(cb) {
    var s = document.createElement("script");
    s.src = "data.js?_=" + Date.now();
    s.onload = function () { if (s.parentNode) s.parentNode.removeChild(s); cb(window.DASHBOARD_DATA); };
    s.onerror = function () { if (s.parentNode) s.parentNode.removeChild(s); cb(null); };
    document.head.appendChild(s);
  }

  // Signature of everything except generated_at (which changes every publish
  // even when nothing else did). Lets us skip the body rebuild — and so keep
  // text selection, hovers and inner scroll intact — when the data is identical.
  function signature(d) {
    var clone = {};
    for (var k in d) if (k !== "generated_at") clone[k] = d[k];
    return JSON.stringify(clone);
  }

  var lastSig = null;
  function applyData(nd) {
    D = nd;
    var sig = signature(nd);
    if (sig === lastSig) return;   // nothing meaningful changed — leave the body as is
    lastSig = sig;
    renderBody();
  }

  var loading = false;
  function tick() {
    if (loading) return;           // don't stack fetches if one is slow
    loading = true;
    loadData(function (nd) {
      loading = false;
      if (nd) applyData(nd);
      renderHeaderStatus();        // tick the clock even when the body didn't change
    });
  }

  // ---------- refresh scheduling ----------
  // Interval is configurable via config.json's dashboard_refresh_seconds
  // (default 5s), matching the cadence publish-dashboard-launcher.sh writes at.
  var refreshMs = Math.max(1, (D.config && +D.config.dashboard_refresh_seconds) || 5) * 1000;
  var timer = null;
  function schedule() {
    if (timer) { clearInterval(timer); timer = null; }
    if (document.getElementById("autorefresh").checked) timer = setInterval(tick, refreshMs);
  }
  document.getElementById("autorefresh").addEventListener("change", schedule);
  document.getElementById("refreshbtn").addEventListener("click", tick);

  // ---------- first paint ----------
  renderBody();
  renderHeaderStatus();
  lastSig = signature(D);
  schedule();
})();
</script>
</body>
</html>
