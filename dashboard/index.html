<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Pipeline Dashboard</title>
<!-- Generated data lives in a sibling file the Publisher rewrites each run.
     A plain script tag (not a module) is used so this works from a file:// URL
     with no server. The page then refreshes itself in place (see the SPA
     loader at the foot of the script) by re-fetching this same file — it never
     does a full navigation, so expanded rows and scroll position survive. -->
<script src="data.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2024; --muted: #656d76;
    --line: #e2e5e9; --accent: #2b6cb0;
    --green: #1a7f37; --green-bg: #dafbe1; --red: #b42318; --red-bg: #ffe3e0;
    --amber: #9a6700; --amber-bg: #fff4d6; --blue: #0a5cc2; --blue-bg: #ddf0ff;
    --grey: #57606a; --grey-bg: #eef1f4;
    --purple: #6b40c4; --purple-bg: #f1ebfd; --teal: #0f766e; --pink: #b8266e;
    --shadow: 0 8px 24px rgba(16, 22, 30, .16);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #161b22; --ink: #e6edf3; --muted: #8b949e;
      --line: #2a2f37; --accent: #58a6ff;
      --green: #3fb950; --green-bg: #12261a; --red: #f85149; --red-bg: #2a1213;
      --amber: #d29922; --amber-bg: #2b2211; --blue: #58a6ff; --blue-bg: #0d2436;
      --grey: #8b949e; --grey-bg: #1b2027;
      --purple: #a78bfa; --purple-bg: #1e1633; --teal: #2dd4bf; --pink: #f472b6;
      --shadow: 0 8px 24px rgba(0, 0, 0, .55);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
         font-size: 14px; line-height: 1.5; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header.top { padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; position: sticky; top: 0; z-index: 5; }
  header.top h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  .grow { flex: 1 1 auto; }
  .freshness { font-size: 12px; color: var(--muted); }
  .docs { font-size: 12px; color: var(--muted); }
  .docs a { margin: 0 3px; }
  .controls { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
  .controls label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  button.refresh { font: inherit; font-size: 12px; padding: 4px 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); border-radius: 6px; cursor: pointer; }
  button.refresh:hover { border-color: var(--accent); }
  main { max-width: 1200px; margin: 0 auto; padding: 18px 20px 60px; }
  .banner { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-weight: 550;
    display: flex; gap: 10px; align-items: baseline; }
  .banner .sub { font-weight: 400; color: var(--muted); }
  .banner.amber { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber); }
  .banner.green { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
  .banner.red { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 22px; }
  /* The fleet cards carry a whole live-state readout each — stage, repo, work
     source and item — so they get a wider track than the metric cards do. */
  .cards.fleet { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .card .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .card .k button.spendmode { font: inherit; text-transform: inherit; letter-spacing: inherit;
    border: 0; background: none; padding: 0; margin: 0; color: var(--accent); cursor: pointer;
    text-decoration: underline dotted; text-underline-offset: 2px; }
  .card .k button.spendmode:hover { text-decoration-style: solid; }
  .card .k button.spendmode:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card .v { font-size: 22px; font-weight: 650; margin-top: 2px; }
  .card .v small { font-size: 13px; font-weight: 500; color: var(--muted); }
  .card.clickable { cursor: pointer; }
  .card.nodestale { border-color: var(--red); }
  .card.nodeselected { outline: 2px solid var(--accent); }
  .card .state { font-size: 14px; font-weight: 650; margin-top: 4px; }
  .card .work { font-size: 12.5px; margin-top: 4px; white-space: normal; word-break: break-word; }
  .card .when { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .card .hb { font-size: 11.5px; color: var(--muted); margin-top: 6px;
    border-top: 1px solid var(--line); padding-top: 5px; }
  .card .hb.stale { color: var(--red); }
  /* The code a node is running. It sits above the heartbeat line and below the
     border, with identity rather than with activity: what a node *is* running
     is a property of the node, not of the cycle in flight. */
  .card .ver { font-size: 11.5px; color: var(--muted); margin-top: 6px;
    border-top: 1px solid var(--line); padding-top: 5px;
    display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
  .card .ver + .hb { border-top: 0; margin-top: 1px; padding-top: 0; }
  section { margin-bottom: 26px; }
  section > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted);
    margin: 0 0 10px; font-weight: 600; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: 600; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover { background: var(--grey-bg); }
  td.wrap { white-space: normal; max-width: 420px; }
  td.wrap.roomy { max-width: none; width: 100%; }
  /* A cell capped at three lines, in a table whose rows open to their full
     text on click (the void list). The cap sits on an inner block because the
     clamp needs `display: -webkit-box`, and a `td` given that stops being a
     table cell. The ellipsis it draws is the affordance: a row with nothing
     hidden shows none, so the cue appears on exactly the rows that have more. */
  td.wrap .clip { display: -webkit-box; -webkit-box-orient: vertical;
    -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
  /* The see-more control belongs to the table it uncovers, so it is that
     table's last row rather than a button beside it — full width, inside the
     panel border, reading as the continuation of the list. */
  td.morecell { padding: 0; }
  button.more { font: inherit; font-size: 12px; width: 100%; padding: 8px 12px; border: 0;
    background: none; color: var(--accent); cursor: pointer; text-align: center; }
  button.more:hover { background: var(--grey-bg); }
  button.more:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  td.stages { white-space: normal; max-width: 132px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
    border: 1px solid transparent; }
  .b-green { background: var(--green-bg); color: var(--green); }
  .b-red { background: var(--red-bg); color: var(--red); }
  .b-blue { background: var(--blue-bg); color: var(--blue); }
  .b-amber { background: var(--amber-bg); color: var(--amber); }
  .b-grey { background: var(--grey-bg); color: var(--grey); }
  .b-purple { background: var(--purple-bg); color: var(--purple); }
  /* Source tags are deliberately a different shape and weight from outcome
     badges above: outlined and square-cornered rather than filled pills, so
     the two classes of data never read as the same kind of label. */
  .srctag { display: inline-block; padding: 0 6px; border-radius: 4px; font-family: var(--mono);
    font-size: 10.5px; font-weight: 500; letter-spacing: .2px; line-height: 17px;
    border: 1px solid currentColor; background: transparent; }
  .s-red { color: var(--red); } .s-amber { color: var(--amber); } .s-blue { color: var(--blue); }
  .s-green { color: var(--green); } .s-grey { color: var(--grey); } .s-purple { color: var(--purple); }
  .s-teal { color: var(--teal); } .s-pink { color: var(--pink); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  /* Inside a pill the dot is set to the pill's scale, so an in-flight badge in
     a table cell reads as one label rather than a dot with a word after it. */
  .badge .dot { width: 6px; height: 6px; margin-right: 4px; }
  .dot.live { background: var(--green); box-shadow: 0 0 0 0 rgba(63,185,80,.6); animation: pulse 1.8s infinite; }
  .dot.idle { background: var(--grey); }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(63,185,80,.5)} 70%{box-shadow:0 0 0 6px rgba(63,185,80,0)} 100%{box-shadow:0 0 0 0 rgba(63,185,80,0)} }
  .mono { font-family: var(--mono); font-size: 12px; }
  .muted { color: var(--muted); }
  .stagecells { display: flex; flex-wrap: wrap; gap: 4px; }
  .stagecell { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); }
  .sc-ok { color: var(--green); } .sc-fail { color: var(--red); } .sc-none { color: var(--muted); opacity: .6; }
  .detail { background: var(--bg); }
  .detail td { padding: 0; border-bottom: 1px solid var(--line); }
  .detailwrap { padding: 14px 16px; }
  .stagebox { border: 1px solid var(--line); border-radius: 8px; margin: 10px 0; background: var(--panel); }
  .stagebox > .head { padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
    border-bottom: 1px solid var(--line); font-size: 12px; }
  .stagebox > .head .name { font-weight: 650; text-transform: capitalize; }
  .kv { color: var(--muted); } .kv b { color: var(--ink); font-weight: 600; }
  pre.tx { margin: 0; padding: 10px 12px; font-family: var(--mono); font-size: 12px; line-height: 1.45;
    white-space: pre-wrap; word-break: break-word; max-height: 340px; overflow: auto; background: var(--panel); }
  pre.err { color: var(--red); border-top: 1px dashed var(--line); }
  details.tx > summary { cursor: pointer; padding: 6px 12px; font-size: 12px; color: var(--muted); user-select: none; }
  .bars { display: flex; flex-direction: column; gap: 6px; }
  .bar { display: grid; grid-template-columns: 88px 1fr 92px; align-items: center; gap: 10px; font-size: 12px; }
  /* Actor names run longer than model names ("project-reviewer" against
     "sonnet-5"), so that chart's rows get a wider name track rather than an
     abbreviation nobody would recognise. */
  .bars.wide .bar { grid-template-columns: 112px 1fr 92px; }
  .bar .track { background: var(--grey-bg); border-radius: 5px; height: 16px; overflow: hidden; }
  .bar .fill { background: var(--accent); height: 100%; border-radius: 0 4px 4px 0; }
  .gauge { height: 10px; border-radius: 5px; background: var(--grey-bg); overflow: hidden; margin-top: 6px; }
  .gauge > span { display: block; height: 100%; }
  .empty { padding: 18px; color: var(--muted); font-style: italic; }
  p.costnote { font-size: 12px; color: var(--muted); max-width: 78ch; }
  /* The two model pies (issue #529): a fixed-size conic-gradient disc plus a
     text legend, not SVG — `el()` builds elements with `createElement`, never
     `createElementNS`, and the render-test harness's DOM stub only implements
     that subset, so an SVG chart would need a second helper and break the
     harness both at once. `flex-wrap` is what keeps the section single-column
     at narrow widths (matching .costgrid's own media query): the legend drops
     below the disc instead of squeezing it. */
  .piewrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .pie { width: 120px; height: 120px; border-radius: 50%; flex: 0 0 auto; background: var(--grey-bg); }
  .pielegend { display: flex; flex-direction: column; gap: 5px; font-size: 12px; flex: 1 1 140px; min-width: 140px; }
  .pielegenditem { display: flex; align-items: center; gap: 6px; }
  .pielegenditem .n { margin-left: auto; }
  .pieswatch { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  /* By-day runs to sixty rows and by-model/by-actor to five each, so a fixed
     two-column split under- or over-fills a side depending on the day. A
     multi-column flow instead lets the browser balance the blocks —
     day, model, actor, then the notes, in that reading order — by height on
     its own: each block stays whole (break-inside: avoid) and column-fill's
     default "balance" walks them into the shorter side, so the split adapts
     every render instead of being pinned to today's row counts (issue #330). */
  .costgrid { column-count: 2; column-gap: 20px; }
  @media (max-width: 760px) { .costgrid { column-count: 1; } }
  .costgrid > * { break-inside: avoid; margin: 0 0 20px; }
  .costgrid > *:last-child { margin-bottom: 0; }
  .costwindow-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 12px; }
  .costwindow-bar select.costwindow { font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
  .costwindow-bar select.costwindow:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  code.inline { font-family: var(--mono); background: var(--grey-bg); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  /* ---------- pull-request references ---------- */
  /* A dotted underline is the affordance, not a colour: the page already
     spends colour on outcome and source, and a reader who cannot separate
     hues still needs to know which numbers carry a record. It goes solid on
     hover and focus, so the cue and the link state stay distinguishable. */
  a.prref { border-bottom: 1px dotted currentColor; text-decoration: none; white-space: nowrap;
    font-variant-numeric: tabular-nums; }
  a.prref:hover, a.prref:focus { text-decoration: none; border-bottom-style: solid; }
  a.prref:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  #prcard { position: absolute; z-index: 50; width: 340px; max-width: calc(100vw - 24px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); padding: 11px 13px; font-size: 12.5px; line-height: 1.45;
    display: none; }
  #prcard.open { display: block; }
  #prcard .prhead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  #prcard .prtitle { font-weight: 600; margin-bottom: 8px; word-break: break-word; }
  #prcard dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; }
  #prcard dt { color: var(--muted); }
  #prcard dd { margin: 0; word-break: break-word; }
  /* Filled, rounded and uncoloured: a third shape, so a GitHub label cannot be
     misread as an outcome badge (filled pill, coloured) or a work-source tag
     (outlined square). Colour on this page carries identity within a class of
     data; shape carries the class. */
  #prcard .prlabels { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  #prcard .prlabels span { font-family: var(--mono); font-size: 10.5px; line-height: 17px;
    padding: 0 7px; border-radius: 999px; background: var(--grey-bg); color: var(--muted); }
  #prcard .prfoot { margin-top: 9px; padding-top: 7px; border-top: 1px solid var(--line); }
  #prcard .prnone { color: var(--muted); font-style: italic; }
  /* Only a pinned card carries a close button. A peeked card is dismissed by
     moving the pointer away, and a control you cannot reach without moving the
     pointer *into* the card would be decoration. A pinned one has no such exit:
     on a phone "tap the blank page behind it" is not an affordance, and the
     number that opened it is under the reader's own thumb. */
  #prcard .prclose { display: none; }
  #prcard.pinned .prclose { display: block; margin: -3px -4px 0 auto; align-self: flex-start;
    width: 24px; height: 24px; padding: 0; border: 0; border-radius: 6px;
    background: none; cursor: pointer; color: var(--muted); font: 15px/1 var(--sans); }
  #prcard.pinned .prclose:hover { background: var(--grey-bg); color: var(--ink); }
  #prcard.pinned .prclose:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
</style>
</head>
<body>
<header class="top">
  <h1 id="title">Agent Pipeline Dashboard</h1>
  <span class="mono muted" id="nodename" title="the node whose publisher rendered this page"></span>
  <span id="livestate"></span>
  <span class="grow"></span>
  <span class="freshness" id="freshness"></span>
  <span class="freshness" id="ghfreshness" title="when the GitHub-sourced panels — PRs, checks, issues, work sources, claims — were last fetched"></span>
  <nav class="docs" aria-label="Documentation">Docs:
    <a href="https://github.com/Poetic-Poems/agent-ops/blob/main/README.md" target="_blank" rel="noopener noreferrer">README</a> ·
    <a href="https://github.com/Poetic-Poems/agent-ops/blob/main/docs/IMPLEMENTATION-PIPELINE-SPEC.md" target="_blank" rel="noopener noreferrer">Pipeline spec</a> ·
    <a href="https://github.com/Poetic-Poems/agent-ops/blob/main/docs/REVIEW-PIPELINE-SPEC.md" target="_blank" rel="noopener noreferrer">Review spec</a> ·
    <a href="https://github.com/Poetic-Poems/agent-ops/blob/main/docs/DASHBOARD-SPEC.md" target="_blank" rel="noopener noreferrer">Dashboard spec</a> ·
    <a href="https://github.com/Poetic-Poems/agent-ops/blob/main/docs/METERING-SCHEMA.md" target="_blank" rel="noopener noreferrer">Metering</a> ·
    <a href="https://github.com/Poetic-Poems/agent-ops/blob/main/docs/ROADMAP.md" target="_blank" rel="noopener noreferrer">Roadmap</a>
  </nav>
  <div class="controls">
    <label><input type="checkbox" id="autorefresh" checked> auto-refresh</label>
    <button class="refresh" id="refreshbtn">Refresh now</button>
  </div>
</header>
<main id="app"></main>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var D = window.DASHBOARD_DATA;

  if (!D) {
    app.innerHTML = '<div class="banner amber">No data yet — run <code class="inline">scripts/publish-dashboard.sh</code> to generate the dashboard.</div>';
    return;
  }

  // ---------- helpers ----------
  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    }
    if (children) (Array.isArray(children) ? children : [children]).forEach(function (c) {
      if (c == null) return;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return e;
  }
  function parseTs(s) { if (!s) return null; var d = new Date(s); return isNaN(d) ? null : d; }
  function fmtTime(s) { var d = parseTs(s); return d ? d.toLocaleString(undefined, {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"}) : "—"; }
  function fmtAgo(s) {
    var d = parseTs(s); if (!d) return "—";
    var sec = Math.max(0, (Date.now() - d.getTime())/1000);
    if (sec < 90) return Math.round(sec) + "s ago";
    if (sec < 5400) return Math.round(sec/60) + "m ago";
    if (sec < 172800) return Math.round(sec/3600) + "h ago";
    return Math.round(sec/86400) + "d ago";
  }
  function fmtDur(ms) {
    if (ms == null) return "—";
    var s = ms/1000;
    if (s < 60) return s.toFixed(1) + "s";
    return Math.floor(s/60) + "m" + String(Math.round(s%60)).padStart(2,"0") + "s";
  }
  function usd(n) { return n == null ? "—" : "$" + Number(n).toFixed(Number(n) < 1 ? 4 : 2); }
  function esc(s) { return String(s == null ? "" : s); }

  // ---------- spend-mode: which "today" the token-cost card shows (#186) ----
  // `spend_today_usd` is always the Publisher's own GMT calendar day — correct
  // but silently GMT, which is exactly what #186 asked to make visible. The
  // other two readings can only be computed here, against the reader's own
  // clock: `recent_costs` (three days of {ts, cost} rows, UTC instants) is
  // what the Publisher ships for that purpose alongside the coarser day-level
  // aggregates the charts already use.
  var SPEND_MODES = ["gmt", "local", "24h"];
  function spendModeLabel(mode) {
    return mode === "local" ? "today (local)" : mode === "24h" ? "last 24h" : "today (GMT)";
  }
  function spendForMode(mode, c) {
    if (mode === "gmt") return c.spend_today_usd || 0;
    var rows = c.recent_costs || [];
    var now = new Date();
    if (mode === "24h") {
      var cutoff = now.getTime() - 24 * 60 * 60 * 1000;
      return rows.reduce(function (sum, r) {
        var t = r.ts ? new Date(r.ts).getTime() : NaN;
        return !isNaN(t) && t >= cutoff ? sum + (r.cost || 0) : sum;
      }, 0);
    }
    return rows.reduce(function (sum, r) {
      var d = r.ts ? new Date(r.ts) : null;
      if (!d || isNaN(d)) return sum;
      return (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate())
        ? sum + (r.cost || 0) : sum;
    }, 0);
  }

  // ---------- how old the GitHub half of the page is ----------
  // Every GitHub-sourced panel — PRs, checks, issues, work sources, claims —
  // is exactly as old as the last real fetch, however recent `generated_at`
  // is: a --no-github tick republishes local state every few seconds and
  // carries the last fetch forward unchanged. That design is what stops the
  // PR list flickering empty sixty times a minute, but it also means a
  // heartbeat whose GitHub refresh has stalled looks identical to a healthy
  // one. It looked identical for as long as the old launcher gate was
  // deployed, so the two clocks are now shown separately.
  var GH_STALE_MIN = 12;   // two missed refreshes, matching the local heartbeat's own bound
  function githubAgeMin() {

    var effective = effectiveCostWindow(availableDays);
    var select = el("select", {class: "costwindow", onchange: function (e) {
      costWindow = e.target.value;
      saveCostWindow(costWindow);
      renderBody();
    }}, COST_WINDOWS.map(function (w) {
      var disabled = w.days != null && w.days > availableDays;
      return el("option", {value: w.key, text: w.label,
        selected: w.key === effective ? "" : null,
        disabled: disabled ? "" : null});
    }));
    return el("div", {class: "costwindow-bar"}, [
      el("label", {class: "muted", text: "Time frame (model, actor & model-used charts): "}),
      select
    ]);
  }

  // ---------- fleet helpers ----------
  function fleetNodes()  { return (D.fleet && D.fleet.nodes)  || []; }
  function fleetClaims() { return (D.fleet && D.fleet.claims) || []; }
  function fleetFlags()  { return (D.fleet && D.fleet.flags)  || {}; }
  // The fleet chrome appears only once there is a fleet: with a single node
  // every extra strip, column and panel is noise, so the page renders exactly
  // as it did single-node until a peer shows up (or a claim exists).
  function fleetVisible() { return fleetNodes().length > 1 || fleetClaims().length > 0; }

  // Per-item claims (requirement 17a, lib/role.sh) only arbitrate contention
  // between concurrently *active* nodes — a standby never attempts one, so it
  // cannot be the peer a claim was lost to. With fleet data present and at
  // most one node currently active, nothing could have raced for any claim,
  // so the badges below would name contention that never happened (issue
  // #829) — even though the underlying `raced`/`race_losses` fields are real,
  // logged events. Fleet-less data (no `fleet` key at all, the shape a
  // data.js from before the fleet strip existed carries) says nothing about
  // how many nodes are active, so it is not treated as "one" and renders
  // exactly as before.
  function racedMarkersPossible() {
    if (!fleetNodes().length) return true;
    return fleetNodes().filter(function (n) { return n.role === "active"; }).length > 1;
  }

  function nodeTag(n) {
    if (!n) return el("span", {class:"muted", text:"—"});
    var self = D.node && n === D.node;
    return el("span", {class:"badge " + (self ? "b-blue" : "b-grey"), title: self ? n + " (this node)" : n,
                       text: n.length > 18 ? n.slice(0, 17) + "…" : n});
  }
  function roleBadge(role) {
    return role === "active" ? el("span", {class:"badge b-green", text:"active"})
         : el("span", {class:"badge b-grey", text: role || "standby"});
  }

  // The node-scoped switch (issue #379), beside the role badge: a fleet-wide
  // disable already gets its own page-top banner (`status.switch` /
  // `fleet.flags.disabled`), but a --this-node one sets no flag anything else
  // on the page reads, so without this badge a node stood down that way looks
  // exactly like an idle one — the same gap the page-top banner exists to
  // close for the fleet-wide switch, one level down. Absent (a peer whose
  // heartbeat predates this field, or one this node cannot answer for) and
  // enabled both render nothing.
  //
  // `sw.scope` (implementation spec 2.3) decides between three readings of a
  // set switch, because a fleet-wide --disable writes a local record on the
  // node that issued it too:
  //
  //   scope "node"  — a real --this-node stand-down. The badge as before.
  //   scope "fleet", fleet flag set — a mirror of the banner already at the
  //     top of the page. Badging it would put an amber "disabled" on exactly
  //     one node of a fleet that is uniformly down, which reads as a second
  //     fault on that node; render nothing and let the banner speak.
  //   scope "fleet", fleet flag clear — the orphan: --enable on a *peer*
  //     cleared the flag but could not reach this node's file, so this node
  //     alone is still down under a lifted decision. That is the one case
  //     this badge most needs to catch, and it names the fix.
  //
  // A record with no scope reads as "node", matching lib/toggle.sh.
  function switchBadge(sw) {
    if (!sw || !sw.disabled) return null;
    var scope = sw.scope || "node";
    var fleetSet = !!fleetFlags().disabled;
    if (scope === "fleet" && fleetSet) return null;
    var detail = sw.reason ? ("“" + sw.reason + "”") : "no reason recorded";
    if (sw.actor || sw.by) detail += " — set by " + (sw.actor || sw.by);
    if (scope === "fleet") {
      detail += sw.expires_at ? ("; expires " + sw.expires_at) : "; no expiry";
      return el("span", {class:"badge b-amber", style:"margin-left:6px", text:"disabled",
        title: "left over from a fleet-wide disable that has since been cleared: " + detail
             + " — this node is standing down alone; `agent-cycle.sh --enable` on it clears the record"});
    }
    detail += sw.expires_at ? ("; expires " + sw.expires_at)
                            : "; no expiry — needs --enable --this-node";
    return el("span", {class:"badge b-amber", style:"margin-left:6px", text:"disabled",
      title: "node-scoped disable: " + detail});
  }

  // What a node is working on, in the order a cycle learns it: the stage first
  // (present as soon as one is live), then the selected work once the
  // Co-Ordinator has chosen. One renderer, used by the per-node fleet cards and
  // — when there is no fleet to summarise — by the header, so the two cannot
  // drift into describing the same thing two ways.
  function workDetail(cur) {
    cur = cur || {};
    var label = cur.title || cur.item;
    if (!cur.stage && !cur.repo && !label) return null;
    var what = el("span", {class:"muted"}), first = true;
    // The stage is absent on a finished cycle (it is the *live* stage), so the
    // separator has to follow what was actually written rather than assume it.
    function sep() { if (!first) what.appendChild(document.createTextNode(" · ")); first = false; }
    if (cur.stage) { sep(); what.appendChild(el("span", {class:"mono", title:"current stage", text: cur.stage})); }
    if (cur.stage === "coordinator" && !label) what.appendChild(document.createTextNode(" choosing work"));
    if (cur.repo)   { sep(); what.appendChild(el("span", {class:"mono", text: cur.repo.split("/")[1]})); }
    if (cur.source) { what.appendChild(document.createTextNode(" ")); what.appendChild(sourceTag(cur.source)); }
    if (label)      what.appendChild(document.createTextNode(" " + (label.length > 70 ? label.slice(0,69) + "…" : label)));
    if (cur.race_losses && racedMarkersPossible()) {
      what.appendChild(el("span", {class:"badge b-blue", style:"margin-left:6px",
        title: cur.race_losses + " candidate(s) lost to a peer before this claim landed",
        text: "recovered race ×" + cur.race_losses}));
    }
    return what;
  }

  function cycleById(id) {
    var cs = D.cycles || [];
    if (!id) return null;
    for (var i = 0; i < cs.length; i++) if (cs[i].id === id) return cs[i];
    return null;
  }

  // A peer's "running" is derived from the log it last published, so a node
  // killed mid-cycle (no `cycle-end` ever written) goes on looking busy for
  // ever. `lock_stale_after` is the pipeline's own bound on that — the age at
  // which it would take such a lock over — so past it the card stops asserting
  // and says the node may be gone. Our own row is exempt: a live pid is not an
  // inference.
  function livenessDoubt(n) {
    if (!n || n.self || !n.live || n.live.running !== true) return null;
    var t = parseTs(n.live.since);
    var hours = Math.max(1, +((D.config || {}).lock_stale_after) || 4);
    if (!t || (Date.now() - t.getTime())/3600000 <= hours) return null;
    return "no cycle-end after " + hours + "h — the node may have died mid-cycle";
  }

  // The same doubt, reached in minutes instead of hours, and on far better
  // evidence. `lock_stale_after` is a bound on how long a *cycle* may plausibly
  // run; a stage has a much tighter one of its own. agent-cycle.sh hands every
  // stage to run_claude_stage with a timeout, which kills the process group when
  // it expires and logs `stage-end` unconditionally after — so a live stage
  // older than its own timeout is not a slow stage. It is a stage whose process
  // is gone, and whose log never got the ending.
  //
  // That gap is the whole reason this exists: a Co-Ordinator is bounded at 15
  // minutes, so a node rolled mid-cycle goes on reading "coordinator choosing
  // work" for the three and three-quarter hours before the rule above will
  // doubt it — most of the way to its next cycle, and long past when an
  // operator wants to know.
  //
  // Every stage now carries its own cap, derived per (actor, repository,
  // model) and announced on its `stage-start`, so the number to hold a live
  // stage against is the one that stage was actually given — `stage_backstop_min`
  // on the live row. What follows is only the fallback for a row whose event
  // predates the announcement, or a page reading a peer that has not rolled
  // yet: the fleet-wide widest backstop currently in force for that actor,
  // published as `config.stage_backstops`, and failing that the shipped prior.
  //
  // A stage none of those names (the review pipeline's, or one added since)
  // has no cap to be held against, and gets no claim made about it. Erring
  // towards the widest is deliberate: an over-wide limit delays the verdict,
  // while an under-wide one would assert that a healthy stage is dead.
  var STAGE_BACKSTOP_PRIOR = {
    coordinator: 20, implementer: 150, reviewer: 90, enabler: 30
  };
  function stageBackstopMin(stage, announced) {
    if (+announced > 0) return +announced;
    var fleet = ((D.config || {}).stage_backstops || {})[stage];
    if (+fleet > 0) return +fleet;
    return STAGE_BACKSTOP_PRIOR[stage] || 0;
  }
  // run_claude_stage polls every 2s, then SIGTERMs, waits 5s and SIGKILLs, and
  // the `stage-end` after that still has to reach a push. This is the room that
  // sequence needs — wide enough that nothing healthy ever trips the rule.
  var STAGE_OVERRUN_GRACE_MIN = 2;

  // `asOfIso` is the heartbeat, never the clock. A missing `stage-end` is known
  // only as far as the state that node last published, so measuring to now would
  // flag a stage that ended a second after its final push. It also keeps the
  // arithmetic honest across machines: `stage_since` and the heartbeat are both
  // stamped by the node being judged, so their difference carries no skew
  // between one node's clock and another's.
  function stageOverrun(stage, stageSince, asOfIso, announcedBackstopMin) {
    var limit = stageBackstopMin(stage, announcedBackstopMin);
    if (!(limit > 0)) return null;
    var started = parseTs(stageSince), asOf = parseTs(asOfIso);
    if (!started || !asOf) return null;
    var mins = (asOf.getTime() - started.getTime())/60000;
    if (mins <= limit + STAGE_OVERRUN_GRACE_MIN) return null;
    return stage + " has been live " + Math.round(mins) + "m against its own " + limit
         + "m backstop — the pipeline would have killed it, so this cycle is over"
         + " and its log never recorded the end";
  }

  // The node-row form. Self is *not* exempt the way it is above: there the lock's
  // live pid answers the question outright, but a pid proves the cycle script is
  // alive, not that the stage it last logged still is — and were that script
  // alive, its own timer would have ended the stage. So an overrun is worth
  // saying on any row, ours included.
  function nodeStageOverrun(n) {
    if (!n || !n.live || n.live.running !== true) return null;
    return stageOverrun(n.live.stage, n.live.stage_since, n.heartbeat_ts || D.generated_at,
                        n.live.stage_backstop_min);
  }

  // The node currently running this cycle, if any. A cycle with no `cycle-end`
  // is either in flight or the trace of a node killed mid-cycle, and the log
  // alone cannot tell those apart — only a node claiming the cycle as its live
  // one can. `live.running` rather than `nodeRunning()` deliberately: a stale
  // peer's claim is old news, not no news, and the caller says so in its own
  // words rather than losing the row to "unknown".
  function liveCycleNode(cy) {
    if (!cy || cy.ended_at || !cy.id) return null;
    var ns = fleetNodes();
    for (var i = 0; i < ns.length; i++) {
      if (ns[i].live && ns[i].live.running === true && ns[i].live.cycle === cy.id) return ns[i];
    }
    return null;
  }

  // The Outcome column for one cycle. A cycle *has* an outcome only once it has
  // logged `cycle-end`; before that the column can report a state, and the
  // vocabulary is the fleet cards' — running, or a start with no end and
  // nothing running it. Reading the event ladder alone gets this wrong in the
  // most misleading direction available: a cycle still choosing its work has
  // logged nothing classifiable, so it falls to the ladder's floor and renders
  // as "Ended" — a verdict, on a cycle that has not begun to earn one. The two
  // rungs above it lie the same way in the past tense ("Selected", "PR raised"
  // of a cycle still at work), and nothing is lost by replacing them here: how
  // far it has got is what the Item, Stages and PR cells beside it already say.
  // The "raced" marker (issue #245): a cycle lost at least one claim to a
  // peer's healthy contention before its outcome above was decided. Beside an
  // outcome other than "Stood down" it says the cycle *recovered* — claimed
  // and dispatched the next candidate rather than forfeiting the cycle;
  // beside "Stood down" it says every candidate raced away, which
  // `outcomeBadge`'s own "Stood down" text does not distinguish from a
  // GitHub outage or a fleet switch. A second, small badge rather than
  // folding this into the outcome badge itself: it is a fact about *how* the
  // cycle got its outcome, not a different outcome, and the two badges read
  // in that order left to right. Blue, never amber: implementation spec 17d
  // makes contention informational rather than a fault, and amber on this
  // page is the colour of something that wants acting on.
  function racedMarker(cy) {
    if (!cy.raced || !racedMarkersPossible()) return null;
    var n = cy.race_losses || 0, recovered = cy.outcome !== "stand-down";
    return el("span", {class:"badge b-blue", style:"margin-left:6px",
      title: (recovered ? "recovered after " : "stood down after ") + n +
             " lost claim" + (n === 1 ? "" : "s") + " to a peer"}, "↻ raced");
  }

  function outcomeCell(cy) {
    if (cy.ended_at) return [ outcomeBadge(cy.outcome), racedMarker(cy) ];
    var n = liveCycleNode(cy);
    // "No clean end" is an accusation, so it is only made where the data can
    // support it. `data.js` from before the fleet strip existed carries no node
    // list at all — which a page refreshed from a checkout the Publisher has
    // not re-run on yet is reading right now — and there the honest report is
    // just that the cycle has not ended.
    if (!n && !fleetNodes().length) return el("span", {class:"badge b-grey",
      title:"no cycle-end logged; this data carries no node state, so whether it is still running cannot be told from here"},
      [ el("span", {class:"dot idle"}), document.createTextNode("Not ended") ]);
    if (!n) return el("span", {class:"badge b-amber", text:"No clean end",
      title:"a cycle-start with no cycle-end, and no node running it now — the node was stopped mid-cycle, or its log lost the tail"});
    // The node cards' doubt, in this column's vocabulary — the same two rules,
    // so a cycle cannot read "In progress" here while the card that owns it
    // reads "may be dead" a scroll above.
    var doubt = livenessDoubt(n) || nodeStageOverrun(n), stale = nodeUnknown(n), stage = (n.live || {}).stage;
    return el("span", {class:"badge " + (doubt ? "b-amber" : stale ? "b-grey" : "b-blue"),
      title: doubt ? n.node + ": " + doubt
           : stale ? "running as of " + n.node + "'s last push more than 30 minutes ago — that answer can no longer be called current"
           : "running on " + n.node + (stage ? " — " + stage : "")},
      [ el("span", {class:"dot " + (doubt || stale ? "idle" : "live")}),
        document.createTextNode(doubt ? "In progress?" : "In progress") ]);
  }

  // ---------- what a node is running ----------
  // The newest build anywhere in the fleet, which is what "up to date" means at
  // this moment — there is no absolute answer, since the registry's `latest` is
  // not visible from here and a node's own image is the only version it can
  // report. `built_at` orders builds better than the pull-request number does:
  // it is monotonic by construction, whereas PR numbers only happen to be, and
  // would stop being so the moment a node ran an image built from another repo.
  function fleetNewestVersion() {
    var best = null;
    fleetNodes().forEach(function (n) {
      var v = n.version;
      if (!v || !v.commit) return;
      if (!best) { best = v; return; }
      var a = parseTs(v.built_at), b = parseTs(best.built_at);
      if (a && b) { if (a > b) best = v; }
      else if (v.pr != null && best.pr != null && v.pr > best.pr) best = v;
    });
    return best;
  }

  // The version line of a node's card: which pull request its image contains,
  // the commit that was built, and whether the fleet has moved past it.
  //
  // A fleet is *routinely* mid-update — a roll waits for the cycle it would
  // otherwise kill — so "behind" is an ordinary state and not an alarm; it is
  // said in grey with the reason in the tooltip. What it is there to catch is
  // the case where it stops resolving: a node that has been behind for a day
  // is a node whose watchtower is not rolling, and nothing else on this page
  // would show that.
  function versionLine(n) {
    var v = n.version;
    if (!v || !v.commit) {
      return el("div", {class:"ver", title: n.self
        ? "no CI stamp and no git checkout at /app — this publisher cannot tell what it is running"
        : "this peer's heartbeat carries no version; it is running an image built before versions were reported"},
        el("span", {class:"muted", text:"version unknown"}));
    }
    var line = el("div", {class:"ver"});
    line.appendChild(el("span", {class:"muted",
      title: v.source === "image" ? "from the image's CI build stamp" : "from the git checkout this node runs",
      text: v.source === "image" ? "image" : "checkout"}));
    if (v.pr != null && v.repo) line.appendChild(prRef(v.repo, v.pr, null, "node/" + n.node));
    else line.appendChild(el("span", {class:"muted", title:"the build contains no merged pull request", text:"—"}));
    line.appendChild(v.repo
      ? el("a", {class:"mono muted", target:"_blank", rel:"noopener", title:"the commit this build was made from",
                 href: "https://github.com/" + v.repo + "/commit/" + v.commit, text: v.short})
      : el("span", {class:"mono muted", text: v.short}));
    // "built" is not decoration: the heartbeat line directly below carries an
    // age of its own, and two bare "9h ago"s stacked would invite the reader to
    // take them for the same clock.
    if (v.built_at) line.appendChild(el("span", {class:"muted",
      title: "built " + fmtTime(v.built_at), text: "· built " + fmtAgo(v.built_at)}));
    if (v.dirty) line.appendChild(el("span", {class:"badge b-amber", text:"modified",
      title:"the checkout has uncommitted changes — it is not the commit it names"}));
    var newest = fleetNewestVersion();
    if (newest && newest.commit && newest.commit !== v.commit) {
      line.appendChild(el("span", {class:"badge b-grey", text:"behind",
        title: "the fleet's newest build is " + (newest.pr != null ? "#" + newest.pr + " " : "") +
               newest.short + (newest.built_at ? " (" + fmtAgo(newest.built_at) + ")" : "") +
               " — a roll waits for the cycle it would interrupt, so this is normal for a while"}));
    }
    return line;
  }

  // The node's deployment file, as distinct from its image. A node holds its
  // own compose.yaml, which no image roll can update, so a merged compose
  // change reaches it only by a human running `docker compose up -d` there —
  // and nothing reported that step missing until issue #131. The verdict is
  // the node's own (lib/compose-drift.sh, via its heartbeat): the file lives
  // on that node's host, and no other party can read it.
  //
  // Amber where the version line's "behind" is grey, deliberately: behind
  // resolves itself on the next idle poll, while a drifted or unverifiable
  // compose.yaml resolves only when a human acts, and an amber that never
  // clears by itself is exactly the alarm that was missing. In-sync renders
  // nothing; so does an absent verdict (an image from before the check, or an
  // install that is no container) — for an image the roll that is already on
  // its way will start answering, and the version line's own "behind" covers
  // a node whose rolls have stopped.
  function composeLine(n) {
    var c = n.compose;
    if (!c || !c.status || c.status === "in-sync") return null;
    var badge = c.status === "drifted"
      ? el("span", {class:"badge b-amber", text:"compose drifted",
          title: (c.diff_lines != null ? c.diff_lines + " material line(s) differ: " : "") +
                 "this node's compose.yaml no longer matches the copy its image shipped — " +
                 "a merged compose change deploys nothing by itself; re-fetch the file and run " +
                 "docker compose up -d on that host when it is idle (deploy/docker/README.md, " +
                 "“Keeping the compose file current”)"})
      : el("span", {class:"badge b-amber", text:"compose unverified",
          title: "this node's compose.yaml is not mounted into its containers, so it cannot be " +
                 "checked — which itself means the file predates the drift check and is behind. " +
                 "Re-fetch compose.yaml and run docker compose up -d on that host when it is idle " +
                 "(deploy/docker/README.md, “Keeping the compose file current”)"});
    return el("div", {class:"ver"}, badge);
  }

  // Whether this node is running the registry's newest published image —
  // lib/image-drift.sh's verdict, which versionLine's own "behind" badge
  // cannot give: that one compares nodes against each other, so a fleet
  // uniformly stale (#149, #154 — every node adopting the same broken image
  // at once) reads as perfect agreement, not staleness. This one compares
  // against the registry itself, the one party that always knows what
  // "newest" actually means.
  //
  // Grey while the newest image is younger than image_behind_grace_hours —
  // the same colour versionLine's own "behind" uses, because the same
  // explanation applies: a roll defers while a cycle is in flight
  // (deploy/docker/watchtower-pre-update.sh), so being behind for a while is
  // routine. Past the grace period it turns amber, composeLine's colour for
  // "this wants a human" — by then the ordinary explanation has had time to
  // resolve itself, and a node still behind may have a watchtower that has
  // stopped rolling at all (issue #155). "unverified" (a registry read that
  // failed, or — routinely, right after this code first rolls out — a peer
  // whose heartbeat predates this check) gets its own grey badge rather than
  // silence: unlike compose's absent-verdict case, nothing else on the page
  // would otherwise say the question was even asked.
  function imageLine(n) {
    var img = n.image;
    if (!img || !img.status || img.status === "current") return null;
    if (img.status === "unverified") {
      return el("div", {class:"ver"}, el("span", {class:"badge b-grey", text:"image unverified",
        title: "could not tell whether this node runs the registry's newest image" +
               (img.reason ? " — " + img.reason : "")}));
    }
    var hours = Math.max(1, +((D.config || {}).image_behind_grace_hours) || 3);
    var createdT = parseTs(img.registry_created_at);
    var ageH = createdT ? (Date.now() - createdT.getTime()) / 3600000 : null;
    var stuck = ageH == null || ageH > hours;
    var ageText = createdT ? fmtAgo(img.registry_created_at) : "an unknown time ago";
    var commit = (img.registry_commit || "").slice(0, 7);
    var badge = el("span", {class: "badge " + (stuck ? "b-amber" : "b-grey"), text: "image behind",
      title: "the registry's newest image (" + commit + ") was published " + ageText +
             (stuck
               ? " — longer than the " + hours + "h grace this page gives a deferred roll; " +
                 "this node may need attention (scripts/check-node-image.sh, run on its host)"
               : " — a roll waits for a cycle in flight, so this is normal for a while")});
    return el("div", {class:"ver"}, badge);
  }

  // ---------- section builder ----------
  function sectionOf(title, body) {
    return el("section", {}, [ el("h2", {text:title}), body ]);
  }

  // Days' notice under which a fine-grained PAT's expiry earns an amber
  // badge (agent-ops#694) — must match TOKEN_EXPIRY_WARN_DAYS
  // (lib/token-expiry.sh), the same constant doctor.sh's own warn/ok split
  // and agent-cycle.sh's escalation decision already share; not read from
  // the payload itself, since doctor.sh only ever records the figures, not
  // the threshold it judged them against.
  var TOKEN_EXPIRY_WARN_DAYS = 7;

  // ---------- Doctor panel (agent-ops#543) ----------
  // status.doctor is THIS node's own most recent hourly `doctor.sh
  // --unattended` pass (state_dir/.doctor-status.json, written by the pass
  // itself and read, not recomputed, by the Publisher) — null until the
  // first one has run. Local to this node only: unlike compose/image/switch
  // it does not travel in the fleet heartbeat, since a peer's own config and
  // GitHub access are its own to report.
  function doctorPanel() {
    var doc = (D.status && D.status.doctor) || null;
    if (!doc) {
      return el("div", {class:"panel"}, el("div", {class:"empty",
        text: "No unattended doctor pass has run on this node yet."}));
    }
    // Fine-grained PAT expiry (agent-ops#694): a standing line above the
    // fail/warn table, since it is a figure this node always has an answer
    // for (once any unattended pass has recorded one), not a message that
    // only appears when something is wrong.
    var te = doc.token_expiry || null;
    var teLine = null;
    if (te && typeof te.days_remaining === "number") {
      var teUnder = te.days_remaining < TOKEN_EXPIRY_WARN_DAYS;
      teLine = el("div", {class:"empty", style:"padding:8px 12px 0"}, [
        el("span", {class:"badge " + (teUnder ? "b-amber" : "b-grey"),
          text: "PAT expires in " + te.days_remaining + "d",
          title: "GitHub-Authentication-Token-Expiration, read hourly by doctor.sh --unattended"}),
        el("span", {style:"margin-left:6px", text: "at " + te.expires_at
          + (teUnder ? " — rotate GH_TOKEN before it expires" : "")})
      ]);
    }
    var rows = [];
    (doc.fails || []).forEach(function (m) {
      rows.push(el("tr", {}, [
        el("td", {}, el("span", {class:"badge b-red", text:"fail"})),
        el("td", {class:"wrap roomy"}, m)
      ]));
    });
    (doc.warns || []).forEach(function (m) {
      rows.push(el("tr", {}, [
        el("td", {}, el("span", {class:"badge b-amber", text:"warn"})),
        el("td", {class:"wrap roomy"}, m)
      ]));
    });
    if (!rows.length) {
      return el("div", {class:"panel"}, [
        teLine,
        el("div", {class:"empty",
          text: "No failures or warnings on the last unattended pass, " + fmtAgo(doc.timestamp) + "."})
      ]);
    }
    return el("div", {class:"panel scroll"}, [
      teLine,
      el("div", {class:"empty", style:"padding:8px 12px 0", text:
        "Last unattended pass " + fmtAgo(doc.timestamp) + " (" + fmtTime(doc.timestamp) + ")."}),
      el("table", {}, [
        el("thead", {}, el("tr", {}, [el("th",{text:"Level"}), el("th",{text:"Message"})])),
        el("tbody", {}, rows)
      ])
    ]);
  }

  // ---------- Stage health panel (agent-ops#662) ----------
  // Per-stage verdicts for this node, computed by lib/stage-health.sh at the
  // end of every cycle and read from D.status.stage_health exactly as the
  // Doctor panel above reads D.status.doctor. This is the reading that
  // stayed silent for 10.5 hours during the 2026-08-21 incident (issue
  // #662): `cycle: RUNNING` and a clean Doctor pass both stayed true while
  // every stage failed, because neither reads a stage's own exit code.
  function stageHealthPanel() {
    var sh = (D.status && D.status.stage_health) || null;
    var stages = sh && sh.stages ? sh.stages : null;
    if (!stages || !Object.keys(stages).length) {
      return el("div", {class:"panel"}, el("div", {class:"empty",
        text: "No cycle has completed on this node since this check was added."}));
    }
    var rows = Object.keys(stages).map(function (name) {
      var v = stages[name] || {};
      var badgeClass = v.verdict === "failing" ? "b-red" : v.verdict === "idle" ? "b-grey" : "b-green";
      var detail = v.verdict === "failing"
        ? v.consecutive_failures + " consecutive" + (v.last_detail ? ": " + v.last_detail : "")
        : "";
      return el("tr", {}, [
        el("td", {class:"mono", text: name}),
        el("td", {}, el("span", {class:"badge " + badgeClass, text: v.verdict})),
        el("td", {class:"muted", text: v.last_success ? fmtAgo(v.last_success) : "never"}),
        el("td", {class:"wrap roomy", text: detail})
      ]);
    });
    return el("div", {class:"panel scroll"}, [
      el("table", {}, [
        el("thead", {}, el("tr", {}, [el("th",{text:"Stage"}), el("th",{text:"Verdict"}),
          el("th",{text:"Last success"}), el("th",{text:"Detail"})])),
        el("tbody", {}, rows)
      ])
    ]);
  }

  // The stage names a node's own or a peer's `stage_health.stages` reports
  // as `failing` right now — [] when there is no stage-health data yet
  // (an unrecognised or absent field reads as "nothing to say", never as a
  // failure) or nothing is. Shared by the fleet-strip badge and any future
  // reader that only needs the summary, not the whole table `stageHealthPanel`
  // renders for this node alone.
  function stageHealthFailingStages(n) {
    var stages = n && n.stage_health && n.stage_health.stages;
    if (!stages) return [];
    return Object.keys(stages).filter(function (k) { return stages[k] && stages[k].verdict === "failing"; });
  }

  // ---------- PRs panel ----------
  // State-cell badges (agent-ops#375, D17): `queued`/`dequeued` ride in on
  // each pull request alongside `isDraft` — the Publisher's own answer, not
  // derived here, since only it can tell "queued last tick, not now" apart
  // from "never queued at all" (see publish-dashboard.sh's merge-queue
  // block). A queued pull request is landing hands-off, so it gets its own
  // badge rather than reading as an ordinary "ready" one still waiting on the
  // landing gate; `dequeued` — GitHub reverted it to an ordinary open pull
  // request without merging — gets a warning badge beside it, since that is
  // exactly the state a maintainer's already-clicked "Merge when ready" can
  // silently fall out of.
  function prStateBadges(p) {
    var badges = [];
    if (p.isDraft) badges.push(el("span",{class:"badge b-grey",text:"draft"}));
    else if (p.queued) badges.push(el("span",{class:"badge b-purple",text:"queued",
      title:"in GitHub's merge queue — landing automatically once its merge-group checks pass; never pushed to while it is"}));
    else badges.push(el("span",{class:"badge b-blue",text:"ready"}));
    if (p.dequeued) badges.push(el("span",{class:"badge b-amber", style:"margin-left:6px", text:"dequeued",
      title:"removed from the merge queue since it was last observed queued, without merging — the maintainer's “Merge when ready” click needs a fresh look"}));
    return badges;
  }
  function prsPanel(prs) {
    if (!prs.length) return el("div", {class:"panel"}, el("div", {class:"empty", text: (D.github && D.github.ok===false) ? "GitHub unreachable." : "No open agent PRs."}));
    var rows = prs.map(function (p) {
      var ck = p.checks || {};
      var ckBadge;
      if (!ck.total) ckBadge = el("span", {class:"muted", text:"—"});
      else if (ck.failed) ckBadge = el("span", {class:"badge b-red", text: ck.failed + " failing"});
      else if (ck.pending) ckBadge = el("span", {class:"badge b-amber", text: ck.pending + " pending"});
      else ckBadge = el("span", {class:"badge b-green", text: "checks pass"});
      var mergeBadge = p.mergeable === "MERGEABLE" ? el("span",{class:"badge b-green",text:"mergeable"})
        : p.mergeable === "CONFLICTING" ? el("span",{class:"badge b-red",text:"conflicts"})
        : el("span",{class:"muted",text: (p.mergeStateStatus||"?").toLowerCase()});
      return el("tr", {}, [
        el("td", {}, prRef(p.repo, p.number, p.url, "openprs")),
        el("td", {class:"wrap"}, [ el("span",{class:"mono muted", text: p.repo.split("/")[1] + " "}), esc(p.title) ]),
        el("td", {}, prStateBadges(p)),
        el("td", {}, ckBadge),
        el("td", {}, mergeBadge),
        el("td", {class:"muted", text: fmtAgo(p.createdAt)})
      ]);
    });
    return tableOf(["PR","Title","State","Checks","Merge","Opened"], rows);
  }

  // ---------- fleet strip ----------
  // One card per node, each carrying that node's own live state — running or
  // idle, the stage and item in flight, and how fresh the answer is. This is
  // the readout the header used to carry alone, back when a node and the
  // pipeline were the same thing; with a fleet there is no single "what is it
  // doing", so the question is answered per node here and only summarised up
  // top. Clicking a card filters the cycle list and the recent log to that
  // node; clicking it again clears the filter.
  function fleetStrip() {
    var wrap = el("div", {class:"cards fleet", id:"fleetstrip"});
    fleetNodes().forEach(function (n) { wrap.appendChild(nodeCard(n)); });
    return wrap;
  }

  // Is this node's state knowable at all? A peer's is only ever as fresh as its
  // last push, so once that has gone stale the card reports "unknown" rather
  // than half-hour-old news dressed as current.
  function nodeUnknown(n) { return !n.self && n.stale; }
  function nodeRunning(n) { return !nodeUnknown(n) && !!(n.live && n.live.running === true); }

  function nodeCard(n) {
    var live = n.live || null;
    var unknown = nodeUnknown(n), running = nodeRunning(n);
    // Two readings of the same doubt, and at most one badge for them: past
    // `lock_stale_after` the liveness rule is the stronger claim and wins, and
    // before it the stage's own timeout is the only one that can fire at all.
    var doubt = livenessDoubt(n) || nodeStageOverrun(n);
    var card = el("div", {class:"card clickable" + (n.stale ? " nodestale" : "") + (nodeFilter === n.node ? " nodeselected" : ""),
                          title: nodeFilter === n.node ? "click to show every node's cycles and log events" : "click to filter cycles and log events to " + n.node});
    card.appendChild(el("div", {class:"k"}, [ nodeTag(n.node), document.createTextNode(" "), roleBadge(n.role), switchBadge(n.switch) ]));

    var state = el("div", {class:"state"});
    if (unknown) {
      state.appendChild(el("span", {}, [ el("span",{class:"dot idle"}), "state unknown" ]));
    } else if (running) {
      state.appendChild(el("span", {}, [ el("span",{class:"dot live"}), "running" ]));
      if (doubt) state.appendChild(el("span", {class:"badge b-amber", style:"margin-left:6px",
                                               title: doubt, text:"may be dead"}));
    } else {
      state.appendChild(el("span", {}, [ el("span",{class:"dot idle"}), "idle" ]));
    }
    // Independent of running/idle/unknown above, by design (agent-ops#662):
    // the whole point is a node whose process is alive and whose cycles are
    // completing — which reads as plain "running" or "idle" above — while
    // one or more stages have been failing every attempt. See Stage health
    // below for which and since when.
    var failingStages = stageHealthFailingStages(n);
    if (failingStages.length) {
      state.appendChild(el("span", {class:"badge b-red", style:"margin-left:6px",
        title: failingStages.join(", ") + " — see Stage health below",
        text: failingStages.length + (failingStages.length === 1 ? " stage failing" : " stages failing")}));
    }
    card.appendChild(state);

    if (unknown) {
      card.appendChild(el("div", {class:"work muted",
        text:"nothing this node published can still be called current."}));
    } else if (running) {
      var w = workDetail(live);
      if (w) card.appendChild(el("div", {class:"work"}, w));
      if (live.since) card.appendChild(el("div", {class:"when",
        text: "since " + fmtTime(live.since) + " (" + fmtAgo(live.since) + ")"}));
    } else if (live && live.ended_at) {
      // The outcome comes from the cycle list rather than from a second copy of
      // the outcome rule; a cycle that has aged out of that list simply shows
      // its time.
      var last = cycleById(live.cycle);
      card.appendChild(el("div", {class:"work"}, [
        el("span", {class:"muted", text:"last cycle " + fmtAgo(live.ended_at) + " "}),
        last ? outcomeBadge(last.outcome) : null
      ]));
      var lw = last ? workDetail(last) : null;
      if (lw) card.appendChild(el("div", {class:"when"}, lw));
    } else if (live) {
      // A cycle that started, never logged `cycle-end`, and is not running now.
      // That is the trace a node killed mid-cycle leaves (TD26072301), and it
      // is worth saying rather than smoothing into a plain "idle" — nothing
      // else on the page distinguishes it from a cycle that finished.
      card.appendChild(el("div", {class:"work"}, [
        el("span", {class:"muted", text:"last cycle " + fmtAgo(live.since) + " "}),
        el("span", {class:"badge b-amber", text:"no clean end",
          title:"a cycle-start with no cycle-end, and nothing running now — the node was stopped mid-cycle, or its log lost the tail"})
      ]));
    } else {
      card.appendChild(el("div", {class:"work muted",
        text: n.last_cycle ? "last cycle " + esc(n.last_cycle).slice(0, 16) : "no cycles yet"}));
    }

    card.appendChild(versionLine(n));
    var compose = composeLine(n);
    if (compose) card.appendChild(compose);
    var image = imageLine(n);
    if (image) card.appendChild(image);

    card.appendChild(el("div", {class:"hb" + (n.stale ? " stale" : ""),
      title: n.self ? "read from this node's own lock and log"
                    : "derived from the state this peer last pushed — no fresher than its heartbeat",
      text: n.self ? "this node — read live"
           : n.stale ? "STALE — last push >30 min ago"
           : n.heartbeat_age_s == null ? "no heartbeat"
           : "as of its last push, " + fmtAgo(n.heartbeat_ts)}));

    card.addEventListener("click", function (ev) {
      // The version line put links inside a card that is itself a filter
      // toggle; following one must not also change the filter behind it.
      if (ev.target.closest && ev.target.closest("a")) return;
      nodeFilter = (nodeFilter === n.node) ? null : n.node;
      renderBody();
    });
    return card;
  }

  // ---------- claims panel ----------
  // The live claim registry: work the fleet holds that has not yet surfaced
  // as a PR. Every row here is an item no other node will pick up.
  //
  // Every row, deliberately — including the Enabler's and the Refiner's
  // engagement tombstones, whose Repo column reads `enabler`/`refiner` rather
  // than a repository. This is the registry as it is, and a tombstone holding
  // an item off the fleet is exactly what an operator hunting a stuck item
  // needs to see. The back-pressure card above counts a narrower set, for the
  // reasons given there; the two are meant to differ.
  function claimsPanel() {
    var claims = fleetClaims();
    if (!claims.length) return el("div", {class:"panel"}, el("div", {class:"empty", text:"No live claims — nothing is mid-flight."}));
    var rows = claims.map(function (c) {
      return el("tr", {}, [
        el("td", {class:"mono", text: (c.repo || "?").split("/")[1] || c.repo}),
        el("td", {class:"mono wrap", text: c.key || "?"}),
        el("td", {}, nodeTag(c.node)),
        el("td", {}, sourceTag(c.source)),
        el("td", {class:"wrap", text: c.item || ""}),
        el("td", {class:"muted", text: fmtAgo(c.ts)})
      ]);
    });
    return tableOf(["Repo","Claim","Node","Source","Item","Held"], rows);
  }

  // ---------- autonomous landings panel (D18 WI-8, agent-ops#411) ----------
  // Risk 6 of the autonomy investigation — "overnight merges with nobody
  // watching" — was accepted on the condition that this replaces the
  // synchronous landing gate at `human` with an asynchronous audit. So this
  // panel answers one question for a person who was asleep: what did the
  // Script merge without me, and on whose authority?
  //
  // Three deliberate choices about what it refuses to hide:
  //
  //  - Refusals are shown even though nothing landed from them. Two landings
  //    beside forty refusals is a classifier holding the line; two landings
  //    beside none may be a gate that is not running. A digest that printed
  //    only successes could not tell those apart, and the second is the one
  //    worth waking up for.
  //  - A landing with no matching landing-audit-record (requirement 8x,
  //    agent-ops#578) still appears, its own Record cell reading "missing"
  //    rather than the tier/verdict cells quietly reading "unknown". An
  //    unexplained landing is the single most important row this table can
  //    carry, so it must never be the one dropped for want of a join — and,
  //    now that a durable per-landing record exists, "the record could not
  //    be found" and "the record said so" must read as different facts, not
  //    the same "unknown".
  //  - A payload the Publisher could not assemble says so, rather than
  //    rendering as a quiet day. `armed === null` is that state; an empty
  //    array is a real, and reportable, nothing.
  function landingsPanel() {
    var L = D.landings;
    if (!L || L.armed == null) {
      return el("div", {class:"panel"}, el("div", {class:"empty",
        text:"The landing digest could not be assembled this tick — this is not the same as nothing having landed. See cron.log."}));
    }
    var armed = L.armed || [], refused = L.refused || [], budget = L.budget || [];
    var hours = L.window_hours || 24;
    var body = [];

    if (!armed.length) {
      body.push(el("div", {class:"panel"}, el("div", {class:"empty",
        text:"Nothing landed autonomously in the last " + hours + " h."})));
    } else {
      // Audit column (requirement 8e, agent-ops#572): the classifier-escape
      // detector's own outcome for this landing, joined by pr_url. `null`
      // (no audit event yet — this pull request has not been reached, or
      // genuinely cannot be) reads "pending", never blank and never folded
      // into a false "clean".
      var rows = armed.map(function (a) {
        var verdict = a.verdict || "unknown";
        var tier = a.tier || "unknown";
        var audit = a.audit || "pending";
        var auditClass = audit === "escape" ? "b-red" : audit === "clean" ? "b-green" : "b-amber";
        var recordBadge = a.anomaly
          ? el("span", {class:"badge b-red", text:"missing",
              title:"No landing-audit-record matches this landing-armed event — an unexplained landing, not merely an unjoined one."})
          : el("span", {class:"badge b-green", text:"ok"});
        return el("tr", {}, [
          el("td", {class:"muted", text: fmtAgo(a.ts)}),
          el("td", {class:"mono", text: (a.repo || "?").split("/")[1] || a.repo || "?"}),
          el("td", {}, prRefFromUrl(a.pr_url, "landings")),
          el("td", {class:"wrap", text: a.title || "—"}),
          el("td", {}, sourceTag(a.source)),
          el("td", {class:"mono", text: a.complexity || "?"}),
          el("td", {class:"mono", text: tier}),
          el("td", {}, el("span", {class: "badge " + (verdict === "approve" ? "b-green" : "b-amber"), text: verdict})),
          el("td", {class:"mono", text: a.method || "?"}),
          el("td", {}, nodeTag(a.node)),
          el("td", {title: a.audit_reason || ""}, el("span", {class: "badge " + auditClass, text: audit})),
          el("td", {}, recordBadge)
        ]);
      });
      body.push(tableOf(["Landed","Repo","PR","Title","Source","Complexity","Tier","Verdict","Method","Node","Audit","Record"], rows));

      // A landing with no matching audit record is the anomaly WI-8 exists to
      // surface, not a join to quietly paper over with "unknown" — named here
      // as its own line, the same way a stalled refusal count already is
      // below, so it reads even to someone skimming past the table itself.
      // Distinct from the classifier-escape "Audit" column beside it
      // (requirement 8e, agent-ops#572): that column judges whether a
      // landing *should* have happened, recomputed post hoc; this one judges
      // whether the record explaining *why it was allowed* exists at all.
      var anomalies = armed.filter(function (a) { return a.anomaly; });
      if (anomalies.length) {
        body.push(el("div", {class:"panel", text:
          anomalies.length + " landing" + (anomalies.length === 1 ? "" : "s") +
          " in this window " + (anomalies.length === 1 ? "has" : "have") +
          " no matching audit record — treat as unexplained."}));
      }
    }

    // The classifier-escape audit's own scoreboard (requirement 8e,
    // agent-ops#572) — all-time, not scoped to this window, since an escape
    // is a permanent fact about one merged pull request. `null` fields mean
    // the roll-up itself could not be assembled this tick, distinguished
    // from a real, reportable zero the same way `armed === null` is above.
    var ea = (D.counts && D.counts.escape_audits) || null;
    if (!ea || ea.checked == null) {
      body.push(el("div", {class:"panel muted", text:
        "Classifier-escape audit: could not be assembled this tick."}));
    } else {
      var eaText = "Classifier-escape audit (all-time): " + ea.checked + " landing" +
        (ea.checked === 1 ? "" : "s") + " checked, " + ea.clean + " clean, " +
        ea.unverifiable + " unverifiable, " + ea.escapes + " escape" + (ea.escapes === 1 ? "" : "s") + ".";
      body.push(el("div", {class: "panel " + (ea.escapes > 0 ? "" : "muted"), text: eaText}));
    }

    // The budget line, per repository that has either a cap or a landing —
    // sourced from lib/merge-budget.sh's own rolling-24h count (D18 issue
    // #574), never a private one. A held or frozen repository is not folded
    // into the same quiet "consumed/cap" text a healthy one gets: it earns
    // its own row with a badge and, for a freeze, why — so a fleet that has
    // been idle for hours because the governor closed it does not read the
    // same as a fleet with nothing left to do. Neither status is a live
    // read — both are the state as of the last gate-5 decision that produced
    // them — so a held/frozen row also carries `as_of`'s age; a stale `held`
    // has already been aged back to `ok` by the Publisher, but a `frozen` one
    // has not, since a freeze stands until a human clears it regardless of
    // how long ago it tripped.
    if (budget.length) {
      var bparts = [];
      var flaggedRepos = [];
      budget.forEach(function (b) {
        var name = (b.repo || "?").split("/")[1] || b.repo || "?";
        var base = b.unlimited ? (name + " " + b.consumed + "/∞") : (name + " " + b.consumed + "/" + b.cap);
        var w = b.oldest_waiting;
        var waitingText = w ? "oldest waiting #" + w.number + ", " + fmtAgo(w.created_at) : null;
        // `as_of` is the source event's own timestamp — the age of a held or
        // frozen row's own decision, not of this tick, since neither status is
        // a live read (scripts/publish-dashboard.sh's own comment on `budget`).
        var asOfText = b.as_of ? "as of " + fmtAgo(b.as_of) : null;
        if (b.status === "frozen") {
          flaggedRepos.push(el("div", {class:"panel"}, [
            el("span", {class:"badge b-red", text:"frozen"}),
            el("span", {class:"mono", text:" " + base}),
            el("span", {class:"muted", text:" — " + [b.reason || "counting anomaly", asOfText, waitingText]
              .filter(Boolean).join(" · ")})
          ]));
        } else if (b.status === "held") {
          var heldExtra = [asOfText, waitingText].filter(Boolean).join(" · ");
          flaggedRepos.push(el("div", {class:"panel"}, [
            el("span", {class:"badge b-amber", text:"held"}),
            el("span", {class:"mono", text:" " + base}),
            heldExtra ? el("span", {class:"muted", text:" — " + heldExtra}) : null
          ]));
        } else {
          bparts.push(base);
        }
      });
      if (bparts.length) {
        body.push(el("div", {class:"panel muted", text: "Merge budget, last " + hours + " h: " + bparts.join(" · ")}));
      }
      flaggedRepos.forEach(function (row) { body.push(row); });
    }

    // Refusals: the count always, and the reasons grouped, because "what the
    // classifier turned down" is the other half of what it did.
    if (refused.length) {
      var byReason = {};
      refused.forEach(function (r) {
        var key = String(r.reason || "unknown").split(":")[0] || "unknown";
        byReason[key] = (byReason[key] || 0) + 1;
      });
      var rparts = Object.keys(byReason).sort().map(function (k) { return k + " ×" + byReason[k]; });
      body.push(el("div", {class:"panel muted", text:
        refused.length + " landing" + (refused.length === 1 ? "" : "s") + " refused in the same window: " + rparts.join(" · ")}));
    } else if (armed.length) {
      body.push(el("div", {class:"panel muted", text:
        "No landings were refused in this window — every pull request the Approver approved also cleared every arming gate."}));
    }

    return el("div", {}, body);
  }

  // Revert rate by repository (D18 issue #579): scripts/publish-revert-
  // rate.sh's own three figures per repository — rolling window (the day-of
  // operational signal), cumulative-since-baseline (what Stage 2's own exit
  // criterion reads), and the stored Stage 0 baseline itself — joined
  // against config.repos in publish-dashboard.sh so a repository whose
  // publishing tick has never once succeeded still gets a row (`{repo}`
  // alone) rather than silently vanishing.
  function revertRateCell(block) {
    if (!block || block.n == null) return el("span", {class:"muted", text:"no data"});
    if (block.rate == null) {
      var why = block.insufficient_samples ?
        "n=" + block.n + " (below the floor of " + block.min_samples + ")" : "n=" + block.n;
      return el("span", {class:"muted", text: why});
    }
    return el("span", {class:"mono", text: (Math.round(block.rate * 1000) / 10) + "% (n=" + block.n + ")"});
  }
  function revertRatePanel() {
    var rows = D.revert_rate;
    if (rows == null) {
      return el("div", {class:"panel"}, el("div", {class:"empty",
        text:"The revert-rate digest could not be assembled this tick. See cron.log."}));
    }
    if (!rows.length) {
      return el("div", {class:"panel"}, el("div", {class:"empty", text:"No repositories configured."}));
    }
    var trs = rows.map(function (row) {
      var repoShort = (row.repo || "?").split("/")[1] || row.repo || "?";
      var above = row.above_baseline;
      var badge = above == null ? el("span", {class:"muted", text:"—"})
        : above ? el("span", {class:"badge b-red", text:"above baseline"})
        : el("span", {class:"badge b-green", text:"at/below baseline"});
      if (!row.rolling) {
        return el("tr", {}, [
          el("td", {class:"mono", text: repoShort}),
          el("td", {class:"muted", colspan:"3", text:"no revert-rate publish yet"}),
          el("td", {}, badge)
        ]);
      }
      return el("tr", {}, [
        el("td", {class:"mono", text: repoShort}),
        el("td", {}, [revertRateCell(row.rolling),
          el("div", {class:"muted", style:"font-size:11px"},
            "last " + (row.window_days || 14) + "d, excl. last 48h"
            + (row.rolling.since ?
                 " (" + fmtTime(row.rolling.since) + " – " + fmtTime(row.rolling.excludes_merged_after) + ")" : ""))]),
        el("td", {}, [revertRateCell(row.cumulative),
          row.cumulative && row.cumulative.since ?
            el("div", {class:"muted", style:"font-size:11px"}, "since " + fmtTime(row.cumulative.since)) : null]),
        el("td", {}, revertRateCell(row.baseline)),
        el("td", {}, badge)
      ]);
    });
    return tableOf(["Repo", "Rolling window", "Cumulative since baseline", "Baseline", "vs baseline"], trs);
  }

  // ---------- cycles panel ----------
  function cyclesPanel(cycles) {
    var body = cyclesTable(cycles);
    // The no-op ticks the Publisher held out of the detail list (#271): the
    // stand-down short-circuits and lock-held skips that would otherwise fill
    // the MAX_CYCLES slots under the */15 cadence. One aggregate line, not
    // rows — and fleet-wide, so it is withheld while the list is filtered to
    // one node rather than shown against a list it does not describe.
    var agg = D.noop_ticks;
    if (nodeFilter || !agg || !agg.total) return body;
    var parts = [];
    if (agg.standdown) parts.push(agg.standdown + " stood down");
    if (agg.skipped) parts.push(agg.skipped + " lock-held skip" + (agg.skipped === 1 ? "" : "s"));
    return el("div", {}, [body, el("div", {class:"muted", style:"margin-top:6px", text:
      "+ " + agg.total + " no-op tick" + (agg.total === 1 ? "" : "s") + " held out of this list — " +
      parts.join(", ") + (agg.last_ts ? "; newest " + fmtAgo(agg.last_ts) : "")})]);
  }

  function cyclesTable(cycles) {
    if (nodeFilter) cycles = cycles.filter(function (cy) { return cy.node === nodeFilter; });
    if (!cycles.length) return el("div", {class:"panel"}, el("div", {class:"empty",
      text: nodeFilter ? "No cycles from " + nodeFilter + " in the fleet window."
          : (D.noop_ticks && D.noop_ticks.total) ? "No substantive cycles in the fleet window."
          : "No cycles recorded yet."}));
    var showNode = fleetVisible();
    var rows = [];
    cycles.forEach(function (cy, i) {
      var stageCells = el("div", {class:"stagecells"}, ["coordinator","implementer","reviewer"].map(function (s) {
        var g = cy.stages && cy.stages[s];
        if (!g) return el("span", {class:"stagecell sc-none", title:s, text: s[0].toUpperCase()});
        var cls = g.limit_hit ? "sc-fail" : (g.is_error ? "sc-fail" : "sc-ok");
        var lbl = s[0].toUpperCase() + (g.cost_usd ? " " + usd(g.cost_usd) : "");
        return el("span", {class:"stagecell " + cls, title: s + (g.terminal_reason ? " — " + g.terminal_reason : ""), text: lbl});
      }));
      // Prefer the stable cycle id; fall back to row index so id-less rows
      // don't collide on one key and toggle together.
      var rowKey = cy.id != null ? "id:" + cy.id : "idx:" + i;
      var isOpen = !!expanded[rowKey];
      var cells = [
        el("td", {class:"muted mono", text: fmtTime(cy.started_at)}),
        el("td", {}, outcomeCell(cy)),
        el("td", {}, sourceTag(cy.source)),
        el("td", {class:"wrap roomy"}, [
          cy.repo ? el("span", {class:"mono muted", text: cy.repo.split("/")[1] + " "}) : null,
          esc(cy.title || cy.item || cy.reason || (cy.dry_run ? "(dry run)" : "")),
          // requirement 17d: this cycle lost the claim race for one or more
          // higher-ranked candidates before winning a lower one — healthy
          // contention recovered from, not a fault, so an informational
          // badge rather than an amber/red one. The word is "recovered", so
          // the stand-down is excluded explicitly: `race_losses` counts the
          // cycle's `claim-lost` events, and a cycle that lost *every*
          // candidate has a count without a claim behind it. That one is
          // named by `racedMarker` beside its outcome instead, which says
          // stood-down and recovered apart.
          (cy.race_losses && cy.outcome !== "stand-down" && racedMarkersPossible())
            ? el("span", {class:"badge b-blue", style:"margin-left:6px",
                title: cy.race_losses + " candidate(s) lost to a peer before this claim landed",
                text: "recovered race ×" + cy.race_losses}) : null ]),
        el("td", {class:"stages"}, stageCells),
