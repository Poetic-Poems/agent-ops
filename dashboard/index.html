  function liveCycleNode(cy) {
    if (!cy || cy.ended_at || !cy.id) return null;
    var ns = fleetNodes();
    for (var i = 0; i < ns.length; i++) {
      if (ns[i].live && ns[i].live.running === true && ns[i].live.cycle === cy.id) return ns[i];
    }
    return null;
  }

  // The Outcome column for one cycle. A cycle *has* an outcome only once it has
  // logged `cycle-end`; before that the column can report a state, and the
  // vocabulary is the fleet cards' — running, or a start with no end and
  // nothing running it. Reading the event ladder alone gets this wrong in the
  // most misleading direction available: a cycle still choosing its work has
  // logged nothing classifiable, so it falls to the ladder's floor and renders
  // as "Ended" — a verdict, on a cycle that has not begun to earn one. The two
  // rungs above it lie the same way in the past tense ("Selected", "PR raised"
  // of a cycle still at work), and nothing is lost by replacing them here: how
  // far it has got is what the Item, Stages and PR cells beside it already say.
  function outcomeCell(cy) {
    if (cy.ended_at) return outcomeBadge(cy.outcome);
    var n = liveCycleNode(cy);
    // "No clean end" is an accusation, so it is only made where the data can
    // support it. `data.js` from before the fleet strip existed carries no node
    // list at all — which a page refreshed from a checkout the Publisher has
    // not re-run on yet is reading right now — and there the honest report is
    // just that the cycle has not ended.
    if (!n && !fleetNodes().length) return el("span", {class:"badge b-grey",
      title:"no cycle-end logged; this data carries no node state, so whether it is still running cannot be told from here"},
      [ el("span", {class:"dot idle"}), document.createTextNode("Not ended") ]);
    if (!n) return el("span", {class:"badge b-amber", text:"No clean end",
      title:"a cycle-start with no cycle-end, and no node running it now — the node was stopped mid-cycle, or its log lost the tail"});
    // The node cards' doubt, in this column's vocabulary — the same two rules,
    // so a cycle cannot read "In progress" here while the card that owns it
    // reads "may be dead" a scroll above.
    var doubt = livenessDoubt(n) || nodeStageOverrun(n), stale = nodeUnknown(n), stage = (n.live || {}).stage;
    return el("span", {class:"badge " + (doubt ? "b-amber" : stale ? "b-grey" : "b-blue"),
      title: doubt ? n.node + ": " + doubt
           : stale ? "running as of " + n.node + "'s last push more than 30 minutes ago — that answer can no longer be called current"
           : "running on " + n.node + (stage ? " — " + stage : "")},
      [ el("span", {class:"dot " + (doubt || stale ? "idle" : "live")}),
        document.createTextNode(doubt ? "In progress?" : "In progress") ]);
  }

  // ---------- what a node is running ----------
  // The newest build anywhere in the fleet, which is what "up to date" means at
  // this moment — there is no absolute answer, since the registry's `latest` is
  // not visible from here and a node's own image is the only version it can
  // report. `built_at` orders builds better than the pull-request number does:
  // it is monotonic by construction, whereas PR numbers only happen to be, and
  // would stop being so the moment a node ran an image built from another repo.
  function fleetNewestVersion() {
    var best = null;
    fleetNodes().forEach(function (n) {
      var v = n.version;
      if (!v || !v.commit) return;
      if (!best) { best = v; return; }
      var a = parseTs(v.built_at), b = parseTs(best.built_at);
      if (a && b) { if (a > b) best = v; }
      else if (v.pr != null && best.pr != null && v.pr > best.pr) best = v;
    });
    return best;
  }

  // The version line of a node's card: which pull request its image contains,
  // the commit that was built, and whether the fleet has moved past it.
  //
  // A fleet is *routinely* mid-update — a roll waits for the cycle it would
  // otherwise kill — so "behind" is an ordinary state and not an alarm; it is
  // said in grey with the reason in the tooltip. What it is there to catch is
  // the case where it stops resolving: a node that has been behind for a day
  // is a node whose watchtower is not rolling, and nothing else on this page
  // would show that.
  function versionLine(n) {
    var v = n.version;
    if (!v || !v.commit) {
      return el("div", {class:"ver", title: n.self
        ? "no CI stamp and no git checkout at /app — this publisher cannot tell what it is running"
        : "this peer's heartbeat carries no version; it is running an image built before versions were reported"},
        el("span", {class:"muted", text:"version unknown"}));
    }
    var line = el("div", {class:"ver"});
    line.appendChild(el("span", {class:"muted",
      title: v.source === "image" ? "from the image's CI build stamp" : "from the git checkout this node runs",
      text: v.source === "image" ? "image" : "checkout"}));
    if (v.pr != null && v.repo) line.appendChild(prRef(v.repo, v.pr, null, "node/" + n.node));
    else line.appendChild(el("span", {class:"muted", title:"the build contains no merged pull request", text:"—"}));
    line.appendChild(v.repo
      ? el("a", {class:"mono muted", target:"_blank", rel:"noopener", title:"the commit this build was made from",
                 href: "https://github.com/" + v.repo + "/commit/" + v.commit, text: v.short})
      : el("span", {class:"mono muted", text: v.short}));
    // "built" is not decoration: the heartbeat line directly below carries an
    // age of its own, and two bare "9h ago"s stacked would invite the reader to
    // take them for the same clock.
    if (v.built_at) line.appendChild(el("span", {class:"muted",
      title: "built " + fmtTime(v.built_at), text: "· built " + fmtAgo(v.built_at)}));
    if (v.dirty) line.appendChild(el("span", {class:"badge b-amber", text:"modified",
      title:"the checkout has uncommitted changes — it is not the commit it names"}));
    var newest = fleetNewestVersion();
    if (newest && newest.commit && newest.commit !== v.commit) {
      line.appendChild(el("span", {class:"badge b-grey", text:"behind",
        title: "the fleet's newest build is " + (newest.pr != null ? "#" + newest.pr + " " : "") +
               newest.short + (newest.built_at ? " (" + fmtAgo(newest.built_at) + ")" : "") +
               " — a roll waits for the cycle it would interrupt, so this is normal for a while"}));
    }
    return line;
  }

  // The node's deployment file, as distinct from its image. A node holds its
  // own compose.yaml, which no image roll can update, so a merged compose
  // change reaches it only by a human running `docker compose up -d` there —
  // and nothing reported that step missing until issue #131. The verdict is
  // the node's own (lib/compose-drift.sh, via its heartbeat): the file lives
  // on that node's host, and no other party can read it.
  //
  // Amber where the version line's "behind" is grey, deliberately: behind
  // resolves itself on the next idle poll, while a drifted or unverifiable
  // compose.yaml resolves only when a human acts, and an amber that never
  // clears by itself is exactly the alarm that was missing. In-sync renders
  // nothing; so does an absent verdict (an image from before the check, or an
  // install that is no container) — for an image the roll that is already on
  // its way will start answering, and the version line's own "behind" covers
  // a node whose rolls have stopped.
  function composeLine(n) {
    var c = n.compose;
    if (!c || !c.status || c.status === "in-sync") return null;
    var badge = c.status === "drifted"
      ? el("span", {class:"badge b-amber", text:"compose drifted",
          title: (c.diff_lines != null ? c.diff_lines + " material line(s) differ: " : "") +
                 "this node's compose.yaml no longer matches the copy its image shipped — " +
                 "a merged compose change deploys nothing by itself; re-fetch the file and run " +
                 "docker compose up -d on that host when it is idle (deploy/docker/README.md, " +
                 "“Keeping the compose file current”)"})
      : el("span", {class:"badge b-amber", text:"compose unverified",
          title: "this node's compose.yaml is not mounted into its containers, so it cannot be " +
                 "checked — which itself means the file predates the drift check and is behind. " +
                 "Re-fetch compose.yaml and run docker compose up -d on that host when it is idle " +
                 "(deploy/docker/README.md, “Keeping the compose file current”)"});
    return el("div", {class:"ver"}, badge);
  }

  // Whether this node is running the registry's newest published image —
  // lib/image-drift.sh's verdict, which versionLine's own "behind" badge
  // cannot give: that one compares nodes against each other, so a fleet
  // uniformly stale (#149, #154 — every node adopting the same broken image
  // at once) reads as perfect agreement, not staleness. This one compares
  // against the registry itself, the one party that always knows what
  // "newest" actually means.
  //
  // Grey while the newest image is younger than image_behind_grace_hours —
  // the same colour versionLine's own "behind" uses, because the same
  // explanation applies: a roll defers while a cycle is in flight
  // (deploy/docker/watchtower-pre-update.sh), so being behind for a while is
  // routine. Past the grace period it turns amber, composeLine's colour for
  // "this wants a human" — by then the ordinary explanation has had time to
  // resolve itself, and a node still behind may have a watchtower that has
  // stopped rolling at all (issue #155). "unverified" (a registry read that
  // failed, or — routinely, right after this code first rolls out — a peer
  // whose heartbeat predates this check) gets its own grey badge rather than
  // silence: unlike compose's absent-verdict case, nothing else on the page
  // would otherwise say the question was even asked.
  function imageLine(n) {
    var img = n.image;
    if (!img || !img.status || img.status === "current") return null;
    if (img.status === "unverified") {
      return el("div", {class:"ver"}, el("span", {class:"badge b-grey", text:"image unverified",
        title: "could not tell whether this node runs the registry's newest image" +
               (img.reason ? " — " + img.reason : "")}));
    }
    var hours = Math.max(1, +((D.config || {}).image_behind_grace_hours) || 3);
    var createdT = parseTs(img.registry_created_at);
    var ageH = createdT ? (Date.now() - createdT.getTime()) / 3600000 : null;
    var stuck = ageH == null || ageH > hours;
    var ageText = createdT ? fmtAgo(img.registry_created_at) : "an unknown time ago";
    var commit = (img.registry_commit || "").slice(0, 7);
    var badge = el("span", {class: "badge " + (stuck ? "b-amber" : "b-grey"), text: "image behind",
      title: "the registry's newest image (" + commit + ") was published " + ageText +
             (stuck
               ? " — longer than the " + hours + "h grace this page gives a deferred roll; " +
                 "this node may need attention (scripts/check-node-image.sh, run on its host)"
               : " — a roll waits for a cycle in flight, so this is normal for a while")});
    return el("div", {class:"ver"}, badge);
  }

  // ---------- section builder ----------
  function sectionOf(title, body) {
    return el("section", {}, [ el("h2", {text:title}), body ]);
  }

  // ---------- PRs panel ----------
  function prsPanel(prs) {
    if (!prs.length) return el("div", {class:"panel"}, el("div", {class:"empty", text: (D.github && D.github.ok===false) ? "GitHub unreachable." : "No open agent PRs."}));
    var rows = prs.map(function (p) {
      var ck = p.checks || {};
      var ckBadge;
      if (!ck.total) ckBadge = el("span", {class:"muted", text:"—"});
      else if (ck.failed) ckBadge = el("span", {class:"badge b-red", text: ck.failed + " failing"});
      else if (ck.pending) ckBadge = el("span", {class:"badge b-amber", text: ck.pending + " pending"});
      else ckBadge = el("span", {class:"badge b-green", text: "checks pass"});
      var mergeBadge = p.mergeable === "MERGEABLE" ? el("span",{class:"badge b-green",text:"mergeable"})
        : p.mergeable === "CONFLICTING" ? el("span",{class:"badge b-red",text:"conflicts"})
        : el("span",{class:"muted",text: (p.mergeStateStatus||"?").toLowerCase()});
      return el("tr", {}, [
        el("td", {}, prRef(p.repo, p.number, p.url, "openprs")),
        el("td", {class:"wrap"}, [ el("span",{class:"mono muted", text: p.repo.split("/")[1] + " "}), esc(p.title) ]),
        el("td", {}, p.isDraft ? el("span",{class:"badge b-grey",text:"draft"}) : el("span",{class:"badge b-blue",text:"ready"})),
        el("td", {}, ckBadge),
        el("td", {}, mergeBadge),
        el("td", {class:"muted", text: fmtAgo(p.createdAt)})
      ]);
    });
    return tableOf(["PR","Title","State","Checks","Merge","Opened"], rows);
  }

  // ---------- fleet strip ----------
  // One card per node, each carrying that node's own live state — running or
  // idle, the stage and item in flight, and how fresh the answer is. This is
  // the readout the header used to carry alone, back when a node and the
  // pipeline were the same thing; with a fleet there is no single "what is it
  // doing", so the question is answered per node here and only summarised up
  // top. Clicking a card filters the cycle list and the recent log to that
  // node; clicking it again clears the filter.
  function fleetStrip() {
    var wrap = el("div", {class:"cards fleet", id:"fleetstrip"});
    fleetNodes().forEach(function (n) { wrap.appendChild(nodeCard(n)); });
    return wrap;
  }

  // Is this node's state knowable at all? A peer's is only ever as fresh as its
  // last push, so once that has gone stale the card reports "unknown" rather
  // than half-hour-old news dressed as current.
  function nodeUnknown(n) { return !n.self && n.stale; }
  function nodeRunning(n) { return !nodeUnknown(n) && !!(n.live && n.live.running === true); }

  function nodeCard(n) {
    var live = n.live || null;
    var unknown = nodeUnknown(n), running = nodeRunning(n);
    // Two readings of the same doubt, and at most one badge for them: past
    // `lock_stale_after` the liveness rule is the stronger claim and wins, and
    // before it the stage's own timeout is the only one that can fire at all.
    var doubt = livenessDoubt(n) || nodeStageOverrun(n);
    var card = el("div", {class:"card clickable" + (n.stale ? " nodestale" : "") + (nodeFilter === n.node ? " nodeselected" : ""),
                          title: nodeFilter === n.node ? "click to show every node's cycles and log events" : "click to filter cycles and log events to " + n.node});
    card.appendChild(el("div", {class:"k"}, [ nodeTag(n.node), document.createTextNode(" "), roleBadge(n.role) ]));

    var state = el("div", {class:"state"});
    if (unknown) {
      state.appendChild(el("span", {}, [ el("span",{class:"dot idle"}), "state unknown" ]));
    } else if (running) {
      state.appendChild(el("span", {}, [ el("span",{class:"dot live"}), "running" ]));
      if (doubt) state.appendChild(el("span", {class:"badge b-amber", style:"margin-left:6px",
                                               title: doubt, text:"may be dead"}));
    } else {
      state.appendChild(el("span", {}, [ el("span",{class:"dot idle"}), "idle" ]));
    }
    card.appendChild(state);

    if (unknown) {
      card.appendChild(el("div", {class:"work muted",
        text:"nothing this node published can still be called current."}));
    } else if (running) {
      var w = workDetail(live);
      if (w) card.appendChild(el("div", {class:"work"}, w));
      if (live.since) card.appendChild(el("div", {class:"when",
        text: "since " + fmtTime(live.since) + " (" + fmtAgo(live.since) + ")"}));
    } else if (live && live.ended_at) {
      // The outcome comes from the cycle list rather than from a second copy of
      // the outcome rule; a cycle that has aged out of that list simply shows
      // its time.
      var last = cycleById(live.cycle);
      card.appendChild(el("div", {class:"work"}, [
        el("span", {class:"muted", text:"last cycle " + fmtAgo(live.ended_at) + " "}),
        last ? outcomeBadge(last.outcome) : null
      ]));
      var lw = last ? workDetail(last) : null;
      if (lw) card.appendChild(el("div", {class:"when"}, lw));
    } else if (live) {
      // A cycle that started, never logged `cycle-end`, and is not running now.
      // That is the trace a node killed mid-cycle leaves (TD26072301), and it
      // is worth saying rather than smoothing into a plain "idle" — nothing
      // else on the page distinguishes it from a cycle that finished.
      card.appendChild(el("div", {class:"work"}, [
        el("span", {class:"muted", text:"last cycle " + fmtAgo(live.since) + " "}),
        el("span", {class:"badge b-amber", text:"no clean end",
          title:"a cycle-start with no cycle-end, and nothing running now — the node was stopped mid-cycle, or its log lost the tail"})
      ]));
    } else {
      card.appendChild(el("div", {class:"work muted",
        text: n.last_cycle ? "last cycle " + esc(n.last_cycle).slice(0, 16) : "no cycles yet"}));
    }

    card.appendChild(versionLine(n));
    var compose = composeLine(n);
    if (compose) card.appendChild(compose);
    var image = imageLine(n);
    if (image) card.appendChild(image);

    card.appendChild(el("div", {class:"hb" + (n.stale ? " stale" : ""),
      title: n.self ? "read from this node's own lock and log"
                    : "derived from the state this peer last pushed — no fresher than its heartbeat",
      text: n.self ? "this node — read live"
           : n.stale ? "STALE — last push >30 min ago"
           : n.heartbeat_age_s == null ? "no heartbeat"
           : "as of its last push, " + fmtAgo(n.heartbeat_ts)}));

    card.addEventListener("click", function (ev) {
      // The version line put links inside a card that is itself a filter
      // toggle; following one must not also change the filter behind it.
      if (ev.target.closest && ev.target.closest("a")) return;
      nodeFilter = (nodeFilter === n.node) ? null : n.node;
      renderBody();
    });
    return card;
  }

  // ---------- claims panel ----------
  // The live claim registry: work the fleet holds that has not yet surfaced
  // as a PR. Every row here is an item no other node will pick up.
  function claimsPanel() {
    var claims = fleetClaims();
    if (!claims.length) return el("div", {class:"panel"}, el("div", {class:"empty", text:"No live claims — nothing is mid-flight."}));
    var rows = claims.map(function (c) {
      return el("tr", {}, [
        el("td", {class:"mono", text: (c.repo || "?").split("/")[1] || c.repo}),
        el("td", {class:"mono wrap", text: c.key || "?"}),
        el("td", {}, nodeTag(c.node)),
        el("td", {}, sourceTag(c.source)),
        el("td", {class:"wrap", text: c.item || ""}),
        el("td", {class:"muted", text: fmtAgo(c.ts)})
      ]);
    });
    return tableOf(["Repo","Claim","Node","Source","Item","Held"], rows);
  }

  // ---------- cycles panel ----------
  function cyclesPanel(cycles) {
    if (nodeFilter) cycles = cycles.filter(function (cy) { return cy.node === nodeFilter; });
    if (!cycles.length) return el("div", {class:"panel"}, el("div", {class:"empty",
      text: nodeFilter ? "No cycles from " + nodeFilter + " in the fleet window." : "No cycles recorded yet."}));
    var showNode = fleetVisible();
    var rows = [];
    cycles.forEach(function (cy, i) {
      var stageCells = el("div", {class:"stagecells"}, ["coordinator","implementor","reviewer"].map(function (s) {
        var g = cy.stages && cy.stages[s];
        if (!g) return el("span", {class:"stagecell sc-none", title:s, text: s[0].toUpperCase()});
        var cls = g.limit_hit ? "sc-fail" : (g.is_error ? "sc-fail" : "sc-ok");
        var lbl = s[0].toUpperCase() + (g.cost_usd ? " " + usd(g.cost_usd) : "");
        return el("span", {class:"stagecell " + cls, title: s + (g.terminal_reason ? " — " + g.terminal_reason : ""), text: lbl});
      }));
      // Prefer the stable cycle id; fall back to row index so id-less rows
      // don't collide on one key and toggle together.
      var rowKey = cy.id != null ? "id:" + cy.id : "idx:" + i;
      var isOpen = !!expanded[rowKey];
      var cells = [
        el("td", {class:"muted mono", text: fmtTime(cy.started_at)}),
        el("td", {}, outcomeCell(cy)),
        el("td", {}, sourceTag(cy.source)),
        el("td", {class:"wrap roomy"}, [
          cy.repo ? el("span", {class:"mono muted", text: cy.repo.split("/")[1] + " "}) : null,
          esc(cy.title || cy.item || cy.reason || (cy.dry_run ? "(dry run)" : "")),
          // requirement 17d: this cycle lost the claim race for one or more
          // higher-ranked candidates before winning a lower one — healthy
          // contention recovered from, not a fault, so an informational
          // badge rather than an amber/red one.
          cy.race_losses ? el("span", {class:"badge b-blue", style:"margin-left:6px",
            title: cy.race_losses + " candidate(s) lost to a peer before this claim landed",
            text: "recovered race ×" + cy.race_losses}) : null ]),
        el("td", {class:"stages"}, stageCells),
        el("td", {class:"mono", text: cy.total_cost_usd ? usd(cy.total_cost_usd) : "—"}),
        // The number, not the word "PR": it is the same identifier the rest of
        // the page now uses, and it carries the same record on hover.
        el("td", {}, cy.pr_url ? prRefFromUrl(cy.pr_url, "cycle/" + cy.id) : document.createTextNode(""))
      ];
      if (showNode) cells.splice(1, 0, el("td", {}, nodeTag(cy.node)));
      var tr = el("tr", {class:"clickable"}, cells);
      var detail = el("tr", {class:"detail", style: isOpen ? "" : "display:none"}, el("td", {colspan: showNode ? 8 : 7}, cycleDetail(cy)));
      tr.addEventListener("click", function (ev) {
        if (ev.target.tagName === "A") return;
        var nowOpen = detail.style.display === "none";
        detail.style.display = nowOpen ? "" : "none";
        if (nowOpen) expanded[rowKey] = true; else delete expanded[rowKey];
      });
      rows.push(tr); rows.push(detail);
    });
    var headers = showNode
      ? ["Started","Node","Outcome","Source","Item","Stages (cost)","Total","PR"]
      : ["Started","Outcome","Source","Item","Stages (cost)","Total","PR"];
    return tableOf(headers, rows);
  }

  function cycleDetail(cy) {
    var w = el("div", {class:"detailwrap"});
    var meta = [];
    meta.push("cycle " + cy.id);
    if (cy.source) meta.push("source: " + cy.source);
    if (cy.item) meta.push("item: " + cy.item);
    if (cy.ended_at) meta.push("ended " + fmtTime(cy.ended_at));
    w.appendChild(el("div", {class:"muted mono", style:"margin-bottom:8px; white-space:normal", text: meta.join("  ·  ")}));
    if (cy.reason) w.appendChild(el("div", {style:"margin-bottom:8px"}, [el("b",{text:"Reason: "}), esc(cy.reason)]));
    if (cy.fail_detail) w.appendChild(el("div", {class:"banner red", style:"margin:8px 0"}, esc(cy.fail_detail)));
    if (cy.warning) w.appendChild(el("div", {class:"banner amber", style:"margin:8px 0"}, esc(cy.warning)));

    ["coordinator","implementor","reviewer"].forEach(function (s) {
      var g = cy.stages && cy.stages[s];
      if (!g) return;
      var box = el("div", {class:"stagebox"});
      var head = el("div", {class:"head"}, [ el("span", {class:"name", text:s}) ]);
      function kv(k,v){ head.appendChild(el("span", {class:"kv", html: k + " <b>" + esc(v) + "</b>"})); }
      if (g.model) kv("model", g.model);
      if (g.cost_usd != null) kv("cost", usd(g.cost_usd));
      if (g.duration_ms != null) kv("took", fmtDur(g.duration_ms));
      if (g.num_turns != null) kv("turns", g.num_turns);
      if (g.terminal_reason) kv("ended", g.terminal_reason);
      if (g.limit_hit) head.appendChild(el("span", {class:"badge b-amber", text:"usage limit"}));
      box.appendChild(head);
      if (g.status) box.appendChild(el("pre", {class:"tx",
        "data-scroll-key": cy.id + "/" + s + "/status", text: JSON.stringify(g.status, null, 2)}));
      if (g.result) box.appendChild(trackedDetails(cy.id + "/" + s + "/result",
        "final message (" + g.result.length + " chars)",
        el("pre", {class:"tx", "data-scroll-key": cy.id + "/" + s + "/result", text: g.result})));
      if (g.stderr) box.appendChild(trackedDetails(cy.id + "/" + s + "/stderr",
        "stderr",
        el("pre", {class:"tx err", "data-scroll-key": cy.id + "/" + s + "/stderr", text: g.stderr})));
      w.appendChild(box);
    });
    return w;
  }

  // A <details> whose open/closed state is remembered by `key` so it survives
  // an in-place re-render (see the state maps up top).
  function trackedDetails(key, summaryText, body) {
    var d = el("details", {class:"tx", open: openDetails[key] ? "" : null}, [
      el("summary", {text: summaryText}),
      body
    ]);
    d.addEventListener("toggle", function () {
      if (d.open) openDetails[key] = true; else delete openDetails[key];
    });
    return d;
  }

  // Whose move it is on a blocked item. An open escalation issue is a request
  // addressed to the person reading this page, so it is a link and it wins: the
  // pipeline has stopped and is waiting for them. Otherwise this shows the
  // Enabler's last verdict, which says the item has at least been looked at
  // properly and by when it will be looked at again. Nothing at all means the
  // item is still the pipeline's own to clear.
  function escalationCell(b) {
    if (b.escalation_url) {
      return el("a", {href: b.escalation_url, target:"_blank",
                      text: "#" + (b.escalation_issue || "?") + " — needs you"});
    }
    if (b.enabler_outcome) {
      return el("span", {class:"muted", text: b.enabler_outcome + " " + fmtAgo(b.enabler_ts)});
    }
    return document.createTextNode("—");
  }

  // A refinement block (kind: "needs-refinement") is not waiting on the world
  // like an ordinary block — it is waiting on the pipeline's own Enabler and,
  // past one refinement, on a human. Reading "blocked: 9" with no way to tell
  // the two populations apart understates how much of the backlog is really a
  // specification gap, so each such row gets a badge and the panel a filter to
  // set them aside.
  var REFINEMENT_KIND = "needs-refinement";
  function isRefinementBlock(b) { return b.kind === REFINEMENT_KIND; }
  function refinementBadge(b) {
    if (!isRefinementBlock(b)) return null;
    return el("span", {class:"badge b-purple", style:"margin-left:6px",
      title:"waiting on the pipeline's own Enabler, and past one refinement, on a human",
      text:"refinement"});
  }

  // How many void rows the list shows before the see-more control; the rest are
  // one click away. Ten is about a screen of a panel nobody is here to read.
  var VOID_ROWS = 10;

  // ---------- failures & blocked ----------
  function failuresPanel() {
    var wrap = el("div");
    var blockedAll = D.blocked || [];
    var refinementCount = blockedAll.filter(isRefinementBlock).length;
    var blocked = hideRefinement ? blockedAll.filter(function (b) { return !isRefinementBlock(b); }) : blockedAll;
    var failedCycles = (D.cycles || []).filter(function (cy){ return cy.outcome === "failed"; });

    if (blockedAll.length) {
      var head = el("h2", {style:"margin-top:0"}, [
        document.createTextNode("Blocked items (" + blocked.length +
          (blocked.length !== blockedAll.length ? " of " + blockedAll.length : "") + ")")
      ]);
      if (refinementCount) {
        head.appendChild(el("label", {class:"muted", style:"font-weight:400; font-size:12px; margin-left:12px; cursor:pointer"}, [
          el("input", {type:"checkbox", style:"margin-right:4px", checked: hideRefinement ? "" : null,
            onchange: function (ev) { hideRefinement = ev.target.checked; renderBody(); }}),
          document.createTextNode("hide " + refinementCount + " refinement block" + (refinementCount === 1 ? "" : "s"))
        ]));
      }
      wrap.appendChild(head);
      if (blocked.length) {
        var brows = blocked.map(function (b) {
          return el("tr", {}, [
            el("td", {class:"mono"}, [ document.createTextNode(b.item), refinementBadge(b) ]),
            el("td", {class:"mono muted", text: b.repo ? b.repo.split("/")[1] : "—"}),
            el("td", {class:"muted", text: fmtAgo(b.ts)}),
            el("td", {class:"wrap", text: (b.stage ? b.stage + ": " : "") + (b.detail || "")}),
            el("td", {}, escalationCell(b))
          ]);
        });
        wrap.appendChild(tableOf(["Item","Repo","Since","Blocker","Escalated"], brows));
      } else {
        wrap.appendChild(el("div", {class:"muted", text:"All blocked items are refinement blocks — hidden by the filter above."}));
      }
    }

    // Void items are listed apart from blocked ones because they call for the
    // opposite response: a blocked item may need a human to clear its path, a
    // void item is closed and only needs one if the verdict itself is wrong.
    //
    // It is also the page's one unbounded list of work nobody need act on: a
    // fleet retires items steadily, so this grows without limit while every
    // panel that *does* want an answer sits below it. Hence the two caps —
    // the first ten rows, each three lines tall — and both open on demand,
    // because the reason an item was retired is the whole content of a row
    // and truncation that could not be undone would be a lie. The choices are
    // held in the state maps up top, so a refresh mid-read leaves them alone.
    //
    // Newest first, which the list is not as it arrives: `void_items` groups by
    // repo and item, so untouched the ten rows a cap keeps would be whichever
    // item ids happened to sort first — a truncation with no meaning. Every
    // event on this page carries the same UTC `%Y-%m-%dT%H:%M:%SZ` stamp, so a
    // string compare orders them, and a copy is sorted rather than `D.void`
    // itself, which the refresh signature reads.
    var voided = (D.void || []).slice().sort(function (a, b) {
      return String(b.ts || "").localeCompare(String(a.ts || ""));
    });
    if (voided.length) {
      wrap.appendChild(el("h2", {style: blockedAll.length ? "" : "margin-top:0", text:"Void items (" + voided.length + ")"}));
      wrap.appendChild(el("div", {class:"muted", style:"margin:-6px 0 8px", text:"No work to do — closed permanently. Only a human can reopen these (append an `unvoided` event to the log)."}));
      var vrows = (voidShowAll ? voided : voided.slice(0, VOID_ROWS)).map(function (v, i) {
        // Repo and item name the record; the index keeps two nameless rows
        // from sharing one key and opening together.
        var key = (v.repo || "") + "/" + (v.item || "") + "/" + i;
        var why = el("div", {class: voidOpen[key] ? "" : "clip",
          text: (v.stage ? v.stage + ": " : "") + (v.detail || "") + (v.evidence ? " — " + v.evidence : "")});
        var tr = el("tr", {class:"clickable"}, [
          el("td", {class:"mono", text: v.item}),
          el("td", {class:"mono muted", text: v.repo ? v.repo.split("/")[1] : "—"}),
          el("td", {class:"muted", text: fmtAgo(v.ts)}),
          el("td", {class:"wrap"}, why)
        ]);
        tr.addEventListener("click", function () {
          if (voidOpen[key]) { delete voidOpen[key]; why.className = "clip"; }
          else { voidOpen[key] = true; why.className = ""; }
        });
        return tr;
      });
      if (voided.length > VOID_ROWS) {
        var hidden = voided.length - VOID_ROWS;
        vrows.push(el("tr", {}, el("td", {class:"morecell", colspan:4},
          el("button", {class:"more", type:"button", onclick: function () { voidShowAll = !voidShowAll; renderBody(); },
            text: voidShowAll ? "See fewer" : "See more — " + hidden + " older item" + (hidden === 1 ? "" : "s")}))));
      }
      wrap.appendChild(tableOf(["Item","Repo","Since","Why there is no work"], vrows));
    }

    wrap.appendChild(el("h2", {style: (blockedAll.length || voided.length) ? "" : "margin-top:0", text:"Failed cycles (" + failedCycles.length + ")"}));
    if (!failedCycles.length) return (wrap.appendChild(el("div",{class:"panel"}, el("div",{class:"empty",text:"No failed cycles in view."}))), wrap);
    var rows = failedCycles.map(function (cy) {
      return el("tr", {}, [
        el("td", {class:"muted mono", text: fmtTime(cy.started_at)}),
        el("td", {class:"mono muted", text: cy.repo ? cy.repo.split("/")[1] : "—"}),
        el("td", {class:"wrap", text: cy.fail_detail || "—"}),
        el("td", {}, cy.limit_hit ? el("span",{class:"badge b-amber",text:"usage limit"}) : document.createTextNode(""))
      ]);
    });
    wrap.appendChild(tableOf(["When","Repo","What failed",""], rows));
    return wrap;
  }

  // ---------- repo nice ----------
  // config.json's per-repo `nice` (pipeline spec, requirement 3): an integer
  // from -19 to 19, absent meaning 0, that multiplies the repo's
  // default-branch staleness age by 1.25^(-nice) before the Script orders its
  // repo walk. It reaches the page for free — `repos` already ships wholesale
  // into `config` — so all that is here is the rendering, and two properties
  // of the feature decide its shape:
  //
  //   - **It is the Script's ordering input, not the Co-Ordinator's.** The
  //     values never reach the model (pipeline spec, requirement 3). An
  //     unqualified badge inside a panel headed "what the Co-Ordinator sees"
  //     would assert exactly the thing that design is careful not to do, so
  //     the panel gains a line naming who acts on it — the operator asking
  //     "why does this repo keep coming up first" needs the answer to name
  //     the right half of the pipeline, or the next place they look is the
  //     Co-Ordinator's prompt, where there is nothing to find.
  //   - **Absent and 0 are the same repo, and both are the ordinary case.**
  //     Neither renders anything: no badge, no note, so a fleet with no
  //     `nice` set anywhere sees the page exactly as it was before this
  //     existed. That is the same omit-never-empty contract
  //     lib/repo-order.sh keeps for the fingerprint, kept here for the
  //     matching reason — a neutral config should be indistinguishable from
  //     one predating the feature, on the page as in the hash.
  //
  // The page shows what is *configured*, which on a running node is also what
  // the walk used: a non-integer or out-of-range value never gets this far,
  // the Script having refused the cycle at startup. `Math.floor` mirrors the
  // normalisation the fingerprint applies to the integer-valued float
  // spelling (`-5.0`) that guard deliberately admits.
  function niceOf(slug) {
    var repos = (D.config && D.config.repos) || [];
    for (var i = 0; i < repos.length; i++) {
      if (repos[i] && repos[i].slug === slug) {
        var n = +repos[i].nice;
        return isFinite(n) ? Math.floor(n) : 0;
      }
    }
    return 0;
  }
  // The weighting a `nice` buys, to two decimal places: 1.25^(-nice), i.e. how
  // much older than the clock says this repo looks when the walk is ordered.
  function niceWeight(n) { return Math.pow(1.25, -n).toFixed(2); }
  function niceBadge(slug) {
    var n = niceOf(slug);
    if (!n) return null;
    return el("span", {
      class: "badge " + (n < 0 ? "b-blue" : "b-grey"),
      style: "margin-left:8px; font-weight:600",
      title: "nice " + n + " (config.json): the Script weights this repo's staleness age ×" +
             niceWeight(n) + " when it orders the repo walk, so it gets " +
             (n < 0 ? "earlier" : "later") + " attention. It biases the order and never starves a repo — " +
             "the global cross-repo tiers still outrank the walk, and a repo that alone has qualifying " +
             "work is selected whatever its nice.",
      text: "nice " + n
    });
  }

  // ---------- inputs ----------
  // A source's per-repo read state (TD-PPagop-26080201): "answered" (the
  // ordinary case), "answered_404" (a legitimate absence — e.g. a repo with
  // no tech-debt register), or "failed" (the call did not answer at all).
  // Absent altogether on data carried forward from before this field existed,
  // which reads as "answered" — the only state that renders exactly as it
  // always did.
  function srcState(g, key) {
    return (g.state && g.state[key]) || "answered";
  }
  // A failed source must not show a count of zero — indistinguishable from a
  // repo that genuinely has none — so it renders a "couldn't read" marker
  // instead. `answered_404` is a real, legitimate zero (unlike `failed`) and
  // renders as an ordinary count.
  function countText(g, key, count, label) {
    return srcState(g, key) === "failed" ? ("couldn't read " + label) : (count + " " + label);
  }

  function inputsPanel() {
    var inputs = (D.github && D.github.inputs) || {};
    var slugs = Object.keys(inputs);
    if (!slugs.length) return el("div", {class:"panel"}, el("div", {class:"empty", text: (D.github && D.github.ok===false) ? "GitHub unreachable." : "No work-source data."}));
    var wrap = el("div");
    if (slugs.some(function (s) { return niceOf(s) !== 0; })) {
      wrap.appendChild(el("div", {class:"muted", style:"margin:-2px 0 10px", text:
        "A nice badge is that repo's configured attention bias: the Script weights its staleness age by " +
        "1.25^(-nice) when it orders the repo walk. The Co-Ordinator is never told these values — it is " +
        "handed the finished order."}));
    }
    slugs.forEach(function (slug) {
      var g = inputs[slug] || {};
      var findings = g.findings || [];
      var secCount = findings.filter(function (f){ return f.security; }).length;
      var cqCount  = findings.length - secCount;
      // The ledger rows, as the Co-Ordinator would meet them: {id, title,
      // status, url}, resolved items already dropped by the publisher. An item
      // whose metadata the publisher has not read yet carries no status; it is
      // shown, because it is not yet known *not* to be work, but it is counted
      // apart from the ones that are known open — a cold cache must degrade to
      // saying less, never to overstating the debt.
      var td = (g.tech_debt || []).map(function (t) {
        // A fetch carried forward from before the rows carried titles is a
        // "| ID |" string; nothing else ever is.
        return (typeof t === "string")
          ? { id: t.replace(/^\s*\|\s*/, "").replace(/\s*\|\s*$/, ""), title:"", status:"", url:"" }
          : (t || {});
      });
      var tdRead = td.filter(function (t){ return t.status; }).length;
      var box = el("div", {class:"panel", style:"padding:14px; margin-bottom:12px"});
      box.appendChild(el("div", {style:"font-weight:650; margin-bottom:8px"}, [
        el("span",{class:"mono",text: slug}),
        niceBadge(slug),
        el("span",{class:"muted", style:"font-weight:400", html:
          "  ·  " + [
            countText(g, "findings", secCount, "security findings"),
            countText(g, "failed_runs", g.failed_runs ? g.failed_runs.length : 0, "failing workflows"),
            countText(g, "issues", g.issues ? g.issues.length : 0, "open issues"),
            (srcState(g, "tech_debt") === "failed"
              ? "couldn't read tech-debt items"
              : (tdRead + " open tech-debt items" +
                 (td.length > tdRead ? " (+" + (td.length - tdRead) + " unread)" : ""))),
            countText(g, "findings", cqCount, "code-quality findings")
          ].join(" · ")})
      ]));
      if (findings.length) {
        var sevClass = { critical:"b-red", high:"b-red", error:"b-amber", medium:"b-amber", warning:"b-amber", low:"b-grey", note:"b-grey" };
        box.appendChild(el("div", {class:"muted", style:"margin:4px 0 2px", text:"Security & code-quality findings (Co-Ordinator picks these first):"}));
        findings.slice(0,12).forEach(function (f){
          var row = el("div", {style:"margin:2px 0"}, [
            el("span", {class:"badge " + (sevClass[f.severity] || "b-grey"), text: (f.security ? "SEC " : "") + (f.severity || "?")}),
            document.createTextNode(" "),
            el("a", {href:f.url, target:"_blank", text: f.ref}),
            document.createTextNode(" " + esc(f.title || ""))
          ]);
          box.appendChild(row);
        });
        if (findings.length > 12) box.appendChild(el("div", {class:"muted", style:"font-size:11.5px", text:"… and " + (findings.length - 12) + " more"}));
      }
      if (g.failed_runs && g.failed_runs.length) {
        box.appendChild(el("div", {class:"muted", style:"margin:4px 0 2px", text:"Failing workflows on default branch:"}));
        g.failed_runs.forEach(function (r){ box.appendChild(el("div", {}, el("a",{href:r.url,target:"_blank",text:"✗ " + r.workflowName}))); });
      }
      if (g.issues && g.issues.length) {
        // Ordered by Priority band, because that — not the issue number — is the
        // order the Co-Ordinator will reach them in (pipeline spec, 15e).
        var PRI = { Urgent: 0, High: 1, Medium: 2, Low: 3 };
        var PRI_CLASS = { Urgent: "b-red", High: "b-amber", Medium: "b-blue", Low: "b-grey" };
        var byPriority = g.issues.slice().sort(function (a, b) {
          var ra = PRI[a.priority], rb = PRI[b.priority];
          if (ra === undefined) ra = PRI.Medium;
          if (rb === undefined) rb = PRI.Medium;
          return ra - rb || a.number - b.number;
        });
        box.appendChild(el("div", {class:"muted", style:"margin:8px 0 2px", text:"Open issues (in priority order):"}));
        byPriority.slice(0,8).forEach(function (is){
          var band = PRI[is.priority] === undefined ? "Medium" : is.priority;
          box.appendChild(el("div", {}, [
            el("span", {class:"badge " + PRI_CLASS[band], title:"Priority: " + band, text: band}),
            document.createTextNode(" "),
            el("a",{href:is.url,target:"_blank",text:"#"+is.number}),
            document.createTextNode(" " + esc(is.title))
          ]));
        });
      }
      if (td.length) {
        var TD_CLASS = { "in-progress": "b-blue", open: "b-amber" };
        box.appendChild(el("div", {class:"muted", style:"margin:8px 0 2px", text:"Tech-debt ledger (unresolved items):"}));
        td.slice(0,12).forEach(function (t){
          box.appendChild(el("div", {style:"margin:2px 0; white-space:normal"}, [
            t.status ? el("span", {class:"badge " + (TD_CLASS[t.status] || "b-grey"), text: t.status}) : null,
            t.status ? document.createTextNode(" ") : null,
            t.url ? el("a", {href:t.url, target:"_blank", class:"mono", style:"font-size:11.5px", text: t.id})
                  : el("span", {class:"mono", style:"font-size:11.5px", text: t.id}),
            document.createTextNode(t.title ? "  " + esc(t.title) : "")
          ]));
        });
        if (td.length > 12) box.appendChild(el("div", {class:"muted", style:"font-size:11.5px", text:"… and " + (td.length - 12) + " more"}));
      }
      wrap.appendChild(box);
    });
    return wrap;
  }

  // ---------- spend charts ----------
  function spendByDay() {
    var days = (D.counts && D.counts.by_day) || [];
    if (!days.length) return el("div", {class:"empty", text:"No token cost recorded."});
    var max = Math.max.apply(null, days.map(function (d){ return d.usd; })) || 1;
    return el("div", {class:"bars"}, days.map(function (d) {
      var label = d.day.slice(4,6) + "/" + d.day.slice(6,8);
      return el("div", {class:"bar"}, [
        el("span", {class:"mono muted", text: label}),
        el("div", {class:"track"}, el("div", {class:"fill", style:"width:" + (d.usd/max*100) + "%"})),
        el("span", {class:"mono", style:"text-align:right", text: usd(d.usd) + " · " + d.n})
      ]);
    }));
  }
  function spendByModel() {
    var ms = (D.counts && D.counts.by_model) || [];
    if (!ms.length) return el("div", {class:"empty", text:"No token cost recorded."});
    var max = Math.max.apply(null, ms.map(function (m){ return m.usd; })) || 1;
    return el("div", {class:"bars"}, ms.map(function (m) {
      var short = m.model.replace("claude-","").replace(/-\d{8}$/,"");
      return el("div", {class:"bar"}, [
        el("span", {class:"mono muted", title:m.model, text: short}),
        el("div", {class:"track"}, el("div", {class:"fill", style:"width:" + (m.usd/max*100) + "%"})),
        el("span", {class:"mono", style:"text-align:right", text: usd(m.usd) + " · " + m.n})
      ]);
    }));
  }

  // The actors, named as the specs name them. Display-only and failing open,
  // exactly like the source tags: the vocabulary belongs to the pipelines (an
  // actor is a transcript filename), so an actor added upstream shows up here
  // under its raw token rather than vanishing into the totals.
  var ACTOR = {
    "coordinator":      ["coordinator", "the Co-Ordinator — chooses the work"],
    "implementor":      ["implementor", "the Implementor — makes the change and raises the PR"],
    "reviewer":         ["reviewer",    "the Reviewer — reviews the PR and marks it ready"],
    "enabler":          ["enabler",     "the Enabler — examines blocked items and escalates"],
    "project-reviewer": ["proj-review", "the Project Reviewer — the weekly project-review cycle"]
  };
  // Same bars as by-model, and deliberately so: this is the same measure cut a
  // different way, and a second visual language would imply otherwise. The
  // fills stay one accent colour for the same reason — the bar's length is the
  // whole message, and a hue per actor would be identity encoding on a chart
  // where identity is already the axis label.
  function spendByActor() {
    var as = (D.counts && D.counts.by_actor) || [];
    if (!as.length) return el("div", {class:"empty", text:"No token cost recorded."});
    var max = Math.max.apply(null, as.map(function (a){ return a.usd; })) || 1;
    return el("div", {class:"bars wide"}, as.map(function (a) {
      var m = ACTOR[a.actor] || [a.actor, "actor: " + a.actor];
      return el("div", {class:"bar"}, [
        el("span", {class:"mono muted", title: m[1], text: m[0]}),
        el("div", {class:"track"}, el("div", {class:"fill", style:"width:" + (a.usd/max*100) + "%"})),
        el("span", {class:"mono", style:"text-align:right", title: a.n + " stage run(s)",
                    text: usd(a.usd) + " · " + a.n})
      ]);
    }));
  }

  // ---------- log & cron ----------
  // Which agent an event is the work of, or null where none was acting.
  //
  // There is no `actor` field to read: the pipelines record it in whichever
  // field the event already had a reason to carry, and this reads all of them
  // rather than asking either pipeline to log something new for the page's
  // benefit.
  //
  // - `stage` is the implementation pipeline's own name for its actors, and
  //   also where it records the one step of a cycle that is *not* an agent —
  //   the clone (`workspace`). Nothing acted there, so it names nobody.
  // - the review pipeline runs a single agent, so its stage events name no
  //   stage at all; the one place it does write `stage: "reviewer"` it means
  //   its own Project Reviewer, a different actor from the cycle Reviewer of
  //   the implementation pipeline. The cost scan draws that same distinction
  //   from the transcript path (see the Publisher), and drawing it differently
  //   here would put the two halves of the page at odds over who spent what.
  //   Its lifecycle events (started, skipped, stood down) are the Script's,
  //   exactly as `cycle-start` and `selection` are on the other pipeline.
  // - `pr-ready` carries the actor as `handoff` — which of them took the pull
  //   request out of draft — where `script` means the pipeline completed a
  //   handoff its Reviewer left undone, so again no agent.
  // - `unblocked` names the Enabler in `by`. `by` on any other event is a
  //   *person* (who set the switch, who cleared the stand-down), never an
  //   agent, which is why this is read for that one event and not in general.
  // - the Enabler's own three events predate all of the above and carry none
  //   of them.
  //
  // Failing open like sourceTag() and the by-actor chart: a token this page
  // has never heard of renders as itself rather than as a dash, so an actor
  // added upstream shows up unlabelled instead of vanishing.
  var ENABLER_EVENT = { "escalated": 1, "enabler-examined": 1, "item-refined": 1 };
  function eventActor(e) {
    var ev = e.event || "";
    if (e.stage === "workspace") return null;
    if (ev.slice(0, 7) === "review-") {
      return (e.stage || ev === "review-stage-start" || ev === "review-stage-end")
        ? "project-reviewer" : null;
    }
    if (e.stage) return e.stage;
    if (ENABLER_EVENT[ev]) return "enabler";
    if (ev === "unblocked" && e.by) return e.by;
    if (ev === "pr-ready" && e.handoff && e.handoff !== "script") return e.handoff;
    return null;
  }
  // "Where" used to run the repo and the stage together in one cell,
  // unlabelled and each present only when the event carried it — so a
  // one-token cell could be either, and the node that ran it (the fleet's
  // first question) was not there at all. The three are different kinds of
  // answer, so they get one column each, with a dash for whatever the event
  // does not carry — the Repo cell is the repository whether or not the
  // other two are known.
  function logPanel() {
    var evs = D.log_tail || [];
    if (nodeFilter) evs = evs.filter(function (e) { return e.node === nodeFilter; });
    evs = evs.slice(0, 80);
    if (!evs.length) return el("div", {class:"panel"}, el("div", {class:"empty",
      text: nodeFilter ? "No log events from " + nodeFilter + "." : "No log events."}));
    var rows = evs.map(function (e) {
      var extra = e.reason || e.detail || e.cause || e.title || e.pr_url || e.resume_at || "";
      return el("tr", {}, [
        el("td", {class:"muted mono", text: fmtTime(e.ts)}),
        el("td", {}, el("span", {class:"badge " + (EVENT_CLASS[e.event]||"b-grey"), text: e.event})),
        el("td", {class:"mono muted", text: e.node || "—"}),
        el("td", {class:"mono muted", text: e.repo ? e.repo.split("/")[1] : "—"}),
        el("td", {class:"mono muted", text: eventActor(e) || "—"}),
        el("td", {class:"wrap muted", text: esc(extra)})
      ]);
    });
    return tableOf(["Time","Event","Node","Repo","Actor","Detail"], rows);
  }
  function cronPanel() {
    var lines = D.cron_tail || [];
    if (!lines.length) return el("div", {class:"panel"}, el("div", {class:"empty", text:"cron.log is empty or absent."}));
    return el("div", {class:"panel"}, el("pre", {class:"tx", "data-scroll-key":"cron", text: lines.join("\n")}));
  }

  // ---------- table helper ----------
  function tableOf(headers, rows) {
    var thead = el("thead", {}, el("tr", {}, headers.map(function (h){ return el("th", {text:h}); })));
    var tbody = el("tbody", {}, rows);
    return el("div", {class:"panel scroll"}, el("table", {}, [thead, tbody]));
  }

  // ---------- inner-scroll positions preserved across in-place re-renders ----------
  // `pre.tx` (stage transcripts, the cron.log tail) scrolls independently of
  // the page — it is a fixed-height box with its own `overflow: auto` — and
  // rebuilding #app destroys it along with its scrollTop. That is invisible on
  // a quiet page but exactly wrong on a busy one: it is the transcript of a
  // cycle still updating every few seconds that a reader is most likely to be
  // mid-scroll through when the next refresh lands. Every such element carries
  // a `data-scroll-key` stable across rebuilds (cycle/stage/kind, or "cron"),
  // captured here right before the old DOM goes and restored once the new DOM
  // exists — the same trick `renderBody` already plays with `window.scrollY`.
  //
  // Walked by hand via `.children` rather than `querySelectorAll`: the render
  // test harness's DOM stub (test/dashboard-render-harness.js) only builds
  // trees, and a manual walk is all this needs.
  function forEachScrollKeyEl(root, fn) {
    var kids = root.children || [];
    for (var i = 0; i < kids.length; i++) {
      var c = kids[i];
      if (c.getAttribute && c.getAttribute("data-scroll-key") != null) fn(c);
      forEachScrollKeyEl(c, fn);
    }
  }
  function captureScrollPositions() {
    var saved = Object.create(null);
    forEachScrollKeyEl(app, function (e) {
      if (e.scrollTop) saved[e.getAttribute("data-scroll-key")] = e.scrollTop;
    });
    return saved;
  }
  function restoreScrollPositions(saved) {
    forEachScrollKeyEl(app, function (e) {
      var v = saved[e.getAttribute("data-scroll-key")];
      if (v) e.scrollTop = v;
    });
  }

  // ---------- body render ----------
  // Rebuilds everything under <main> from the current D. Called on first paint
  // and whenever a refresh brings genuinely new data. Scroll position is saved
  // and restored around the swap: emptying #app collapses the page height and
  // the browser would otherwise clamp the scroll to the top on every refresh.
  function renderBody() {
    var y = window.scrollY;
    var savedScroll = captureScrollPositions();
    // The card is anchored to an element that is about to be destroyed, so it
    // is closed here and reopened against the rebuilt one at the foot of this
    // function — left as it was, it would hang over the page attached to
    // nothing. Whether it was peeked or pinned is carried across with it.
    var reopenPr = prAnchor ? prAnchor.getAttribute("data-pr-where") : null;
    var reopenPinned = prPinned;
    prCardHide();
    app.innerHTML = "";

    // ---------- banners ----------
    var banners = el("div");
    var st = D.status || {};
    // The switch first: when it is on, every other signal below ("no cycles",
    // "no PRs", "nothing selected") is a consequence of it rather than news, and
    // an operator who reads them in the wrong order goes looking for a fault
    // that isn't there.
    if (st.switch && st.switch.disabled) {
      var sw = st.switch;
      var detail = sw.reason ? ("“" + sw.reason + "”") : "no reason recorded";
      if (sw.by) detail += " — set by " + sw.by;
      if (sw.since) detail += " at " + sw.since;
      detail += sw.expires_at ? ("; expires " + sw.expires_at)
                              : "; no expiry — needs `agent-cycle.sh --enable`";
      banners.appendChild(el("div", {class:"banner amber"}, [
        el("span", {text: "⏸ Pipeline disabled — no cycles will start."}),
        el("span", {class:"sub", text: detail})
      ]));
    }
    // The fleet switch (2.3a) — suppressed when the local switch banner is
    // already up: the node that set it writes both levels, and two banners
    // saying one thing reads like two problems.
    var ff = fleetFlags();
    if (ff.disabled && !(st.switch && st.switch.disabled)) {
      var fdetail = ff.disabled.reason ? ("“" + ff.disabled.reason + "”") : "no reason recorded";
      if (ff.disabled.by) fdetail += " — set by " + ff.disabled.by;
      fdetail += ff.disabled.expires_at ? ("; expires " + ff.disabled.expires_at)
                                        : "; no expiry — needs `agent-cycle.sh --enable`";
      banners.appendChild(el("div", {class:"banner amber"}, [
        el("span", {text: "⏸ Fleet switch is set — every node stands down."}),
        el("span", {class:"sub", text: fdetail})
      ]));
    }
    if (st.limit && st.limit.active) {
      banners.appendChild(el("div", {class:"banner amber"}, [
        el("span", {text: "⏸ Usage limit reached."}),
        el("span", {class:"sub", text: st.limit.note ? ("Pipeline stands down — " + st.limit.note + ".") : "Pipeline stands down until the limit resets."})
      ]));
    } else if (ff.limit && ff.limit.resume_at && parseTs(ff.limit.resume_at) && parseTs(ff.limit.resume_at) > new Date()) {
      // The fleet limit flag (2.1) matters here exactly when the local log
      // union hasn't caught up — a standby with no state yet, or a hit
      // seconds old on another node.
      //
      // `reset_known` distinguishes a reset time the provider stated from the
      // retry interval this system invented when it wasn't given one; older
      // flags carry the superseded `needs_human`, whose sense is inverted.
      // Saying "until <t>" of an invented time is the misreport this banner
      // exists to avoid — a stand-down that reads like a deadline gets waited
      // out instead of questioned.
      var resetKnown = ff.limit.reset_known !== undefined ? !!ff.limit.reset_known
                     : ff.limit.needs_human !== undefined ? !ff.limit.needs_human
                     : true;
      var by = " — published by " + (ff.limit.node || "?") + ".";
      var lsub = resetKnown
        ? "Until " + ff.limit.resume_at + by
        : "Retrying after " + ff.limit.resume_at + " (estimated — no reset time was given)" + by +
          (ff.limit.class === "weekly" || ff.limit.class === "monthly"
            ? " It clears at the plan's rollover, or sooner if you raise the cap and run `agent-cycle.sh --clear-limit`."
            : "");
      banners.appendChild(el("div", {class:"banner amber"}, [
        el("span", {text: "⏸ Fleet-wide usage-limit stand-down."}),
        el("span", {class:"sub", text: lsub})
      ]));
    }
    var staleNodes = fleetNodes().filter(function (n) { return n.stale; });
    if (staleNodes.length) {
      banners.appendChild(el("div", {class:"banner amber"}, [
        el("span", {text: "⚠ Peer state is stale."}),
        el("span", {class:"sub", text: staleNodes.map(function (n) { return n.node; }).join(", ") +
          " last pushed more than 30 minutes ago — the fleet view may lag; check state-sync on those nodes."})
      ]));
    }
    var openPrs = (D.github && D.github.prs) || [];
    var failedChecks = openPrs.filter(function (p){ return p.checks && p.checks.failed > 0; });
    if (failedChecks.length) {
      banners.appendChild(el("div", {class:"banner red"}, [
        el("span", {text: "✗ " + failedChecks.length + " open agent PR(s) with failing checks."}),
        el("span", {class:"sub", text: "See Open pull requests below."})
      ]));
    }
    if (D.github && D.github.ok === false) {
      banners.appendChild(el("div", {class:"banner amber"}, [
        el("span", {text: "GitHub data unavailable."}),
        el("span", {class:"sub", text: (D.github.error || "gh could not be reached") + " — showing last local state only."})
      ]));
    }
    // A fetch that stopped happening, as distinct from one that ran and failed
    // (the banner above). Nothing else on the page distinguishes them: both
    // leave the PR list rendering perfectly, one from data of a plausible age
    // and the other from data of any age at all.
    var ghAgeBanner = githubAgeMin();
    if (ghAgeBanner != null && ghAgeBanner > GH_STALE_MIN) {
      banners.appendChild(el("div", {class:"banner amber"}, [
        el("span", {text: "⚠ GitHub data is " + fmtAgo(D.github.fetched_at).replace(/ ago$/, "") + " old."}),
        el("span", {class:"sub", text: "PRs, checks, issues, work sources and claims below were fetched at " +
          fmtTime(D.github.fetched_at) + "; the heartbeat refreshes them every 5 minutes. Check that " +
          "publish-dashboard-launcher.sh is running (grep 'github: refreshing' in dashboard.log)."})
      ]));
    }
    app.appendChild(banners);

    // ---------- fleet strip ----------
    if (fleetVisible()) app.appendChild(sectionOf("Fleet", fleetStrip()));

    // ---------- metric cards ----------
    var c = D.counts || {};
    var cards = el("div", {class:"cards"});
    function card(k, v, sub) {
      cards.appendChild(el("div", {class:"card"}, [
        el("div", {class:"k"}, [ typeof k === "string" ? document.createTextNode(k) : k ]),
        el("div", {class:"v"}, [ typeof v === "string" ? document.createTextNode(v) : v,
          sub ? el("small", {text: " " + sub}) : null ])
      ]));
    }
    // The word "today" is itself the control (#186): click it to cycle
    // "today (GMT)" -> "today (local)" -> "last 24h" -> "today (GMT)" ...,
    // recomputing the figure beside it from `c` each time rather than waiting
    // for the next refresh, so the click feels immediate.
    var spendBtn = el("button", {class:"spendmode", type:"button", text: spendModeLabel(spendMode),
      title: "Click to cycle: today (GMT) → today (local) → last 24h",
      onclick: function () {
        spendMode = SPEND_MODES[(SPEND_MODES.indexOf(spendMode) + 1) % SPEND_MODES.length];
        saveSpendMode(spendMode);
        renderBody();
      }});
    card(el("span", {}, [document.createTextNode("Est. token cost "), spendBtn]), usd(spendForMode(spendMode, c)));
    card("Est. token cost (" + (c.by_day ? c.by_day.length : 0) + "d)", usd(c.spend_total_usd));
    card("Failures", String(c.failures_shown || 0), "of " + (c.cycles_shown||0) + " cycles");
    card("Reached ready", String(c.prs_reached_ready || 0));
    // back-pressure card — the pipeline itself only trips its cap on draft
    // PRs and ready PRs still CHANGES_REQUESTED (agent-ops#246); a ready PR
    // approved or awaiting a human review sits in a queue the pipeline
    // cannot shrink by waiting, so it is shown as its own figure rather than
    // folded into "open" as if the pipeline were idle.
    var rawN = openPrs.length, maxN = D.max_open_agent_prs || 0;
    var humanQueueN = openPrs.filter(function (p) {
      return !p.isDraft && p.review_decision !== "CHANGES_REQUESTED";
    }).length;
    var adjN = rawN - humanQueueN;
    var gauge = el("div", {class:"gauge"}, el("span", {
      style: "width:" + (maxN ? Math.min(100, adjN/maxN*100) : 0) + "%;background:" + (adjN>=maxN && maxN ? "var(--red)" : "var(--accent)")
    }));
    cards.appendChild(el("div", {class:"card"}, [
      el("div", {class:"k", text:"Open agent PRs"}),
      el("div", {class:"v"}, [document.createTextNode(adjN + " "), el("small", {text:"/ " + maxN + " max"})]),
      gauge,
      el("small", {class:"muted", text: rawN + " open" +
        (humanQueueN ? ", " + humanQueueN + " waiting on human" : "")})
    ]));
    app.appendChild(cards);

    // ---------- open PRs ----------
    app.appendChild(sectionOf("Open pull requests", prsPanel(openPrs)));

    // ---------- live claims ----------
    if (fleetVisible()) app.appendChild(sectionOf("Live claims", claimsPanel()));

    // ---------- cycle history ----------
    app.appendChild(sectionOf(nodeFilter ? "Recent cycles — " + nodeFilter + " only (click its card to clear)" : "Recent cycles",
      cyclesPanel(D.cycles || [])));

    // ---------- failures & blocked ----------
    app.appendChild(sectionOf("Failures, blocked & void items", failuresPanel()));

    // ---------- inputs ----------
    app.appendChild(sectionOf("Work sources (what the Co-Ordinator sees)", inputsPanel()));

    // ---------- cost & cadence + log ----------
    // By day on the left, and the two short cuts stacked on the right: the
    // day chart runs to sixty rows and wants the width for its bars, while
    // by-model and by-actor are a handful of rows each.
    var two = el("div", {class:"two"});
    two.appendChild(el("div", {}, [ el("h2", {text:"Est. token cost by day"}), el("div", {class:"panel", style:"padding:14px"}, spendByDay()) ]));
    two.appendChild(el("div", {class:"stack"}, [
      el("div", {}, [ el("h2", {text:"Est. token cost by model"}), el("div", {class:"panel", style:"padding:14px"}, spendByModel()) ]),
      el("div", {}, [ el("h2", {text:"Est. token cost by actor"}), el("div", {class:"panel", style:"padding:14px"}, spendByActor()) ])
    ]));
    app.appendChild(el("section", {}, two));
    app.appendChild(el("p", {class:"costnote", text:
      "Cost figures are Claude Code's own local estimate, priced as if these tokens " +
      "had been billed per-token through the API. On a Claude subscription they are " +
      "not money charged and not a draw against the session or weekly limit — read " +
      "them as a measure of how much work the pipeline did, not what it cost. Plan " +
      "limits are not readable from here; check /usage in an interactive session. " +
      "All three charts cover the same transcripts — every actor of both pipelines, " +
      "across every node, since one Claude account pays for the fleet."}));

    app.appendChild(sectionOf(nodeFilter ? "Recent log events — " + nodeFilter + " only (click its card to clear)" : "Recent log events",
      logPanel()));
    app.appendChild(sectionOf("cron.log (tail)", cronPanel()));

    window.scrollTo(0, y);
    restoreScrollPositions(savedScroll);
    prCardReanchor(reopenPr, reopenPinned);
  }

  // The header of a single-node page: this node's live state in full, off its
  // own lock. With no fleet strip to carry it, the header is the only place the
  // answer can go — and a one-node page renders exactly as it always did.
  function localHeader(live, st) {
    if (st.running && st.lock) {
      live.appendChild(el("span", {}, [ el("span",{class:"dot live"}), "running" ]));
      // A one-node page has no card to carry this, and it is the page most
      // likely to need it: nothing else here would ever contradict the lock.
      var over = stageOverrun((st.current || {}).stage, (st.current || {}).stage_since, D.generated_at);
      if (over) live.appendChild(el("span", {class:"badge b-amber", style:"margin-left:6px",
                                            title: over, text:"may be dead"}));
      var what = workDetail(st.current);
      if (what) { live.appendChild(el("span", {class:"muted", text:" · "})); live.appendChild(what); }
      live.appendChild(el("span", {class:"muted", text: " · since " + fmtTime(st.lock.started_at) + " (" + fmtAgo(st.lock.started_at) + ")"}));
    } else {
      live.appendChild(el("span", {}, [ el("span",{class:"dot idle"}), "idle" ]));
      if (st.last_cycle) live.appendChild(el("span", {class:"muted", text: " · last cycle " + fmtAgo(st.last_cycle.ended_at) }));
    }
  }

  // The header of a fleet page: how much of the fleet is working, not what any
  // one node is working on. Naming a single item up here would mean picking one
  // node's work to stand for every node's, which is exactly the reading that
  // stopped being true when the second container came up; the per-node answers
  // are on the cards a scroll below.
  function fleetHeader(live) {
    var nodes = fleetNodes();
    var running = nodes.filter(nodeRunning);
    var stale = nodes.filter(function (n) { return n.stale; });
    var doubted = nodes.filter(function (n) { return !!livenessDoubt(n); });
    live.appendChild(el("span", {title:"per-node state is on the fleet cards below"}, [
      el("span", {class:"dot " + (running.length ? "live" : "idle")}),
      running.length ? running.length + " of " + nodes.length + " nodes running"
                     : (nodes.length === 1 ? "idle" : "all " + nodes.length + " nodes idle")
    ]));
    // Who and on what, but only while that still fits in a header — past a few
    // nodes the list stops being a glance and the cards are the place to look.
    if (running.length && running.length <= 3) {
      live.appendChild(el("span", {class:"muted", title: running.map(function (n) { return n.node; }).join(", "),
        text: " · " + running.map(function (n) {
          var w = n.live || {};
          return n.node + (w.repo ? " → " + w.repo.split("/")[1] : (w.stage ? " → " + w.stage : ""));
        }).join(", ")}));
    } else if (!running.length && (D.status || {}).last_cycle) {
      live.appendChild(el("span", {class:"muted", text: " · last cycle " + fmtAgo(D.status.last_cycle.ended_at) +
        " on " + (D.status.last_cycle.node || "?")}));
    }
    if (doubted.length) live.appendChild(el("span", {class:"badge b-amber", style:"margin-left:8px",
      title: doubted.map(function (n) { return n.node + ": " + livenessDoubt(n); }).join("; "),
      text: doubted.length + " may be dead"}));
    if (stale.length) live.appendChild(el("span", {class:"badge b-red", style:"margin-left:8px",
      title: stale.map(function (n) { return n.node; }).join(", ") + " last pushed more than 30 minutes ago",
      text: stale.length + " stale"}));
  }

  // ---------- header live state + freshness ----------
  // Cheap; rebuilt on every tick (even when the body is unchanged) so the "data
  // Ns ago" clock and the running/idle dot stay live. The fleet strip is rebuilt
  // on the same tick for the same reason: its cards carry "since 18m ago"
  // clocks, and the body around them only re-renders when the data changes.
  function renderHeaderStatus() {
    var st = D.status || {};
    // Which node's publisher produced this page — every node renders the same
    // fleet, so this is what tells two otherwise identical tabs apart.
    document.getElementById("nodename").textContent = D.node ? "· " + D.node : "";
    var live = document.getElementById("livestate");
    live.innerHTML = "";
    if (fleetVisible()) fleetHeader(live); else localHeader(live, st);
    var strip = document.getElementById("fleetstrip");
    if (strip && strip.parentNode) strip.parentNode.replaceChild(fleetStrip(), strip);
    var fresh = document.getElementById("freshness");
    var gen = parseTs(D.generated_at);
    var ageMin = gen ? (Date.now() - gen.getTime())/60000 : 999;
    fresh.style.color = "";
    fresh.textContent = "data " + fmtAgo(D.generated_at);
    if (ageMin > 12) { fresh.style.color = "var(--amber)"; fresh.textContent += " ⚠ (heartbeat may be stopped)"; }
    var ghFresh = document.getElementById("ghfreshness");
    var ghAge = githubAgeMin();
    ghFresh.style.color = "";
    if (ghAge == null) {
      // Either the page has never had a GitHub fetch, or this publish was
      // --no-github with nothing cached behind it. Not an alarm.
      ghFresh.textContent = "· GitHub —";
    } else {
      ghFresh.textContent = "· GitHub " + fmtAgo(D.github.fetched_at);
      if (ghAge > GH_STALE_MIN) ghFresh.style.color = "var(--amber)";
    }
  }

  // ---------- SPA refresh ----------
  // Re-fetch data.js in place rather than reloading the page. A fresh <script>
  // element is injected (not fetch()) so this keeps working from a file:// URL
  // with no server and no CORS; a cache-busting query defeats HTTP caching so
  // each tick sees what the Publisher just wrote.
  function loadData(cb) {
    var s = document.createElement("script");
    s.src = "data.js?_=" + Date.now();
    s.onload = function () { if (s.parentNode) s.parentNode.removeChild(s); cb(window.DASHBOARD_DATA); };
    s.onerror = function () { if (s.parentNode) s.parentNode.removeChild(s); cb(null); };
    document.head.appendChild(s);
  }

  // Signature of everything except generated_at (which changes every publish
  // even when nothing else did). Lets us skip the body rebuild — and so keep
  // text selection, hovers and inner scroll intact — when the data is identical.
  function signature(d) {
    var clone = {};
    for (var k in d) if (k !== "generated_at") clone[k] = d[k];
    return JSON.stringify(clone);
  }

  var lastSig = null;
  function applyData(nd) {
    D = nd;
    var sig = signature(nd);
    if (sig === lastSig) return;   // nothing meaningful changed — leave the body as is
    lastSig = sig;
    renderBody();
  }

  var loading = false;
  function tick() {
    if (loading) return;           // don't stack fetches if one is slow
    loading = true;
    loadData(function (nd) {
      loading = false;
      if (nd) applyData(nd);
      renderHeaderStatus();        // tick the clock even when the body didn't change
    });
  }

  // ---------- refresh scheduling ----------
  // Interval is configurable via config.json's dashboard_refresh_seconds
  // (default 5s), matching the cadence publish-dashboard-launcher.sh writes at.
  var refreshMs = Math.max(1, (D.config && +D.config.dashboard_refresh_seconds) || 5) * 1000;
  var timer = null;
  function schedule() {
    if (timer) { clearInterval(timer); timer = null; }
    if (document.getElementById("autorefresh").checked) timer = setInterval(tick, refreshMs);
  }
  document.getElementById("autorefresh").addEventListener("change", schedule);
  document.getElementById("refreshbtn").addEventListener("click", tick);

  // ---------- first paint ----------
  renderBody();
  renderHeaderStatus();
  lastSig = signature(D);
  schedule();
})();
</script>
</body>
</html>
