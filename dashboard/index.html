<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Pipeline Dashboard</title>
<!-- Generated data lives in a sibling file the Publisher rewrites each run.
     A plain script tag (not a module) is used so this works from a file:// URL
     with no server. The page then refreshes itself in place (see the SPA
     loader at the foot of the script) by re-fetching this same file — it never
     does a full navigation, so expanded rows and scroll position survive. -->
<script src="data.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2024; --muted: #656d76;
    --line: #e2e5e9; --accent: #2b6cb0;
    --green: #1a7f37; --green-bg: #dafbe1; --red: #b42318; --red-bg: #ffe3e0;
    --amber: #9a6700; --amber-bg: #fff4d6; --blue: #0a5cc2; --blue-bg: #ddf0ff;
    --grey: #57606a; --grey-bg: #eef1f4;
    --purple: #6b40c4; --purple-bg: #f1ebfd; --teal: #0f766e; --pink: #b8266e;
    --shadow: 0 8px 24px rgba(16, 22, 30, .16);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #161b22; --ink: #e6edf3; --muted: #8b949e;
      --line: #2a2f37; --accent: #58a6ff;
      --green: #3fb950; --green-bg: #12261a; --red: #f85149; --red-bg: #2a1213;
      --amber: #d29922; --amber-bg: #2b2211; --blue: #58a6ff; --blue-bg: #0d2436;
      --grey: #8b949e; --grey-bg: #1b2027;
      --purple: #a78bfa; --purple-bg: #1e1633; --teal: #2dd4bf; --pink: #f472b6;
      --shadow: 0 8px 24px rgba(0, 0, 0, .55);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
         font-size: 14px; line-height: 1.5; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header.top { padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; position: sticky; top: 0; z-index: 5; }
  header.top h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  .grow { flex: 1 1 auto; }
  .freshness { font-size: 12px; color: var(--muted); }
  .docs { font-size: 12px; color: var(--muted); }
  .docs a { margin: 0 3px; }
  .controls { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
  .controls label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  button.refresh { font: inherit; font-size: 12px; padding: 4px 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); border-radius: 6px; cursor: pointer; }
  button.refresh:hover { border-color: var(--accent); }
  main { max-width: 1200px; margin: 0 auto; padding: 18px 20px 60px; }
  .banner { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-weight: 550;
    display: flex; gap: 10px; align-items: baseline; }
  .banner .sub { font-weight: 400; color: var(--muted); }
  .banner.amber { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber); }
  .banner.green { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
  .banner.red { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 22px; }
  /* The fleet cards carry a whole live-state readout each — stage, repo, work
     source and item — so they get a wider track than the metric cards do. */
  .cards.fleet { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .card .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .card .k button.spendmode { font: inherit; text-transform: inherit; letter-spacing: inherit;
    border: 0; background: none; padding: 0; margin: 0; color: var(--accent); cursor: pointer;
    text-decoration: underline dotted; text-underline-offset: 2px; }
  .card .k button.spendmode:hover { text-decoration-style: solid; }
  .card .k button.spendmode:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card .v { font-size: 22px; font-weight: 650; margin-top: 2px; }
  .card .v small { font-size: 13px; font-weight: 500; color: var(--muted); }
  .card.clickable { cursor: pointer; }
  .card.nodestale { border-color: var(--red); }
  .card.nodeselected { outline: 2px solid var(--accent); }
  .card .state { font-size: 14px; font-weight: 650; margin-top: 4px; }
  .card .work { font-size: 12.5px; margin-top: 4px; white-space: normal; word-break: break-word; }
  .card .when { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .card .hb { font-size: 11.5px; color: var(--muted); margin-top: 6px;
    border-top: 1px solid var(--line); padding-top: 5px; }
  .card .hb.stale { color: var(--red); }
  /* The code a node is running. It sits above the heartbeat line and below the
     border, with identity rather than with activity: what a node *is* running
     is a property of the node, not of the cycle in flight. */
  .card .ver { font-size: 11.5px; color: var(--muted); margin-top: 6px;
    border-top: 1px solid var(--line); padding-top: 5px;
    display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
  .card .ver + .hb { border-top: 0; margin-top: 1px; padding-top: 0; }
  section { margin-bottom: 26px; }
  section > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted);
    margin: 0 0 10px; font-weight: 600; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: 600; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover { background: var(--grey-bg); }
  td.wrap { white-space: normal; max-width: 420px; }
  td.wrap.roomy { max-width: none; width: 100%; }
  /* A cell capped at three lines, in a table whose rows open to their full
     text on click (the void list). The cap sits on an inner block because the
     clamp needs `display: -webkit-box`, and a `td` given that stops being a
     table cell. The ellipsis it draws is the affordance: a row with nothing
     hidden shows none, so the cue appears on exactly the rows that have more. */
  td.wrap .clip { display: -webkit-box; -webkit-box-orient: vertical;
    -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
  /* The see-more control belongs to the table it uncovers, so it is that
     table's last row rather than a button beside it — full width, inside the
     panel border, reading as the continuation of the list. */
  td.morecell { padding: 0; }
  button.more { font: inherit; font-size: 12px; width: 100%; padding: 8px 12px; border: 0;
    background: none; color: var(--accent); cursor: pointer; text-align: center; }
  button.more:hover { background: var(--grey-bg); }
  button.more:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  td.stages { white-space: normal; max-width: 132px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
    border: 1px solid transparent; }
  .b-green { background: var(--green-bg); color: var(--green); }
  .b-red { background: var(--red-bg); color: var(--red); }
  .b-blue { background: var(--blue-bg); color: var(--blue); }
  .b-amber { background: var(--amber-bg); color: var(--amber); }
  .b-grey { background: var(--grey-bg); color: var(--grey); }
  .b-purple { background: var(--purple-bg); color: var(--purple); }
  /* Source tags are deliberately a different shape and weight from outcome
     badges above: outlined and square-cornered rather than filled pills, so
     the two classes of data never read as the same kind of label. */
  .srctag { display: inline-block; padding: 0 6px; border-radius: 4px; font-family: var(--mono);
    font-size: 10.5px; font-weight: 500; letter-spacing: .2px; line-height: 17px;
    border: 1px solid currentColor; background: transparent; }
  .s-red { color: var(--red); } .s-amber { color: var(--amber); } .s-blue { color: var(--blue); }
  .s-green { color: var(--green); } .s-grey { color: var(--grey); } .s-purple { color: var(--purple); }
  .s-teal { color: var(--teal); } .s-pink { color: var(--pink); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  /* Inside a pill the dot is set to the pill's scale, so an in-flight badge in
     a table cell reads as one label rather than a dot with a word after it. */
  .badge .dot { width: 6px; height: 6px; margin-right: 4px; }
  .dot.live { background: var(--green); box-shadow: 0 0 0 0 rgba(63,185,80,.6); animation: pulse 1.8s infinite; }
  .dot.idle { background: var(--grey); }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(63,185,80,.5)} 70%{box-shadow:0 0 0 6px rgba(63,185,80,0)} 100%{box-shadow:0 0 0 0 rgba(63,185,80,0)} }
  .mono { font-family: var(--mono); font-size: 12px; }
  .muted { color: var(--muted); }
  .stagecells { display: flex; flex-wrap: wrap; gap: 4px; }
  .stagecell { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); }
  .sc-ok { color: var(--green); } .sc-fail { color: var(--red); } .sc-none { color: var(--muted); opacity: .6; }
  .detail { background: var(--bg); }
  .detail td { padding: 0; border-bottom: 1px solid var(--line); }
  .detailwrap { padding: 14px 16px; }
  .stagebox { border: 1px solid var(--line); border-radius: 8px; margin: 10px 0; background: var(--panel); }
  .stagebox > .head { padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
    border-bottom: 1px solid var(--line); font-size: 12px; }
  .stagebox > .head .name { font-weight: 650; text-transform: capitalize; }
  .kv { color: var(--muted); } .kv b { color: var(--ink); font-weight: 600; }
  pre.tx { margin: 0; padding: 10px 12px; font-family: var(--mono); font-size: 12px; line-height: 1.45;
    white-space: pre-wrap; word-break: break-word; max-height: 340px; overflow: auto; background: var(--panel); }
  pre.err { color: var(--red); border-top: 1px dashed var(--line); }
  details.tx > summary { cursor: pointer; padding: 6px 12px; font-size: 12px; color: var(--muted); user-select: none; }
  .bars { display: flex; flex-direction: column; gap: 6px; }
  .bar { display: grid; grid-template-columns: 88px 1fr 92px; align-items: center; gap: 10px; font-size: 12px; }
  /* Actor names run longer than model names ("project-reviewer" against
     "sonnet-5"), so that chart's rows get a wider name track rather than an
     abbreviation nobody would recognise. */
  .bars.wide .bar { grid-template-columns: 112px 1fr 92px; }
  .bar .track { background: var(--grey-bg); border-radius: 5px; height: 16px; overflow: hidden; }
  .bar .fill { background: var(--accent); height: 100%; border-radius: 0 4px 4px 0; }
  .gauge { height: 10px; border-radius: 5px; background: var(--grey-bg); overflow: hidden; margin-top: 6px; }
  .gauge > span { display: block; height: 100%; }
  .empty { padding: 18px; color: var(--muted); font-style: italic; }
  /* The bottom margin is not decoration: this paragraph sits between two
     sections and would otherwise butt straight into the next one's heading. */
  p.costnote { margin: 10px 0 26px; font-size: 12px; color: var(--muted); max-width: 78ch; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
  /* Two short charts sharing a column beside one tall one: by-day runs to
     sixty rows and needs the width for its bars, while by-model and by-actor
     are five rows each and would each waste half a page on their own row. */
  .stack { display: flex; flex-direction: column; gap: 20px; align-content: start; }
  code.inline { font-family: var(--mono); background: var(--grey-bg); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  /* ---------- pull-request references ---------- */
  /* A dotted underline is the affordance, not a colour: the page already
     spends colour on outcome and source, and a reader who cannot separate
     hues still needs to know which numbers carry a record. It goes solid on
     hover and focus, so the cue and the link state stay distinguishable. */
  a.prref { border-bottom: 1px dotted currentColor; text-decoration: none; white-space: nowrap;
    font-variant-numeric: tabular-nums; }
  a.prref:hover, a.prref:focus { text-decoration: none; border-bottom-style: solid; }
  a.prref:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  #prcard { position: absolute; z-index: 50; width: 340px; max-width: calc(100vw - 24px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); padding: 11px 13px; font-size: 12.5px; line-height: 1.45;
    display: none; }
  #prcard.open { display: block; }
  #prcard .prhead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  #prcard .prtitle { font-weight: 600; margin-bottom: 8px; word-break: break-word; }
  #prcard dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; }
  #prcard dt { color: var(--muted); }
  #prcard dd { margin: 0; word-break: break-word; }
  /* Filled, rounded and uncoloured: a third shape, so a GitHub label cannot be
     misread as an outcome badge (filled pill, coloured) or a work-source tag
     (outlined square). Colour on this page carries identity within a class of
     data; shape carries the class. */
  #prcard .prlabels { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  #prcard .prlabels span { font-family: var(--mono); font-size: 10.5px; line-height: 17px;
    padding: 0 7px; border-radius: 999px; background: var(--grey-bg); color: var(--muted); }
  #prcard .prfoot { margin-top: 9px; padding-top: 7px; border-top: 1px solid var(--line); }
  #prcard .prnone { color: var(--muted); font-style: italic; }
  /* Only a pinned card carries a close button. A peeked card is dismissed by
     moving the pointer away, and a control you cannot reach without moving the
     pointer *into* the card would be decoration. A pinned one has no such exit:
     on a phone "tap the blank page behind it" is not an affordance, and the
     number that opened it is under the reader's own thumb. */
  #prcard .prclose { display: none; }
  #prcard.pinned .prclose { display: block; margin: -3px -4px 0 auto; align-self: flex-start;
    width: 24px; height: 24px; padding: 0; border: 0; border-radius: 6px;
    background: none; cursor: pointer; color: var(--muted); font: 15px/1 var(--sans); }
  #prcard.pinned .prclose:hover { background: var(--grey-bg); color: var(--ink); }
  #prcard.pinned .prclose:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
</style>
</head>
<body>
<header class="top">
  <h1 id="title">Agent Pipeline Dashboard</h1>
  <span class="mono muted" id="nodename" title="the node whose publisher rendered this page"></span>
  <span id="livestate"></span>
  <span class="grow"></span>
  <span class="freshness" id="freshness"></span>
  <span class="freshness" id="ghfreshness" title="when the GitHub-sourced panels — PRs, checks, issues, work sources, claims — were last fetched"></span>
  <nav class="docs" aria-label="Documentation">Docs:
    <a href="https://github.com/Poetic-Poems/agent-ops/blob/main/README.md" target="_blank" rel="noopener noreferrer">README</a> ·
    <a href="https://github.com/Poetic-Poems/agent-ops/blob/main/docs/IMPLEMENTATION-PIPELINE-SPEC.md" target="_blank" rel="noopener noreferrer">Pipeline spec</a> ·
    <a href="https://github.com/Poetic-Poems/agent-ops/blob/main/docs/REVIEW-PIPELINE-SPEC.md" target="_blank" rel="noopener noreferrer">Review spec</a> ·
    <a href="https://github.com/Poetic-Poems/agent-ops/blob/main/docs/DASHBOARD-SPEC.md" target="_blank" rel="noopener noreferrer">Dashboard spec</a> ·
    <a href="https://github.com/Poetic-Poems/agent-ops/blob/main/docs/METERING-SCHEMA.md" target="_blank" rel="noopener noreferrer">Metering</a> ·
    <a href="https://github.com/Poetic-Poems/agent-ops/blob/main/docs/ROADMAP.md" target="_blank" rel="noopener noreferrer">Roadmap</a>
  </nav>
  <div class="controls">
    <label><input type="checkbox" id="autorefresh" checked> auto-refresh</label>
    <button class="refresh" id="refreshbtn">Refresh now</button>
  </div>
</header>
<main id="app"></main>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var D = window.DASHBOARD_DATA;

  if (!D) {
    app.innerHTML = '<div class="banner amber">No data yet — run <code class="inline">scripts/publish-dashboard.sh</code> to generate the dashboard.</div>';
    return;
  }

  // ---------- helpers ----------
  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    }
    if (children) (Array.isArray(children) ? children : [children]).forEach(function (c) {
      if (c == null) return;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return e;
  }
  function parseTs(s) { if (!s) return null; var d = new Date(s); return isNaN(d) ? null : d; }
  function fmtTime(s) { var d = parseTs(s); return d ? d.toLocaleString(undefined, {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"}) : "—"; }
  function fmtAgo(s) {
    var d = parseTs(s); if (!d) return "—";
    var sec = Math.max(0, (Date.now() - d.getTime())/1000);
    if (sec < 90) return Math.round(sec) + "s ago";
    if (sec < 5400) return Math.round(sec/60) + "m ago";
    if (sec < 172800) return Math.round(sec/3600) + "h ago";
    return Math.round(sec/86400) + "d ago";
  }
  function fmtDur(ms) {
    if (ms == null) return "—";
    var s = ms/1000;
    if (s < 60) return s.toFixed(1) + "s";
    return Math.floor(s/60) + "m" + String(Math.round(s%60)).padStart(2,"0") + "s";
  }
  function usd(n) { return n == null ? "—" : "$" + Number(n).toFixed(Number(n) < 1 ? 4 : 2); }
  function esc(s) { return String(s == null ? "" : s); }

  // ---------- spend-mode: which "today" the token-cost card shows (#186) ----
  // `spend_today_usd` is always the Publisher's own GMT calendar day — correct
  // but silently GMT, which is exactly what #186 asked to make visible. The
  // other two readings can only be computed here, against the reader's own
  // clock: `recent_costs` (three days of {ts, cost} rows, UTC instants) is
  // what the Publisher ships for that purpose alongside the coarser day-level
  // aggregates the charts already use.
  var SPEND_MODES = ["gmt", "local", "24h"];
  function spendModeLabel(mode) {
    return mode === "local" ? "today (local)" : mode === "24h" ? "last 24h" : "today (GMT)";
  }
  function spendForMode(mode, c) {
    if (mode === "gmt") return c.spend_today_usd || 0;
    var rows = c.recent_costs || [];
    var now = new Date();
    if (mode === "24h") {
      var cutoff = now.getTime() - 24 * 60 * 60 * 1000;
      return rows.reduce(function (sum, r) {
        var t = r.ts ? new Date(r.ts).getTime() : NaN;
        return !isNaN(t) && t >= cutoff ? sum + (r.cost || 0) : sum;
      }, 0);
    }
    return rows.reduce(function (sum, r) {
      var d = r.ts ? new Date(r.ts) : null;
      if (!d || isNaN(d)) return sum;
      return (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate())
        ? sum + (r.cost || 0) : sum;
    }, 0);
  }

  // ---------- how old the GitHub half of the page is ----------
  // Every GitHub-sourced panel — PRs, checks, issues, work sources, claims —
  // is exactly as old as the last real fetch, however recent `generated_at`
  // is: a --no-github tick republishes local state every few seconds and
  // carries the last fetch forward unchanged. That design is what stops the
  // PR list flickering empty sixty times a minute, but it also means a
  // heartbeat whose GitHub refresh has stalled looks identical to a healthy
  // one. It looked identical for as long as the old launcher gate was
  // deployed, so the two clocks are now shown separately.
  var GH_STALE_MIN = 12;   // two missed refreshes, matching the local heartbeat's own bound
  function githubAgeMin() {
    var t = parseTs(D.github && D.github.fetched_at);
    return t ? (Date.now() - t.getTime())/60000 : null;
  }

  var OUTCOME = {
    "pr-ready":     ["Ready for review", "b-green"],
    "pr-raised":    ["PR raised", "b-blue"],
    "selected":     ["Selected", "b-blue"],
    "none-selected":["Nothing selected", "b-grey"],
    "stand-down":   ["Stood down", "b-grey"],
    "skipped":      ["Skipped (locked)", "b-grey"],
    "failed":       ["Failed", "b-red"],
    "ended":        ["Ended", "b-grey"]
  };
  function outcomeBadge(o) {
    var m = OUTCOME[o] || [o, "b-grey"];
    return el("span", {class: "badge " + m[1], text: m[0]});
  }

  // The Co-Ordinator's work sources, in its own priority order. Labels are
  // abbreviated to keep the column narrow; the full token is in the tooltip.
  var SOURCE = {
    "security":            ["security",    "s-red"],
    "review-feedback":     ["pr-feedback", "s-purple"],
    "merge-conflicts":     ["conflict",    "s-purple"],
    "abandoned-drafts":    ["abandoned",   "s-purple"],
    "failed-runs":         ["failed-run",  "s-amber"],
    "tech-debt":           ["tech-debt",   "s-blue"],
    "issues":              ["issue",       "s-green"],
    "implementation-plan": ["plan",        "s-teal"],
    "project-review":      ["proj-review", "s-pink"],
    "code-quality":        ["quality",     "s-grey"],
