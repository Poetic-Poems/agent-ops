name: Closing keyword check

# Gates requirement 25a: an agent PR that names an issue it closes
# (`<!-- agent-ops:closes-issue item=N -->`, stamped by the Implementor,
# `prompts/implementor.md`) must also carry a real GitHub closing keyword for
# that same issue, so the issue actually closes when the PR merges. Prompt
# instruction alone was already asked for this and silently skipped (PR #206
# said "Implements #198" instead of "Closes #198", and #198 stayed open for
# three days after its own fix merged) — see issue #240.
#
# The head branch is the check's second anchor, and the one that makes it
# presence-enforcing rather than consistency-only: the Script mints
# `agent/<N>` (a bare issue number) for issue-sourced work orders and for
# nothing else, so a PR from such a branch must carry both the marker and the
# keyword for `N` — an Implementor that forgets the marker goes red instead
# of passing trivially. A PR without the marker on any other branch —
# everything that is not issue-sourced — passes.
#
# Deliberately `pull_request` (not `pull_request_target`), so a fork PR never
# runs with write-scoped secrets, and ungated by `paths:` — the body can be
# edited without touching any file.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  closing-keyword:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check closing keyword
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_BRANCH: ${{ github.head_ref }}
        run: scripts/check-closing-keyword.sh "$PR_BODY" "$PR_HEAD_BRANCH"
