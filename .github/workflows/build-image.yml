name: Build the node image

# The image is the deployment artefact: /app inside it *is* agent-ops, and a
# node updates by pulling a new image rather than by pulling a branch. So this
# workflow is what turns a merge into a deployment — build, prove the image
# works, and publish it to GHCR, where every node's watchtower is watching.
#
# On a pull request it stops at "prove it works": no login, no push, nothing
# published from code nobody has reviewed.
#
# There is deliberately no `paths:` filter. Every file in this repository is
# copied into the image, so there is no such thing as a change that cannot
# affect it — and the tests below are the only place the `test/` suite runs in
# CI, which a docs-only pull request has no business skipping.
#
# Each architecture is built and tested in its own job, on a runner of that
# same architecture (this is the check TD26072607 exists for: an arm64 image
# had only ever been proved to build, never to run). Native runners rather
# than QEMU emulation, for two reasons. First, cost: the emulated `test/`
# suite ran ~11x slower (~15 minutes against ~1.5), tripling this workflow,
# whereas GitHub's arm64 runners are free for public repositories just as the
# amd64 ones are, and the two legs run concurrently — so full coverage of
# both architectures on every pull request costs nothing and adds no
# wall-clock. Second, evidence: a pass under emulation proves the image runs
# on QEMU's approximation of arm64; a pass on an arm64 runner proves it runs
# on arm64.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A superseded build of the same branch is of no interest to anyone: only the
# newest commit can become an image. `main` is excluded from cancellation
# because each merge's image is published under its own SHA tag, and cancelling
# one would leave a commit with no image.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/poetic-poems/agent-ops

jobs:
  # What the image cannot work out about itself, computed once so that every
  # job builds with byte-identical build args — the same `built_at` in
  # particular, which is what lets the publish job reassemble the very layers
  # the build jobs tested from the shared cache instead of rebuilding them.
  # `.dockerignore` keeps `.git` out (the image is a deployment, not a working
  # tree), so the revision has to be handed in at build time — see the version
  # stamp in deploy/docker/Dockerfile, and lib/version.sh which reads it back.
  #
  # The pull request number is the half an operator can use: every change
  # here is squash-merged as `<subject> (#N)`, so the trailing marker on the
  # commit being built names the last pull request the image contains. On a
  # pull request build the checked-out commit is a merge commit with no such
  # marker, so the event supplies the number instead — that build is never
  # published, but a stamp that works there is one that can be tested there.
  stamp:
    name: Work out the version stamp
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.stamp.outputs.commit }}
      pr: ${{ steps.stamp.outputs.pr }}
      built_at: ${{ steps.stamp.outputs.built_at }}
      repo: ${{ steps.stamp.outputs.repo }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Work out the version stamp
        id: stamp
        shell: bash
        run: |
          pr="${{ github.event.pull_request.number }}"
          # An `if`, not `[[ … ]] && pr=…`: this step runs under `set -e`, where
          # a non-matching test is the last command of the list and would fail
          # the whole build for the ordinary case of a commit with no marker.
          if [[ -z "$pr" ]]; then
            subject="$(git log -1 --pretty=%s)"
            if [[ "$subject" =~ \(#([0-9]+)\)[[:space:]]*$ ]]; then
              pr="${BASH_REMATCH[1]}"
            fi
          fi
          {
            printf 'commit=%s\n'   "$GITHUB_SHA"
            printf 'pr=%s\n'       "$pr"
            printf 'built_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'repo=%s\n'     "$GITHUB_REPOSITORY"
          } >> "$GITHUB_OUTPUT"
          printf 'building %s as PR #%s\n' "$GITHUB_SHA" "${pr:-<none>}"

  build:
    name: Build and test (${{ matrix.platform }})
    needs: stamp
    strategy:
      # One architecture's failure says nothing about the other's, and telling
      # "broken everywhere" apart from "broken on arm64 alone" is this matrix's
      # whole point.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache-scope: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache-scope: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # No QEMU setup: the runner's own architecture matches `platform`, so
      # both the Dockerfile's RUN instructions and every `docker run` below
      # execute natively.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          # One platform explicitly, and loaded into the runner's Docker
          # rather than pushed, so every check below runs against the very
          # bytes that will be published for this architecture. `docker load`
          # cannot take a multi-platform result, which is what the publish
          # job's separate build is for.
          platforms: ${{ matrix.platform }}
          load: true
          tags: agent-ops:ci
          build-args: |
            AGENT_OPS_COMMIT=${{ needs.stamp.outputs.commit }}
            AGENT_OPS_PR=${{ needs.stamp.outputs.pr }}
            AGENT_OPS_BUILT_AT=${{ needs.stamp.outputs.built_at }}
            AGENT_OPS_REPO=${{ needs.stamp.outputs.repo }}
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

      # The acceptance checks of docs/IMPLEMENTATION-PIPELINE-SPEC.md (1b), run
      # here so a broken image cannot reach a node. `docker run` goes through
      # the entrypoint, which is itself part of what is being tested: it must
      # prepare a fresh container's state and exec what it was given.
      - name: Verify the toolchain
        run: |
          docker run --rm agent-ops:ci bash -lc '
            set -e
            for bin in bash git jq curl python3 perl flock sha256sum rsync node claude gh supercronic; do
              command -v "$bin" >/dev/null || { echo "missing: $bin" >&2; exit 1; }
              printf "%-12s %s\n" "$bin" "$(command -v "$bin")"
            done
            node --version
            gh --version | head -n1
            claude --version
          '

      - name: Verify the container crontab
        run: docker run --rm agent-ops:ci supercronic -test /app/deploy/docker/crontab

      # The Claude config file must resolve *inside* the claude-config volume's
      # mount point. Its default home is `~/.claude.json`, a sibling of that
      # directory and so part of the container's writable layer, where every
      # watchtower roll destroys it. That is not visible in any test — the
      # symptom is a warning on stderr and a config silently rebuilt from
      # nothing — so it is asserted against the built image instead.
      #
      # Against the image's own config, not a running container's environment:
      # entrypoint.sh defaults the variable when it is unset, so a runtime
      # check would pass with the ENV line deleted and prove nothing. The ENV
      # is also the only copy `docker compose exec scheduler claude` sees — an
      # interactive login does not go through the entrypoint — and without it
      # that login writes to the ephemeral ~/.claude.json while the cron cycles
      # use the volume.
      - name: Verify the Claude config directory is on a persistent volume
        run: |
          env_line="$(docker image inspect agent-ops:ci \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep '^CLAUDE_CONFIG_DIR=' || true)"
          [ -n "$env_line" ] || { echo "the image sets no CLAUDE_CONFIG_DIR" >&2; exit 1; }
          [ "$env_line" = "CLAUDE_CONFIG_DIR=/home/agent/.claude" ] || {
            echo "$env_line does not name the claude-config mount point /home/agent/.claude" >&2
            exit 1
          }
          echo "$env_line"

      # The stamp is only useful if the image can read it back, and its failure
      # mode is silent: a node whose version says "unknown" looks exactly like
      # one the dashboard has not heard from yet.
      - name: Verify the image knows its own version
        run: |
          # `tail -n 1`, because every `docker run` here goes through the
          # entrypoint and the entrypoint reports what it prepared on stdout.
          # The version is a single line of compact JSON, and it is the last
          # thing written.
          out="$(docker run --rm agent-ops:ci bash -lc '
            . /app/lib/version.sh
            agent_ops_version
          ' | tail -n 1)"
          echo "$out"
          [ "$(jq -r '.source' <<<"$out")" = "image" ] || { echo "no CI stamp in the image" >&2; exit 1; }
          [ "$(jq -r '.commit' <<<"$out")" = "${{ needs.stamp.outputs.commit }}" ] \
            || { echo "the stamped commit is not the commit being built" >&2; exit 1; }
          [ "$(jq -r '.pr' <<<"$out")" = "${{ needs.stamp.outputs.pr }}" ] \
            || { echo "the stamped pull request is not the one being built" >&2; exit 1; }

      - name: Run the test suite inside the image
        run: |
          docker run --rm agent-ops:ci bash -lc '
            failed=0
            for t in /app/test/*.test.sh; do
              if bash "$t" > /tmp/out 2>&1; then
                echo "PASS $(basename "$t")"
              else
                echo "FAIL $(basename "$t")"
                cat /tmp/out
                failed=1
              fi
            done
            exit "$failed"
          '

      # The role guard (requirement 2.4) with no role set: the image's own
      # default must be to spend nothing.
      - name: Verify a node with no role stands down
        run: |
          out="$(docker run --rm agent-ops:ci /app/agent-cycle.sh)"
          echo "$out"
          case "$out" in
            *"skipped — this node is standby"*) ;;
            *) echo "expected the role guard to stand the node down" >&2; exit 1 ;;
          esac

  publish:
    name: Publish to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [stamp, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Insurance, not the build path: with both architectures' layers in the
      # shared cache this job executes no RUN instructions, but if the cache
      # has been evicted the arm64 leg rebuilds here under emulation rather
      # than failing — slow is better than no image on `main`.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A build rather than a `docker push`: both architectures are already in
      # the build cache, each written by its own build job, so this costs
      # seconds and produces the same two images, while letting buildx write
      # and push the manifest list the registry wants — one `platforms:` build
      # with `push: true` publishes both architectures under each tag as a
      # single manifest list, which is what lets a node on either architecture
      # pull `:latest` and get the image built for it.
      #
      # Two tags: `latest`, which is what a node's watchtower follows, and the
      # commit SHA, which is how a node is pinned to a known-good build or
      # rolled back to one (AGENT_OPS_IMAGE in deploy/docker/.env).
      - name: Publish to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Identical to the build jobs' args, so the cache is reused and the
          # published image carries the stamp the checks just verified.
          build-args: |
            AGENT_OPS_COMMIT=${{ needs.stamp.outputs.commit }}
            AGENT_OPS_PR=${{ needs.stamp.outputs.pr }}
            AGENT_OPS_BUILT_AT=${{ needs.stamp.outputs.built_at }}
            AGENT_OPS_REPO=${{ needs.stamp.outputs.repo }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
          # `image.source` is what links the package to this repository, so the
          # package page carries the README and the commit history rather than
          # standing on its own with no explanation.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=The agent-ops node image: the pipelines and their whole toolchain.
            org.opencontainers.image.licenses=NOASSERTION

      - name: Say what was published
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:latest"
            echo "docker pull ${IMAGE}:${GITHUB_SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
