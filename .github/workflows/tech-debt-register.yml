name: Tech-debt register check

# Gates the tech-debt register's consistency, whichever format the repository
# is on:
#   - per-item format (a tech-debt/ directory): every item file must carry
#     well-formed frontmatter — id matching its filename and the repository's
#     declared scope, a recognised status, resolution fields consistent with
#     that status — no register file may ever be deleted or renamed (the
#     append-only Ledger guarantee), and the old single-file format must not
#     regrow inside TECH-DEBT.md.
#   - legacy format (a single TECH-DEBT.md): every open/in-progress Ledger
#     row must have exactly one "### <id>" body under Current Items, and no
#     resolved or not-debt row may still have one. Resolving is a two-part
#     edit — flip the Ledger row, remove the body — and the second part was
#     repeatedly missed, leaving resolved items looking live.
#
# Deliberately `pull_request` (not `pull_request_target`), so a fork PR never
# runs with write-scoped secrets, and ungated by `paths:` — the register is
# checked on every PR, since drift can also arrive from an edit elsewhere.
#
# scripts/td-check.pl is the canonical copy for the sibling repositories,
# which hold byte-identical copies guarded by their td-tooling-drift workflow.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the deletion guard can diff against the merge
          # base of the PR's base branch.
          fetch-depth: 0
      - name: Check register consistency
        run: perl scripts/td-check.pl
      - name: Register files are permanent
        if: github.event_name == 'pull_request'
        # The append-only Ledger guarantee: once an item file is on the base
        # branch, no PR may delete or rename it. Files not yet on the base
        # can still be renamed, e.g. to resolve an ID-allocation collision.
        run: |
          removed=$(git diff --name-only --diff-filter=DR \
            "origin/${GITHUB_BASE_REF}...HEAD" -- tech-debt/)
          if [ -n "$removed" ]; then
            echo "::error::tech-debt/ item files are permanent, but this PR deletes or renames:"
            echo "$removed"
            exit 1
          fi
      - name: Old format must not regrow
        # Once the per-item register exists, item bodies belong in
        # tech-debt/, never as "### TD..." sections in the policy document.
        run: |
          if [ -d tech-debt ] && grep -qE '^### TD' TECH-DEBT.md; then
            echo "::error file=TECH-DEBT.md::per-item register present, but TECH-DEBT.md still contains old-format item sections"
            exit 1
          fi
