# deploy/docker/egress-proxy.conf — the scheduler's egress fence (D24;
# IMPLEMENTATION-PIPELINE-SPEC, "The node stack").
#
# Default-deny: the scheduler sits on an internal-only Docker network with no
# route to the internet, and this proxy — on both that network and the
# default one — is the only way out. Squid permits exactly one thing: CONNECT
# to port 443 on a domain the allowlist names. No plain HTTP, no other ports,
# no caching, nothing stored. The TLS inside the tunnel is untouched — this
# is a domain fence, not an interception proxy, so no client trusts any
# certificate it otherwise wouldn't.
#
# The allowlist squid reads is /tmp/egress-allowlist, written at container
# start by egress-proxy-start.sh: the image's baked
# deploy/docker/egress-allowlist.txt plus the node's own EGRESS_EXTRA_ALLOW
# additions. Fleet-wide changes belong in the baked file (they ship with the
# image); a single node's extra domain belongs in its .env.
#
# `squid -k parse -f` over this file is asserted at image build time
# (deploy/docker/Dockerfile), so a config typo fails the build, not a node.

http_port 3128
visible_hostname egress-proxy

# A proxy, never a cache: nothing is stored, so nothing can be poisoned in or
# read back out of a cache layer.
cache deny all

# Logs to the container's stdout/stderr like every other service; no pid file
# because squid runs foreground (-N) as pid 1's child and nothing signals it
# by file.
access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename none

# Rolls should be fast: squid's default shutdown grace holds a recreate for
# 30 seconds to drain tunnels that die with the container anyway.
shutdown_lifetime 1 seconds

acl SSL_ports port 443
acl CONNECT method CONNECT
acl allowed_dst dstdomain "/tmp/egress-allowlist"

# CONNECT to 443 on an allowlisted domain, and nothing else at all. The
# order is load-bearing: squid takes the first rule that matches, so the
# final deny is what makes every unlisted destination — and every non-CONNECT
# request — a refusal.
http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed_dst
http_access deny all
