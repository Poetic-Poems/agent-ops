# deploy/docker/compose.yaml — one node of the agent-ops operation.
#
#   cd deploy/docker && cp .env.example .env && $EDITOR .env && docker compose up -d
#
# Every node runs this same file with the same image; the only thing that
# differs between them is .env — the node's name, its role, and its tokens.
# That is the whole point: a node is not configured, it is instantiated.
#
# Which services start is decided by COMPOSE_PROFILES in .env, so the command
# above is the same everywhere:
#
#   tailnet      the dashboard, reachable over the owner's tailnet (the normal
#                deployment; needs TS_AUTHKEY)
#   local        the dashboard on the host's own loopback instead, for a
#                machine with no tailnet or no authkey to hand
#   auto-update  watchtower, which pulls new images and restarts into them
#
# The scheduler belongs to no profile: it runs on every node under every
# profile, because a node that runs no cycles and no heartbeat is not a node.

name: agent-ops

# Everything the two agent-ops services share. They are the same image running
# different commands over the same state — the dashboard renders what the
# scheduler's cycles record — so their environment and volumes are defined once
# here and merged into both.
x-agent-ops: &agent-ops
  # The registry image is the deployment artefact, and there is deliberately no
  # `build:` stanza: a node holds this file and its .env, not a clone, so a
  # build context would be a path that does not exist there. To run an image
  # built locally (docker build -f deploy/docker/Dockerfile -t agent-ops .),
  # set AGENT_OPS_IMAGE in .env.
  image: ${AGENT_OPS_IMAGE:-ghcr.io/poetic-poems/agent-ops:latest}
  restart: unless-stopped
  # --- Resource ceilings (D14) --------------------------------------------
  # What is shared by all three agent-ops services; the per-service memory and
  # CPU ceilings are on the services themselves, because a dashboard and a
  # scheduler are not the same size and pretending otherwise would set both
  # wrong.
  #
  # These are *ceilings*, not reservations. Docker does not reserve, so the sum
  # of every limit in this file may legitimately exceed the host's memory: a
  # limit bounds the blast radius of one runaway container, it does not make the
  # set of them fit. Where the host is small enough that the sum matters — a WSL2
  # VM capped at 6 GiB running two nodes, which is the deployment this was
  # measured on — the defaults below are chosen so the whole file fits: one
  # tailnet node at 2.4 GiB plus one local node at 2.2 GiB leaves headroom for
  # the VM itself. Every one is overridable per node in .env, because a node on
  # a bigger host should not inherit a laptop's arithmetic.
  #
  # Not set, and not an oversight: disk and bandwidth, the other two budgets D14
  # names. Docker's blkio throttles need kernel support the WSL2 kernel does not
  # have (`docker info` warns "No blkio throttle.read_bps_device support"), and
  # there is no per-container egress cap in Compose at all. Both are bounded
  # today only by what the pipeline itself does — which, on the evidence of a
  # 4 GB peer-clone directory and month-old workspaces nothing reaps, is not
  # bounded at all. That is housekeeping's job, not this file's.
  #
  # A process ceiling as well as a memory one: the scheduler forks git, gh, jq
  # and claude per stage, and a fork loop exhausts a host's pid space long
  # before it exhausts its memory — the failure then takes the *host* down, not
  # the container, which is the one outcome a limit exists to prevent.
  pids_limit: ${AGENT_OPS_PIDS_LIMIT:-1024}
  # Unbounded json-file logs are how a long-lived node fills a disk without
  # anyone choosing to store anything. watchtower below has carried an explicit
  # rotation since issue #155; there was never a reason the services that
  # actually produce log volume should not.
  logging:
    driver: json-file
    options:
      max-size: ${AGENT_OPS_LOG_MAX_SIZE:-10m}
      max-file: ${AGENT_OPS_LOG_MAX_FILE:-5}
  environment:
    # A node stands down unless it is explicitly told otherwise
    # (IMPLEMENTATION-PIPELINE-SPEC requirement 2.4). Defaulting the default is
    # deliberate: an .env copied from the example, or a variable lost in a
    # restart, must not turn a spare node into a second worker.
    AGENT_OPS_ROLE: ${ROLE:-standby}
    NODE_NAME: ${NODE_NAME:-unnamed}
    # The minute of each hour this node's cycle fires (1-59). Unset means a
    # stable hash of NODE_NAME — see deploy/docker/render-crontab.sh.
    CYCLE_MINUTE: ${CYCLE_MINUTE:-}
    GH_TOKEN: ${GH_TOKEN:-}
    GIT_USER_NAME: ${GIT_USER_NAME:-}
    GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
    # What lets a stage check the Vercel preview its own pull request deploys
    # (scripts/preview-deploy.sh). Both optional, and a node without either
    # runs every cycle exactly as before: the check then reports "could not
    # check" rather than a verdict, which is the honest answer and not a
    # failure. The first is the project's Protection Bypass for Automation
    # secret, without which every preview answers the SSO login page; the
    # second buys the build log when a deployment failed.
    VERCEL_AUTOMATION_BYPASS_SECRET: ${VERCEL_AUTOMATION_BYPASS_SECRET:-}
    VERCEL_TOKEN: ${VERCEL_TOKEN:-}
    # The Pullwright Approver App's identity (D18 §5.3, lib/approver-token.sh) —
    # what lets a `merge_autonomy` above `human` mint a review as a non-author.
    # All three are optional, and all three must arrive together:
    # `approver_token_credential_present` requires both ids *and* a readable
    # key, so a partial set reads as "not configured", the Approver stage skips
    # the App review, and the human merges exactly as at `human`.
    #
    # They have to be named here explicitly. This block is an allowlist, and
    # there is no `env_file:` anywhere in this file — compose reads .env for
    # `${...}` interpolation only, never injecting it into a container — so a
    # variable an operator adds to a node's .env and that is not named here is
    # silently absent from every cycle. That is precisely how these three came
    # to be set on all four nodes while no cycle could see any of them.
    PULLWRIGHT_APPROVER_APP_ID: ${PULLWRIGHT_APPROVER_APP_ID:-}
    PULLWRIGHT_APPROVER_INSTALLATION_ID: ${PULLWRIGHT_APPROVER_INSTALLATION_ID:-}
    PULLWRIGHT_APPROVER_PRIVATE_KEY_PATH: ${PULLWRIGHT_APPROVER_PRIVATE_KEY_PATH:-}
    TZ: ${TZ:-Pacific/Auckland}
  volumes:
    # The three things that must survive a container being replaced by a newer
    # image. Everything else in the container is rebuilt from the image.
    - state:/home/agent/.local/state/poetic-agents
    - claude-config:/home/agent/.claude
    - workspaces:/home/agent/.cache/poetic-agents/workspaces
    # This file, handed to the containers it creates, so a node can tell when
    # its copy has fallen behind the repository (issue #131: nothing else can
    # — an image roll delivers new code but never compose-level config, and a
    # node holds no clone to compare against). lib/compose-drift.sh diffs the
    # mount against the image's own copy and the verdict travels in the
    # heartbeat; a container that finds no file here is running from a
    # compose.yaml too old to carry this line, and reports exactly that.
    - ./compose.yaml:/host/compose.yaml:ro
    # The Approver App's private key, mounted read-only at the *same* absolute
    # path it has on the host, so `PULLWRIGHT_APPROVER_PRIVATE_KEY_PATH` above
    # is correct on both sides of the boundary and a node keeping its key
    # somewhere else needs no second variable and no edit here. The host uid is
    # preserved through a bind mount, so a `chmod 600` key owned by a uid-1000
    # host user is readable by the container's `agent` (also uid 1000) and by
    # nothing else.
    #
    # `/dev/null` when the variable is unset, which self-mounts as a harmless
    # no-op: compose has no conditional volumes, and a missing bind source
    # would otherwise have Docker create a *directory* at the target — which
    # `[ -r ]` would then pass while openssl failed on it, turning "not
    # configured" into a confusing runtime error. With /dev/null the variable
    # itself is empty, so `approver_token_credential_present` returns false and
    # the credential is correctly reported absent.
    - ${PULLWRIGHT_APPROVER_PRIVATE_KEY_PATH:-/dev/null}:${PULLWRIGHT_APPROVER_PRIVATE_KEY_PATH:-/dev/null}:ro
  labels:
    # Only containers carrying this label are watchtower's business — the
    # laptop runs unrelated containers that are none of it.
    com.centurylinklabs.watchtower.enable: "true"
    # And a roll waits for the cycle it would otherwise kill. watchtower runs
    # this script inside the container it is about to update and treats exit 75
    # (EX_TEMPFAIL) as "cancel this one, try again next poll"; the script exits
    # 75 while either pipeline's lock is held by a live process. See
    # watchtower-pre-update.sh for why that is the right question to ask, and
    # WATCHTOWER_LIFECYCLE_HOOKS below, without which the label is inert.
    #
    # It is on the shared block, so it covers the dashboard services as well as
    # the scheduler, and that is not merely tidiness: all three run the same
    # image, and watchtower records what it stopped in a map keyed by *image*
    # id, then restarts every container marked for update whose image is in
    # that map. A scheduler that deferred while a dashboard on the same image
    # did not would be recreated anyway, by the dashboard's entry — the
    # deferral would be silently undone.
    #
    # The label alone does not make them agree, though this comment used to
    # claim it did. Agreement needs each container to *evaluate* the shared
    # lock correctly, and a pid is only meaningful in the PID namespace that
    # minted it: on 2026-07-28 the dashboard ran the hook on the scheduler's
    # live lock, found the pid dead in its own namespace, exited 0, and
    # watchtower duly tried to recreate the deferred scheduler off the
    # dashboard's map entry (#130). The hook therefore honours any lock its
    # own container did not write, without a liveness check, until it is
    # released or stale — which is what actually makes the sharers agree.
    #
    # One disagreement no hook can close: a second compose project on the same
    # host (the two-nodes-one-machine layout) runs this image over its *own*
    # state volume, so it rolls whenever its own node is idle, and its map
    # entry still names the shared image. What holds a deferral then is that
    # the deferred container was never stopped, so the create fails on its
    # name — noisy in watchtower's log (a Failed count and a name-conflict
    # error every poll), but the cycle survives, and the roll lands on the
    # first poll after it ends.
    com.centurylinklabs.watchtower.lifecycle.pre-update: /app/deploy/docker/watchtower-pre-update.sh
    # Minutes (watchtower's unit here), and also its default — stated because
    # the value is load-bearing and a reader should not have to know the
    # default. The check is a handful of jq invocations, so a minute is
    # enormous; it exists for the case where the container is too wedged to
    # answer.
    #
    # And that case fails OPEN, which is the opposite of what this comment used
    # to claim. watchtower's timeout branch is `case <-timeout: return nil`,
    # giving `SkipUpdate = false` — its own documentation puts it as "a timeout
    # will occur, forcing Watchtower to continue the update loop". So a
    # container too wedged to answer within the minute is rolled anyway, and the
    # cycle it was running dies: precisely the outcome the hook exists to
    # prevent, in the one situation the timeout was set for.
    #
    # Left at one minute regardless, deliberately. The documented alternative is
    # `0`, which disables the timeout entirely and so fails closed — but it
    # trades a bounded, rare loss for an unbounded one, because watchtower then
    # waits on the hook indefinitely and a single wedged container stops the
    # whole fleet updating. A minute is the lesser hazard while the hook stays
    # this cheap; revisit if it ever grows work that could legitimately take
    # longer, since the failure is silent either way.
    com.centurylinklabs.watchtower.lifecycle.pre-update-timeout: "1"

services:
  # The pipelines themselves: supercronic running deploy/docker/crontab. On a
  # standby node this still runs, and each cycle line writes one log line and
  # exits — the schedule is identical everywhere, and failing over is a change
  # of ROLE rather than an edit to a crontab.
  scheduler:
    <<: *agent-ops
    command: ["supercronic", "/app/deploy/docker/crontab"]
    # Measured 2026-08-24 over a 30-second window with a cycle in flight:
    # 190-290 MiB resident, CPU pinning 1.0-1.3 cores. The ceiling is ~5x the
    # observed peak, which is headroom for a stage that reads more than the
    # measured ones did rather than a guess dressed as a budget — and it is the
    # number to revise first when #606's real measurements land.
    #
    # The trade this makes, stated because D14 requires it stated: a stage whose
    # working set exceeds 1.5 GiB is now killed by the OOM killer mid-cycle
    # instead of taking the host down with it. That is the intended exchange —
    # one lost cycle, loudly, over a frozen machine — but it is an exchange, and
    # a node that starts losing cycles to exit 137 should raise this rather than
    # conclude the pipeline is broken.
    mem_limit: ${AGENT_OPS_SCHEDULER_MEMORY:-1536m}
    cpus: ${AGENT_OPS_SCHEDULER_CPUS:-2.0}

  # --- tailnet profile ---------------------------------------------------
  # Tailscale in a sidecar, with the dashboard sharing its network namespace.
  # This is what lets a remote browser reach a server that binds 127.0.0.1:
  # the two containers *are* one loopback, so Serve can proxy to the dashboard
  # while nothing on any network can. The privacy model of DASHBOARD-SPEC
  # survives the move to containers without the server changing a line.
  tailscale:
    image: tailscale/tailscale:latest
    profiles: [tailnet]
    hostname: ${NODE_NAME:-agent-ops}
    # Bounded, unlike every other service in this file: `unless-stopped`
    # restarts on any exit code, so a container that refuses to start over a
    # credential no restart can fix would retry forever. `on-failure:5` still
    # gives a genuine transient failure a few attempts, then leaves the
    # container stopped with its error in `docker compose logs tailscale`.
    # The cost is documented and accepted: Docker's own restart-policy
    # reference says `on-failure` "doesn't restart the container if the daemon
    # restarts", where `unless-stopped` does — so after a host reboot this
    # sidecar, and the `dashboard` sharing its namespace, may need a
    # `docker compose up -d` that the rest of the stack does not.
    restart: on-failure:5
    # 52 MiB resident and effectively no CPU, measured 2026-08-24. A sidecar
    # whose whole job is to hold a WireGuard tunnel open has no business growing,
    # so the ceiling is tight; it does not inherit the anchor's, because this
    # service does not use the anchor.
    mem_limit: ${AGENT_OPS_TAILSCALE_MEMORY:-256m}
    cpus: ${AGENT_OPS_TAILSCALE_CPUS:-0.5}
    pids_limit: ${AGENT_OPS_SIDECAR_PIDS_LIMIT:-256}
    logging:
      driver: json-file
      options:
        max-size: ${AGENT_OPS_LOG_MAX_SIZE:-10m}
        max-file: ${AGENT_OPS_LOG_MAX_FILE:-5}
    # /usr/local/bin/containerboot is the image's own default command: the
    # tailscale/tailscale image sets `CMD`, not `ENTRYPOINT`, and an
    # `entrypoint:` here clears that CMD — hence naming the binary explicitly
    # below rather than falling through to it. Guarded here rather than left to
    # tailscaled's own behaviour: without TS_AUTHKEY, tailscaled starts
    # anyway, asks for an interactive login it has no way to complete, and
    # exits 0 — but only after it has already generated and registered a
    # brand new node key against the tailnet. Every restart of that silent
    # loop did the same, leaving 1,421 ephemeral nodes behind on one node
    # over nine days before anyone noticed (issue #644). Checking first means
    # a missing credential never reaches tailscaled at all.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$TS_AUTHKEY" ]; then
          echo "tailscale: ERROR: TS_AUTHKEY is empty but the 'tailnet' profile is active (this file's own header comment: \"needs TS_AUTHKEY\") -- set TS_AUTHKEY in this node's .env or drop 'tailnet' from COMPOSE_PROFILES. Refusing to start." >&2
          exit 1
        fi
        exec /usr/local/bin/containerboot
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${NODE_NAME:-agent-ops}
      TS_STATE_DIR: /var/lib/tailscale
      # Serve (never Funnel): the dashboard is published to the owner's tailnet
      # and to nothing else. See ts-serve.json.
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./ts-serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  dashboard:
    <<: *agent-ops
    profiles: [tailnet]
    command: ["/app/scripts/serve-dashboard.sh", "8787"]
    # 54 MiB resident, measured 2026-08-24. Overrides the anchor's scheduler-
    # sized ceiling: this container renders a page from state another container
    # wrote, and giving it a scheduler's budget would mean two nodes reserving
    # 3 GiB of headroom for two processes that use a tenth of it.
    mem_limit: ${AGENT_OPS_DASHBOARD_MEMORY:-512m}
    cpus: ${AGENT_OPS_DASHBOARD_CPUS:-1.0}
    pids_limit: ${AGENT_OPS_DASHBOARD_PIDS_LIMIT:-512}
    # Bounded like the sidecar it shares a namespace with, overriding the
    # anchor's `unless-stopped`: this container cannot start at all without
    # `tailscale`'s namespace to join, so once the sidecar has given up
    # (`restart: on-failure:5` above) every further attempt here fails the
    # same way for the same unfixable reason. Left at `unless-stopped` this
    # retried at Docker's capped backoff forever after the sidecar had
    # already stopped — a container thrashing where none of the loop issue
    # #644 was fixing had moved, just to a different service
    # (TD-PPagop-26082303). `on-failure:5` is not this container's own
    # transient-error budget; it exists only so this container settles on
    # the same schedule as the dependency it cannot run without.
    restart: on-failure:5
    # No `ports` and no `networks` are possible here, by construction: this
    # container has no network stack of its own. It reaches the tailnet, and is
    # reached, only through the sidecar above.
    network_mode: service:tailscale
    # Wait for the scheduler as well as the sidecar. On a node's first start the
    # shared `state` volume is empty and Docker seeds it from the image's mount
    # point; two containers seeding the same fresh volume at once race, and one
    # loses with `mkdir … /cycles: file exists`, aborting the whole `up`. Letting
    # the scheduler seed it first makes that impossible. On every later start the
    # volume already exists, so this only orders startup.
    depends_on:
      - tailscale
      - scheduler

  # --- local profile -----------------------------------------------------
  # The same dashboard for a node with no tailnet, published on the host's
  # loopback and nowhere else — the same guarantee the tailnet profile gets from
  # the sidecar.
  #
  # Two halves make that up, and both are load-bearing. The server is told to
  # bind 0.0.0.0 *inside the container*, because a server on the container's own
  # loopback is reachable from nothing, not even a published port. The port is
  # then published to 127.0.0.1 on the host, which is what keeps the page off
  # every network the host is on. Binding the container wide is not an exposure:
  # the container's addresses are on Docker's private bridge, and the only route
  # in from outside it is the loopback-scoped mapping below.
  #
  # This used to be `network_mode: host` instead, which reached the same place by
  # putting the server's 127.0.0.1 bind directly on the host's loopback. That is
  # a Linux-only container-runtime feature — under Docker Desktop the namespace
  # shared is the Desktop VM's, not the user's, so the page simply never answered
  # — and it made the listener the host's, so a machine already using 8787 got
  # `Address already in use`. Publishing works on any runtime, and DASHBOARD_PORT
  # now moves only the host side of the mapping.
  dashboard-local:
    <<: *agent-ops
    profiles: [local]
    command: ["/app/scripts/serve-dashboard.sh", "8787", "0.0.0.0"]
    # The same page and the same ceilings as the `dashboard` service above; only
    # how it is reached differs. 11 MiB resident, measured 2026-08-24.
    mem_limit: ${AGENT_OPS_DASHBOARD_MEMORY:-512m}
    cpus: ${AGENT_OPS_DASHBOARD_CPUS:-1.0}
    pids_limit: ${AGENT_OPS_DASHBOARD_PIDS_LIMIT:-512}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8787}:8787"
    # Depend on the scheduler so the shared `state` volume is seeded by one
    # container on a node's first start, not two at once. See the `dashboard`
    # service above for why.
    depends_on:
      - scheduler

  # --- auto-update profile -----------------------------------------------
  # How a node picks up new code: CI builds an image from main, watchtower
  # notices the new tag and restarts the services into it. There is no `git
  # pull` anywhere in this design.
  watchtower:
    image: containrrr/watchtower:latest
    profiles: [auto-update]
    restart: unless-stopped
    # 28 MiB resident, measured 2026-08-24. It polls a registry and calls the
    # daemon; there is no workload here that a ceiling this size can obstruct.
    mem_limit: ${AGENT_OPS_WATCHTOWER_MEMORY:-128m}
    cpus: ${AGENT_OPS_WATCHTOWER_CPUS:-0.5}
    pids_limit: ${AGENT_OPS_SIDECAR_PIDS_LIMIT:-256}
    environment:
      # Opt-in by label: watchtower must not touch containers this stack does
      # not own.
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      # Without this the lifecycle labels on the agent-ops containers are read
      # by nobody and every roll lands mid-cycle again. It is a watchtower
      # process flag, so it belongs here and nowhere else.
      WATCHTOWER_LIFECYCLE_HOOKS: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL-300}
      # Belt and braces to the hook above: a node may roll on a cron expression
      # instead of a poll, putting the roll somewhere its cycles are not. Empty
      # by default and left empty on most nodes — the hook is the fix, and
      # polling every five minutes is what makes a deferred roll cheap, because
      # the retry is five minutes away rather than a day.
      #
      # The two are mutually exclusive: watchtower exits fatally with "Only
      # schedule or interval can be defined, not both" if it sees both, and a
      # watchtower that will not start is a node that silently stops updating.
      # An *empty* value does not count as set, which is why the interval above
      # uses `-` and not `:-` — writing `WATCHTOWER_POLL_INTERVAL=` in .env
      # clears it, leaving the schedule alone in the field.
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE:-}
      # The containrrr/watchtower image is effectively unmaintained and its
      # baked-in Docker client still defaults to API version 1.25. A modern
      # daemon — Docker 25+, as installed by get.docker.com on a fresh Ubuntu
      # 26.04 host — refuses anything below 1.40 ("client version 1.25 is too
      # old. Minimum supported API version is 1.40"), and watchtower then
      # crash-loops, so the node silently stops auto-updating and drifts off
      # the fleet's image digest. Forcing a supported version fixes it; 1.40
      # (Docker 19.03, 2019) is accepted by every daemon this stack runs on,
      # including WSL's older engine, so it is safe as the default everywhere.
      DOCKER_API_VERSION: ${DOCKER_API_VERSION:-1.40}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Pinned rather than left at the `json-file` default, whose rotation
    # under Docker Desktop/WSL2 turned out not to be trustworthy at all: on
    # this laptop a full read and a `--tail 1` read of this very container's
    # log disagreed about the newest line by three days (issue #155). This
    # is the one container nothing ever rolls, so it is also the one whose
    # own history has to be readable on its own terms — a bounded, explicit
    # rotation rather than whatever the runtime happens to do.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  default:
    driver_opts:
      # Docker gives a bridge network an MTU of 1500 regardless of the host's.
      # Where the host's egress is smaller — a WireGuard or Tailscale link, some
      # cloud instances, this laptop's WSL interface at 1300 — the mismatch is a
      # black hole: DNS resolves and plain HTTP works, while anything with a
      # full-sized packet in it (every TLS handshake, so every `gh`, `claude`
      # and `git clone`) hangs and then resets. It looks like a broken token or
      # a broken registry, and it is neither.
      #
      # So set DOCKER_MTU in .env to the host's egress MTU
      # (`ip route get 1.1.1.1` names the interface; `ip link show <if>` gives
      # its MTU) whenever that is below 1500. The default changes nothing on a
      # node whose network is ordinary.
      com.docker.network.driver.mtu: ${DOCKER_MTU:-1500}

volumes:
  # Cycle records, logs, locks, the published dashboard — the node's memory of
  # what it has done. Phase E of the migration makes this the thing that syncs
  # between nodes; until then it is per-node.
  state:
  # Claude's OAuth credentials, which refresh themselves and cannot be
  # regenerated from the image. The one volume whose loss costs a manual login.
  claude-config:
  # Throwaway clones. Kept in a volume rather than the container layer so a
  # restart mid-cycle does not orphan a large tree inside a dead container.
  workspaces:
  tailscale-state:
